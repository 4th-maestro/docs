<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 디지털트윈</title>
<!--
  ═════════════════════════════════════════════════════════════════════════════
  도면 기반 3D 디지털 트윈 — 시각화 모듈 (iframe 임베딩용 단일 파일)
  대상: 부산대학교 제6공학관(컴퓨터공학관, 건물번호 201) — 층별 피난안내도·와이파이맵(AP 위치)·현장 사진을 참고해 단순화

  화면
    건물 3D  : 층/실 블록 히트맵(온도·습도·전력·상태), 경고 실 빔, [설비 연결]로 실내기(IDU)→실외기(ODU) 배관·냉매 흐름
    층 2D    : 평면도 + 실별 온도·습도·전력·재실 오버레이, Wi-Fi AP·실내기 위치
    방 3D    : 텍스트 없는 볼륨 온도장, 물방울(습도), 사람(재실), 실내기 상태·기류, Wi-Fi AP 신호. (i) 버튼으로 상세 패널

  데이터
    · 기본: 내장 평면 + 가상 데이터(시뮬레이션 시계). 실제 값은 호스트가 twin:update 로 밀어 넣음
    · 모델 교체: ?model=building.json  또는  window.TWIN_CONFIG = {...}
        { buildingName, floors:[{ id:'1F', plan:{ src, pxPerMeter, originPx:[x,y] },
          rooms:[{ id, name, type:'room'|'corridor'|'core'|'wc'|'store', kind?, cap?, poly:[[x,y],...](m),
                   acs:[{ id, x, y, model, rated(kW), odu }] }] }] }

  URL 파라미터
    floor=2F · room=2F-6203 · metric=temp|hum|power|alert · sim=0 · speed=2 · theme=light|dark · origin=https://host

  postMessage
    호스트→트윈 : twin:update {data: twin.realtime/v1 스냅샷} · twin:navigate · twin:metric · twin:highlight {rooms:[id]} · twin:load
                  {source:'maestro', type:'theme', theme:'light'|'dark'} (부모 창 메시지만 수락, 주소 theme와 같은 값. 둘 다 없으면 시스템 설정)
        twin.realtime/v1 = { time, outdoor:{temp,hum}, idus:{id:{power,mode,setTemp,roomTemp,roomHum,fan,vane,kw,error}}, meters:{building:{kw,kwhToday}},
                             wifi:{apId:접속 기기 수}, rooms:{roomId:{occupancy,temp,hum}}, trend:{date, hours:[시간 평균 스냅샷 + h, minutes]} }
    트윈→호스트 : twin:ready · twin:view · twin:alert · roomSelected {source:'twin', roomId} (4th-maestro Frontend 규약) · twin:control {room, setTemp, idus:[id]} (방 설정온도 바꾸기 → 중앙제어기로 전달)
  ═════════════════════════════════════════════════════════════════════════════
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
<style>
  /* 디자인 토큰: 앱 src/index.css(:root, [data-theme='dark'])와 같은 값. iframe이라 앱 CSS를 불러올 수 없어 값을 맞춤
     - 기준: DESIGN.md 운영자 화면 기준(본문 16px, 보조 14px 이상, 누름 영역 44px), docs/human/reference/design-system.md 6절
     - 테마: data-theme(주소 theme 또는 앱 메시지) 우선, 없으면 시스템 설정
     - 차트 색: 이번 값 파랑, 비교 기준 회색(앱 panels.css와 같은 값)
     - 3D 바탕: scene-top·scene-bot은 WebGL이 읽으므로 hex로 지정(isDark는 scene-bot 명도로 판단) */
  :root{
    --page:#f5f5f3; --canvas:#ffffff; --surface-soft:#f7f7f7; --surface-strong:#efefed;
    --hairline:#dddddd; --hairline-soft:#ebebeb; --border-strong:#c1c1c1;
    --ink:#222222; --body:#3f3f3f; --muted:#6a6a6a; --on-ink:#ffffff;
    --primary:#ff385c; --primary-fill:#e00b41; --primary-active:#b8082f;
    --error:#c13515; --danger:#b91c1c; --ok:#15803d; --caution:#b45309;
    --chart-cur:#2a78d6; --chart-prev:#929292;
    --scene-top:#f7f7f7; --scene-bot:#efefed;
    --shadow:rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;
    --r-sm:8px; --r-md:14px; --r-full:9999px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page:#151618; --canvas:#1f2023; --surface-soft:#26282b; --surface-strong:#2e3034;
      --hairline:#3a3c40; --hairline-soft:#303236; --border-strong:#5b5e63;
      --ink:#e6e6e3; --body:#cfcfcb; --muted:#a2a29e; --on-ink:#151618;
      --error:#f2856d; --danger:#f27272; --ok:#4cc27a; --caution:#e0a060;
      --chart-cur:#3987e5; --chart-prev:#7d7d79;
      --scene-top:#26282b; --scene-bot:#1f2023;
      --shadow:rgba(0,0,0,.4) 0 0 0 1px, rgba(0,0,0,.3) 0 4px 8px 0;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --page:#151618; --canvas:#1f2023; --surface-soft:#26282b; --surface-strong:#2e3034;
    --hairline:#3a3c40; --hairline-soft:#303236; --border-strong:#5b5e63;
    --ink:#e6e6e3; --body:#cfcfcb; --muted:#a2a29e; --on-ink:#151618;
    --error:#f2856d; --danger:#f27272; --ok:#4cc27a; --caution:#e0a060;
    --chart-cur:#3987e5; --chart-prev:#7d7d79;
    --scene-top:#26282b; --scene-bot:#1f2023;
    --shadow:rgba(0,0,0,.4) 0 0 0 1px, rgba(0,0,0,.3) 0 4px 8px 0;
    color-scheme:dark;
  }
  /* 이전 토큰 이름: 화면 스크립트가 만드는 마크업이 사용하므로 새 토큰 별칭으로 유지
     - accent: 선택·누를 수 있는 요소 강조(패널 안 primary 미사용 규칙에 따라 ink) */
  :root{
    --bg:var(--page); --panel:var(--canvas); --panel-solid:var(--canvas); --paper:var(--canvas);
    --line:var(--hairline); --line-strong:var(--border-strong); --chip:var(--canvas); --chip-line:var(--hairline);
    --accent:var(--ink); --accent-soft:var(--surface-soft); --warn:var(--caution); --crit:var(--danger);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--page);color:var(--ink);
    font:16px/1.5 'SUIT Variable',SUIT,-apple-system,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  #app{position:relative;width:100%;height:100%}
  button{font:inherit;color:inherit;cursor:pointer}
  button:disabled{cursor:not-allowed}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,.ftag:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .num{font-variant-numeric:tabular-nums}
  svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* 떠 있는 면: 앱 카드와 같은 면·테두리, 그림자는 떠 있는 패널용 1종(반투명·흐림 없음) */
  .glass{background:var(--canvas);border:1px solid var(--hairline);box-shadow:var(--shadow)}

  /* 3D 무대: 앱 3D 도면(.t3)과 같은 surface-soft 바탕 */
  #stage{position:absolute;inset:0;overflow:hidden;background:var(--scene-bot)}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .scene-transition{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  /* 상단 도구 줄: 높이 44px 통일, 같은 묶음 버튼은 너비 1:1, 선택은 ink 채움(앱 .pill.on) */
  #bar{position:absolute;left:16px;right:16px;top:16px;z-index:6;display:flex;align-items:center;gap:8px;pointer-events:none;flex-wrap:wrap}
  #bar > *{pointer-events:auto}
  #title{display:flex;align-items:center;height:44px;border-radius:var(--r-full);padding:0 16px;min-width:0}
  #crumbs{display:flex;align-items:center;gap:4px;font-size:17px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden}
  #crumbs a{color:var(--muted);text-decoration:none;cursor:pointer;font-weight:600}
  #crumbs a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  #crumbs .sep{display:inline-flex;color:var(--muted)}
  #crumbs .sep svg.i{width:16px;height:16px}
  .spacer{flex:1}
  .icon-btn{width:44px;height:44px;border-radius:var(--r-full);display:grid;place-items:center;cursor:pointer;flex:none;padding:0;color:var(--ink)}
  .icon-btn:hover{background:var(--surface-soft)}
  .icon-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
  .seg.glass{background:none;border:0;box-shadow:none}
  .seg button,.tgl{height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;border-radius:var(--r-full);
    border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);font-size:15px;font-weight:500;white-space:nowrap;box-shadow:var(--shadow)}
  .seg button:hover,.tgl:hover{background:var(--surface-soft)}
  .seg button[aria-selected="true"],.tgl[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
  #live{display:flex;align-items:center;gap:8px;height:44px;color:var(--muted);font-size:14px;border-radius:var(--r-full);padding:0 16px;font-variant-numeric:tabular-nums}
  #live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  #live b{color:var(--ink);font-size:16px;font-weight:600}
  #live small{font-size:14px}
  #live.stale .dot{background:var(--muted)}
  #live.stale b{color:var(--muted)}
  /* 화면 도구: 돋보기(확대·축소) · 전체화면 */
  #viewTools button{padding:0;width:44px}
  /* 앱 안(hosted): 상단 바(#bar)가 숨겨지므로 돋보기·전체화면을 3D 화면 오른쪽 아래에 세로로 띄움 (syncHost에서 body로 옮김) */
  body.hosted > #viewTools{position:absolute;right:12px;bottom:12px;z-index:6;display:flex;flex-direction:column;gap:2px;padding:3px;border-radius:999px}
  body.hosted > #viewTools button{height:40px;width:40px}
  #viewTools svg{width:18px;height:18px}
  #plan{transform-origin:50% 50%;transition:transform .22s ease-out}
  #planWrap.zoomed{cursor:grab}
  #planWrap.panning{cursor:grabbing}
  #planWrap.panning #plan{transition:none}
  @media (prefers-reduced-motion: reduce){ #plan{transition:none} }

  /* 핵심 수치 카드(건물): 앱 .kpi 구성(라벨, 값, 단위), 3D 위 겹침이라 값은 21px */
  #kpis{position:absolute;left:16px;top:76px;display:flex;flex-direction:column;gap:8px;z-index:4}
  .kpi{border-radius:var(--r-md);padding:10px 16px 10px 12px;min-width:172px;display:flex;align-items:center;gap:12px}
  .kpi .ic{display:grid;place-items:center;flex:none;color:var(--muted)}
  .kpi small{display:block;font-size:14px;color:var(--muted);font-weight:500;line-height:1.4}
  .kpi b{font-size:21px;font-variant-numeric:tabular-nums;font-weight:700;line-height:1.25}
  .kpi b i{font-style:normal;font-size:14px;color:var(--muted);font-weight:500;margin-left:2px}
  .kpi.bad b{color:var(--danger)}

  /* 층 이름표(건물): 3D 층 옆 고정, 층 이름은 ink 채움 칩 */
  #floorTags{position:absolute;inset:0;pointer-events:none;z-index:3}
  .ftag{position:absolute;left:0;top:0;display:flex;align-items:center;pointer-events:auto;cursor:pointer;opacity:0;transition:opacity .5s;will-change:transform}
  .ftag .ln{width:32px;height:1px;background:var(--border-strong);position:relative}
  .ftag .ln::before{content:"";position:absolute;left:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
  .ftag .bd{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 12px 4px 4px;border-radius:var(--r-full);white-space:nowrap}
  .ftag .fl{font-weight:700;font-size:14px;color:var(--on-ink);border-radius:var(--r-full);padding:2px 10px;background:var(--ink)}
  .ftag .v{display:inline-flex;align-items:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
  .ftag .v i{font-style:normal;color:var(--muted);font-weight:500;margin:0 6px}
  .ftag .sw{width:16px;height:12px;border-radius:2px;display:inline-block;margin-right:6px;box-shadow:inset 0 0 0 1px var(--hairline)}
  .ftag .al{margin-left:6px}
  .ftag .al svg.i{width:16px;height:16px}
  .ftag:hover .bd,.ftag.hot .bd{border-color:var(--ink)}
  /* 전력 지표: 가장 많이 쓰는 층 라벨 아래에 그 층 상위 호실 막대 차트 (사용량이 많은 구간을 3D 위에서 바로 보이게) */
  .ftag .col{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .ftag .ch{display:none;padding:8px 12px;border-radius:var(--r-sm);min-width:200px}
  .ftag.peak .ch{display:block}
  .ftag .ch h6{margin:0 0 4px;font-size:14px;font-weight:600;color:var(--muted)}
  .ftag .ch button{all:unset;display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:8px;width:100%;font-size:14px;line-height:1.7;cursor:pointer;border-radius:var(--r-sm)}
  .ftag .ch button:hover{background:var(--surface-soft)}
  .ftag .ch .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .ftag .ch .br{height:8px;border-radius:var(--r-full);background:var(--ink)}
  .ftag .ch .kw{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .ftag .ch .em{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--caution);margin-left:4px;vertical-align:2px}
  body:not(.v-building) #floorTags{display:none}
  #introTitle{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);z-index:5;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.2s, transform 1.2s}
  #introTitle.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
  #introTitle b{font-size:28px;font-weight:700;color:var(--ink)}
  @media (max-width:760px){ .ftag .v{display:none} #introTitle b{font-size:22px} }
  @media (max-width:480px){ #floorTags{display:none} }   /* 휴대폰: 층 이름표가 화면 밖으로 잘려 층 선택 버튼만 사용 */

  /* 층 선택(휴대폰 전용, 데스크톱은 층 이름표) */
  @media (min-width:761px){ #floorPicker{display:none !important} }
  #floorPicker{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:4px;z-index:4;border-radius:var(--r-md);padding:4px}
  #floorPicker button{position:relative;min-width:52px;height:44px;border-radius:var(--r-sm);border:0;background:transparent;cursor:pointer;font-size:16px;font-weight:700;color:var(--ink)}
  #floorPicker button:hover,#floorPicker button.hot{color:var(--on-ink);background:var(--ink)}
  #floorPicker .cnt{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 2px var(--canvas)}

  /* 범례: 앱 .legend와 같은 5단계 견본 + 지표 이름·범위·단위 */
  #legend{position:absolute;left:16px;bottom:16px;border-radius:var(--r-md);padding:12px 16px;z-index:4;min-width:220px;font-size:14px;color:var(--muted)}
  #legend .t{font-size:14px;color:var(--ink);margin-bottom:6px;font-weight:600}
  #legend .scale{display:flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
  #legend .scale i{width:22px;height:12px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--hairline)}
  #legend .scale span{margin-left:8px}
  #legend .cats{display:flex;gap:6px 14px;flex-wrap:wrap}
  #legend .cats span{display:flex;align-items:center;gap:6px}
  #legend .cats i{width:16px;height:12px;border-radius:2px;display:inline-block}
  #legend .cats svg.i{width:16px;height:16px}

  /* 층 평면도 */
  #floorView{position:absolute;inset:0;display:none;padding:76px 16px 16px 16px;z-index:3;opacity:0;transition:opacity .55s ease}
  #floorView.pre{display:flex}
  body.diving #floorView.pre{pointer-events:none}
  #kpis,#floorTags,#legend{transition:opacity .45s}
  body.diving #kpis, body.diving #floorTags, body.diving #legend{opacity:0;pointer-events:none}
  #floorView.pre.in{opacity:1}
  #floorView.pre:not(.in):not(.leaving) #plan .tint, #floorView.pre:not(.in):not(.leaving) #plan .chip, #floorView.pre:not(.in):not(.leaving) #plan .idu{animation:none;opacity:0}
  #floorView.leaving #plan *{animation:none !important}
  /* 층 보기 2D(평면도) ↔ 3D(같은 층을 기울여 본 모델) 전환: 오른쪽 위 */
  #planMode{position:absolute;top:12px;right:12px;z-index:6;display:flex;padding:3px;gap:2px;border-radius:999px}
  #planMode button{min-width:44px;height:32px;padding:0 12px;border-radius:999px;font-weight:600}
  #planMode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  body.plan3d #floorView{pointer-events:none}
  /* 3D에서 클릭을 받는 건 버튼·카드 자체만: 앱 안(hosted)에서는 #floorStats 상자가 화면 전체(inset)를 덮으므로 상자는 통과시키고 카드만 받음 */
  body.plan3d #floorView #planMode, body.plan3d #floorView #floorTabs, body.plan3d #floorView #floorStats > *{pointer-events:auto}
  /* 전환은 겹쳐 녹듯이: 평면도가 같은 각도의 3D 위에서 서서히 사라지고(또는 떠오르고) 카메라가 기울어짐 */
  #planWrap{transition:opacity .55s ease}
  #planBox{transition:background-color .55s ease, box-shadow .55s ease, backdrop-filter .55s ease, -webkit-backdrop-filter .55s ease}
  body.plan3d #planWrap{opacity:0}
  body.plan3d #planBox{background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  #planBox{flex:1;min-width:0;position:relative;border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column}
  #planWrap{flex:1;min-height:0;margin:0 12px;border-radius:var(--r-sm);background:var(--paper);box-shadow:inset 0 0 0 1px var(--hairline);overflow:hidden;position:relative}
  #plan{width:100%;height:100%;display:block}
  body.dk #plan .tint{mix-blend-mode:normal;fill-opacity:.24;stroke:var(--c);stroke-opacity:.9;stroke-width:3.5}
  body.dk #plan .tint:hover{fill-opacity:.36;stroke:var(--ink)}
  #plan .tint{mix-blend-mode:multiply;fill-opacity:.6;cursor:pointer;transition:fill .6s ease, fill-opacity .2s;stroke:transparent;stroke-width:5}
  #plan .tint:hover{fill-opacity:.78;stroke:var(--ink)}
  /* 강조 호실: 선택 객체 규칙(디자인 시스템 표 6.1)대로 primary 외곽선, 깜빡임 없음 */
  #plan .tint.hl, body.dk #plan .tint.hl{stroke:var(--primary);stroke-opacity:1;stroke-width:8}
  @keyframes tintIn{from{opacity:0}}
  #plan.intro .tint, #plan.intro .chip, #plan.intro .idu{animation:tintIn .7s ease-out backwards}   /* 건물 → 층으로 들어올 때 1회 */
  #plan .chip{pointer-events:none}

  /* 툴팁: 앱 3D 도면 툴팁(.t3-tip)과 같은 면 */
  #tip{position:absolute;pointer-events:none;border-radius:var(--r-sm);padding:10px 12px;font-size:14px;line-height:1.5;z-index:7;display:none;min-width:200px}

  #tip .al{display:flex;align-items:center;gap:6px;margin-top:4px;font-weight:600}

  /* 방 3D */
  #roomBack,#infoBtn{position:absolute;top:16px;z-index:6;display:none}
  #roomBack{left:16px}
  #infoBtn{left:68px}
  #roomTitle{position:absolute;top:16px;left:120px;z-index:6;display:none;border-radius:var(--r-md);padding:4px 16px;flex-direction:column;justify-content:center;min-height:44px;max-width:calc(100% - 136px)}
  #roomTitle b{font-size:16px;font-weight:700;line-height:1.3}
  #roomTitle small{font-size:14px;color:var(--muted);font-weight:500}
  /* 방 상태 카드(방 3D): 행마다 아이콘, 현재 값과 판정 2줄(왼쪽 정렬), 막대(온도·기류·습도, 오른쪽) */
  #roomLegend{position:absolute;left:16px;bottom:16px;z-index:4;display:none;flex-direction:column;gap:10px;min-width:300px;border-radius:var(--r-md);padding:14px 16px;font-size:14px;color:var(--muted)}
  #roomLegend > div{display:flex;align-items:center;gap:10px}
  #roomLegend > div > svg.i{color:var(--ink);flex:none}
  #roomLegend .tx{display:flex;flex-direction:column;min-width:0;line-height:1.3;margin-right:12px}
  #roomLegend .tx b{font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  #roomLegend .tx b .lv{margin-left:6px;font-size:15px}
  #roomLegend .lv{display:inline-flex;align-items:center;gap:3px}
  #roomLegend .lv svg{width:15px;height:15px}
  #roomLegend .lv.ok{color:var(--ok)} #roomLegend .lv.warn{color:var(--caution)} #roomLegend .lv.bad{color:var(--danger)}
  #roomLegend .g{position:relative;width:96px;height:12px;border-radius:2px;flex:none;margin-left:auto}
  #roomLegend .g i{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink);z-index:1;transition:left .6s}
  #roomLegend .g.hum{background:var(--surface-strong)}
  #roomLegend .g.off{visibility:hidden}
  #roomLegend .g.hum::after{content:'';position:absolute;left:40%;width:20%;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 55%,transparent)}
  #roomLegend small{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
  #inspector{position:absolute;right:16px;top:16px;bottom:16px;width:340px;z-index:6;border-radius:var(--r-md);display:none;flex-direction:column;overflow:auto;padding:16px}
  #inspector.open{display:flex}
  #inspector h2{margin:0;font-size:21px;font-weight:700;line-height:1.3}
  #inspector .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
  #inspector .sub{color:var(--muted);font-size:14px}
  #inspector .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
  #inspector .grid > div{background:var(--surface-soft);border-radius:var(--r-sm);padding:8px 12px;font-size:14px;color:var(--muted);font-weight:500}
  #inspector .grid b{display:block;font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;line-height:1.3}
  #inspector .grid b.sm{font-size:16px}
  #inspector .grid b span{font-size:14px;color:var(--muted);font-weight:500}
  #inspector .meter{height:8px;border-radius:var(--r-full);background:var(--surface-strong);overflow:hidden;margin-top:6px}
  #inspector .meter i{display:block;height:100%;border-radius:var(--r-full)}
  #inspector .zone{position:relative;height:12px;border-radius:2px;overflow:visible}
  #inspector .zone i{position:absolute;top:-2px;bottom:-2px;background:transparent;box-shadow:0 0 0 2px var(--ink);border-radius:2px}
  #inspector .note{margin-top:4px;font-size:14px;color:var(--muted)}
  #inspector h3{font-size:16px;font-weight:600;color:var(--ink);margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  #inspector h3 .num{font-size:14px;font-weight:500;color:var(--muted)}
  #inspector .alert-line{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;margin-bottom:4px}
  #inspector .who{padding:8px 12px;border-radius:var(--r-sm);margin-bottom:8px;border:1px solid var(--hairline)}
  #inspector .who.on{border:2px solid var(--ink);padding:7px 11px}
  #inspector .who-p{font-size:14px;font-weight:600;color:var(--muted)}
  #inspector .who-t{font-weight:600;font-size:16px}
  #inspector .who-d{font-size:14px;color:var(--body);margin:2px 0 6px}
  #inspWi .wi{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;font-size:14px;color:var(--muted);font-weight:500}
  #inspWi .wi output{color:var(--ink);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  #inspWi .wi input[type=range]{width:100%;height:44px;accent-color:var(--ink)}
  /* 패널 버튼: 앱 .pn-btn(높이 44, 같은 줄 너비 1:1), 채운 버튼은 ink 1종(패널 안 primary 미사용) */
  #inspWi .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-column:1 / -1}
  #inspWi button,#actions .simf button{height:44px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);font-size:16px;font-weight:600}
  #inspWi button.ghost{background:var(--canvas);color:var(--ink)}
  #inspWi button.ghost:hover{background:var(--surface-soft)}
  #inspWi button:disabled,#actions .simf button:disabled{border-color:var(--border-strong);background:var(--surface-strong);color:var(--muted)}
  #inspWi .res{font-size:15px;color:var(--body);margin-top:8px;line-height:1.5}
  #inspWi .res b{color:var(--ink)}
  #inspWi .res .up{color:var(--danger)} #inspWi .res .dn{color:var(--ok)}
  #inspWi svg.chart{width:100%;height:auto;display:block;margin-top:8px;font-family:inherit}

  #inspWi .key i{display:inline-block;width:16px;height:2px}

  #inspWi .key i.cur{height:3px;background:var(--chart-cur)}
  #inspWi .key i.busy{height:12px;background:color-mix(in srgb,var(--ink) 10%,transparent)}
  .msg{font-size:14px;margin-top:6px;color:var(--muted)}
  .msg.pad{padding:0 16px}
  .msg.err{display:flex;align-items:flex-start;gap:6px;color:var(--error);font-weight:600}
  .msg.err svg.i{width:16px;height:16px;margin-top:3px}
  .idu-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--hairline-soft);font-size:14px}
  .idu-row .tx{flex:1;min-width:0}
  .idu-row b{display:block;font-size:15px;font-weight:600}
  .idu-row span:not(.pill){color:var(--muted);font-size:14px}
  /* 실내기 상태 배지: 색과 글자(ON, OFF, 고장) 병행 */
  .pill{font-size:14px;font-weight:600;border-radius:var(--r-full);padding:2px 10px;color:var(--canvas);min-width:52px;text-align:center}
  .icon-btn.sm{background:transparent;border:0;box-shadow:none}

  body.v-room #bar{display:none}
  #roomTools{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;display:none}
  #roomTools svg.i{width:18px;height:18px}
  #roomLegend .wind{background:linear-gradient(90deg,var(--chart-cur),color-mix(in srgb,var(--chart-cur) 0%,transparent))}
  body.v-room #roomBack, body.v-room #infoBtn{display:grid}
  body.v-room #roomLegend, body.v-room #roomTitle{display:flex}
  body.v-room #roomTools{display:grid}
  body.v-room #legend{display:none}
  body.v-floor #floorView{display:flex;opacity:1}
  body:not(.v-building) #floorPicker, body:not(.v-building) #kpis{display:none}
  body.v-building #back{display:none}
  body:not(.v-building) #pipesBtn{display:none}
  body.v-floor #legend{left:auto;right:400px;top:148px;bottom:auto;min-width:0;padding:8px 12px}

  @media (max-width:760px){
    #bar{gap:8px;left:12px;right:12px;top:12px}
    #metrics{order:5;width:100%}
    #metrics button{padding:0 4px}
    #live{display:none}
    #floorView{padding:176px 8px 8px}
    #floorPicker{top:auto;bottom:16px;right:12px;transform:none;flex-direction:row-reverse;max-width:calc(100% - 24px);overflow-x:auto}
    #kpis{top:auto;bottom:76px;flex-direction:row;flex-wrap:wrap;left:12px;right:12px}
    .kpi{min-width:0;padding:6px 12px}.kpi .ic{display:none}.kpi b{font-size:17px}
    #legend{display:none}
    #inspector{left:8px;right:8px;width:auto;top:auto;height:62%;bottom:8px}
    #roomTitle{display:none !important}
    #roomTools button{padding:0 8px;font-size:14px}
    /* 방 상태 카드: 아래 보기 도구와 겹치지 않게 위쪽(뒤로·정보 버튼 아래), 막대 축소 */
    #roomLegend{top:68px;bottom:auto;left:8px;right:8px;min-width:0;padding:10px 12px;gap:6px}
    #roomLegend .g{width:64px}
  }
  @media (prefers-reduced-motion: reduce){ #plan .tint, #introTitle, .ftag{transition:none} #plan.intro .tint, #plan.intro .chip, #plan.intro .idu{animation:none} }
  /* 앱 안에 임베드된 상태: 연동 상태 칩(오른쪽 아래). 앱에서 바꾼 값은 1.8초 외곽선 표시 후 원래대로(반복 없음) */
  /* 위치: 아래 가운데(오른쪽 아래 정보 패널, 왼쪽 아래 범례와 겹치지 않음), 방 보기는 보기 도구 위, 층 보기는 평면 패널 아래 여백 */
  #hostLink{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;white-space:nowrap;z-index:9;display:none;align-items:center;gap:8px;min-height:36px;padding:4px 14px;border-radius:var(--r-full);font-size:14px;font-weight:500;color:var(--muted);pointer-events:none;transition:box-shadow .3s,color .3s}
  body.hosted #hostLink{display:flex}
  body.v-room #hostLink{bottom:76px}
  body.hosted.v-floor #floorView{padding-bottom:64px}
  body.hosted #metrics{display:none}      /* 지표 버튼은 앱 패널의 것(온도·전력·습도·이상 감지)을 사용 */
  /* 앱 안 좁은 화면: 층 선택은 앱 왼쪽 층 목록을 사용, 지표 줄이 없어 평면도 위 여백 축소 */
  @media (max-width:760px){ body.hosted #floorPicker{display:none !important} body.hosted #floorView{padding-top:76px} }
  @media (max-width:480px){ body.hosted #floorView{padding-top:128px} }
  #hostLink .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  #hostLink b{color:var(--ink);font-weight:600}
  #hostLink.flash{color:var(--ink);box-shadow:0 0 0 2px var(--ink),var(--shadow)}
  .hostPing{animation:hostPing 1.1s ease-out}
  @keyframes hostPing{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ink) 60%,transparent)}100%{box-shadow:0 0 0 10px color-mix(in srgb,var(--ink) 0%,transparent)}}
  @media (prefers-reduced-motion: reduce){ .hostPing{animation:none} }

  /* 보는 사람 버튼, 오른쪽 아래 정보 패널 */
  /* 도구 버튼 글자: 한 줄에 다 들어가지 않는 1600px 이하에서는 아이콘만(이름은 title) */
  @media (max-width:1600px){ .tgl{font-size:0;gap:0;width:44px;padding:0} .tgl svg.i{width:20px;height:20px} }
  @media (max-width:1180px){ #persona button{padding:0 12px} }

  #actions{position:absolute;right:16px;bottom:16px;width:340px;max-height:min(52%,460px);z-index:5;border-radius:var(--r-md);display:flex;flex-direction:column;overflow:auto;transition:opacity .45s}
  body.v-floor #actions{top:76px;max-height:none}
  body.v-room #actions, body.diving #actions{opacity:0;pointer-events:none}
  body.v-room #actions{display:none}
  body.hosted #persona button[data-p="sim"]{display:none}
  /* 앱 임베드(2026-11-20): 트윈은 3D 렌더링과 호실 선택만 담당. 버튼, 칩, 패널은 앱 카드가 대신하고 ui 메시지로 제어.
     범례는 앱 카드에 있으므로 숨김(시뮬레이션 역할도 같은 온도 척도) */
  body.hosted #bar, body.hosted #hostLink, body.hosted #kpis, body.hosted #floorPicker, body.hosted #floorTags,
  body.hosted #floorTabs, body.hosted #roomBack, body.hosted #infoBtn, body.hosted #roomTools, body.hosted #roomTitle,
  body.hosted #inspector, body.hosted #legend, body.hosted #flow, body.hosted #actions .list, body.hosted #actions .ft{display:none !important}  /* 데이터 흐름은 앱 모달(보고의 flow)로 표시 */
  body.hosted #floorView{padding:8px !important}
  /* 앱 임베드 역할 요약(2026-11-20): 건물 보기 오른쪽 위 플로팅 카드(요약만). 층·호실 보기와 좁은 화면(480px 이하)은 숨김(앱 상단 지표에 같은 값) */
  body.hosted #actions{display:flex !important;top:12px;right:12px;bottom:auto;width:min(300px,calc(100% - 24px));max-height:none;overflow:visible}

     - 지표 5칸은 아래 한 줄, 안내 문구(사진 추정 공간 등)는 왼쪽 위. 평면도는 그 높이만큼만 비켜 겹치지 않음 */

  body.hosted #floorStats div{flex:none;min-width:96px;padding:6px 12px;background:color-mix(in srgb,var(--canvas) 92%,transparent);border:1px solid var(--hairline);box-shadow:var(--shadow)}
  body.hosted #floorStats b{font-size:18px}
  body.hosted #floorStats .note{position:absolute;left:0;top:0;max-width:min(520px,100%);display:flex;gap:8px;align-items:flex-start;color:var(--body);line-height:1.4}
  body.hosted #floorStats .note svg.i{flex:none;width:16px;height:16px;margin-top:2px}
  /* 좁은 앱 화면: 지표 칸이 한 줄에 들어가지 않으면 두 줄, 평면도 아래 여백도 두 줄만큼 */
  @media (max-width:640px){ body.hosted #floorStats{flex-wrap:wrap;align-content:flex-end} body.hosted #floorStats div{min-width:0} body.hosted #planWrap{padding-bottom:132px} }

  @media (max-width:760px){ #actions{display:none} #persona button span{display:none} }
  #actions .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 40px 12px 16px;border-bottom:1px solid var(--hairline);position:relative;cursor:pointer}
  /* 머리를 누르면 접기·펴기 (화면이 좁으면 처음엔 접힘 → 3D 층 라벨·전력 차트가 가려지지 않게) */
  #actions .hd::after{content:"";position:absolute;right:16px;top:50%;margin-top:-6px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}

  #actions .simt th, #actions .simt td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--hairline-soft);font-variant-numeric:tabular-nums}
  #actions .simt th:first-child{text-align:left;font-weight:500;color:var(--muted)}

const FOV0 = 42, FOV_PLAN = 16;
function flyTo(pos, target, dur = 900, done, fov, progress){
  const p0 = camera.position.clone(), t0 = controls.target.clone(), start = performance.now(), f0 = camera.fov;
  if (reduceMotion) dur = 1;
  tween = { update(now){
    const k = clamp((now - start) / dur, 0, 1), e = k * k * (3 - 2 * k);
    camera.position.lerpVectors(p0, pos, e); controls.target.lerpVectors(t0, target, e);
    if (fov != null) { camera.fov = lerp(f0, fov, e); camera.updateProjectionMatrix(); }
    progress?.(k);
    if (k >= 1) { tween = null; done && done(); }
  } };
}
const floorView = $('#floorView');
let floorFade = null, landingFloor = null;
function clearPlanTransition(keepDiving = false){
  floorFade?.cancel(); floorFade = null;
  floorView.classList.remove('pre', 'in', 'leaving');
  if (!keepDiving) document.body.classList.remove('diving');
}
function cancelNavigation(){
  tween = null; planAnim = false; landingFloor = null;
  clearPlanTransition();
  stage.querySelector('.scene-transition')?.remove();
}
function fadePlanOut(){
  floorView.classList.add('pre', 'leaving');
  const animation = floorView.animate([{ opacity:1 }, { opacity:0 }], {
    duration:360, easing:'ease-out', fill:'forwards',
  });
  floorFade = animation;
  animation.onfinish = () => { if (floorFade === animation) clearPlanTransition(!!landingFloor); };
}
function dissolveScene(scene){
  // Capture only at the handoff. The destination continues rendering during the dissolve.
  stage.querySelector('.scene-transition')?.remove();
  camera.lookAt(controls.target);
  renderPass.scene = scene; composer.render();
  const image = document.createElement('canvas');
  image.className = 'scene-transition';
  image.width = canvas.width; image.height = canvas.height;
  image.getContext('2d').drawImage(canvas, 0, 0);
  canvas.after(image);
  image.animate([{ opacity:1 }, { opacity:0 }], { duration:340, easing:'ease-out', fill:'forwards' }).onfinish = () => image.remove();
}
function cameraHeading(){
  const heading = camera.position.clone().sub(controls.target).setY(0);
  return (heading.lengthSq() > 1 ? heading : homePos().sub(HOME.target).setY(0)).normalize();
}
// where the floor rectangle sits on screen in the 2D plan (stage px) — the 3D camera dives to exactly that framing
const FULL = () => ({ x:0, y:0, w:W, h:D });
function planScreenRect(f, box = FULL()){
  const p = f.plan, sr = svg.getBoundingClientRect(), st = stage.getBoundingClientRect();
  const sc = Math.min(sr.width / p.w, sr.height / p.h), ox = sr.left - st.left + (sr.width - p.w * sc) / 2, oy = sr.top - st.top + (sr.height - p.h * sc) / 2;
  return { x:ox + (p.ox + box.x * p.S) * sc, y:oy + (p.oy + box.y * p.S) * sc, w:box.w * p.S * sc, h:box.h * p.S * sc };
}
// top-down camera that puts `box` (m, plan coords) at plane height y exactly on `rect` (stage px)
function planCamera(f, rect, box = FULL(), y = floorY(f.index) + 1.2 + .012){
  const st = stage.getBoundingClientRect();
  if (!(rect.h > 0 && st.height > 0)) {
    const tgt = toWorld(box.x + box.w / 2, box.y + box.h / 2, y);
    const height = .6 * Math.max(box.h, box.w / camera.aspect) / Math.tan(FOV_PLAN * Math.PI / 360);
    return { pos:tgt.clone().add(new THREE.Vector3(0,height,.01)), tgt };
  }
  const wpp = box.h / rect.h;
  const h = st.height * wpp / 2 / Math.tan(FOV_PLAN * Math.PI / 360);
  const cx = (rect.x + rect.w / 2 - st.width / 2) * wpp, cz = (rect.y + rect.h / 2 - st.height / 2) * wpp;
  const wx = box.x + box.w / 2 - W / 2, wz = box.y + box.h / 2 - D / 2;
  return { pos:new THREE.Vector3(wx - cx, y + h, wz - cz + .01), tgt:new THREE.Vector3(wx - cx, y, wz - cz) };
}
function snapExplode(f){
  explodeF = f; roofLift = 40;
  for (const grp of floorGroups) { const g = grp.userData.floor, up = g.index > f.index;
    grp.userData.lift = up ? 8 + (g.index - f.index) * 6 : g === f ? 1.2 : 0; grp.userData.fade = g === f ? 1 : up ? 0 : .1; }
}
function alignPlanCamera(f, box = FULL(), height){
  if (camera.view?.enabled) camera.clearViewOffset();
  viewShift = 0;
  const pc = planCamera(f, planScreenRect(f, box), box, height);
  camera.fov = FOV_PLAN; camera.updateProjectionMatrix();
  camera.position.copy(pc.pos); controls.target.copy(pc.tgt); camera.lookAt(pc.tgt);
}
// frozen 3D backdrop behind the (glass) plan panel
function renderBackdrop(f){
  snapExplode(f); hoverFloor = f; alignPlanCamera(f);
  const v = state.view; state.view = 'building'; updateBuilding(clock.elapsedTime, 0); state.view = v;
  renderPass.scene = bScene; composer.render();
}
// 층 보기 3D: 평면도 대신 그 층만 띄운 3D 모델을 비스듬히 (다른 층은 snapExplode로 비켜 있음), 마우스로 돌려 보고 방을 누르면 방 3D로
let plan3d = false, planAnim = false;   // planAnim: 3D→2D로 돌아가는 동안에도 3D를 계속 그림
try { plan3d = localStorage.getItem('twin:plan3d') === '1'; } catch {}
function planTiltCamera(f){
  const t = new THREE.Vector3(0, floorY(f.index) + 1.2, 0), c = cameraHeading(), k = (Math.max(W, D) * 1.05 + 12) * 1.6;
  return { pos:t.clone().add(c.multiplyScalar(k * .78)).setY(t.y + k * .72), tgt:t };
}
function enterPlan3d(f, animate = true){
  if (!f) return;
  explodeF = f; hoverFloor = f;
  controls.autoRotate = false; controls.minDistance = 6; controls.maxDistance = 400 * SC;
  const pc = planTiltCamera(f);
  const settle = () => { controls.enabled = true; };
  if (animate && !reduceMotion) {
    controls.enabled = false;
    flyTo(pc.pos, pc.tgt, 1250, settle, FOV0);
  } else {
    tween = null; snapExplode(f);
    camera.fov = FOV0; camera.updateProjectionMatrix(); camera.position.copy(pc.pos); controls.target.copy(pc.tgt); settle();
  }
}
function setPlan3d(on){
  if (plan3d === on && !planAnim) return;
  const wasPlan = !plan3d && !planAnim;
  plan3d = on; if (on) document.body.classList.add('plan3d');
  try { localStorage.setItem('twin:plan3d', on ? '1' : '0'); } catch {}
  for (const b of document.querySelectorAll('#planMode button')) b.setAttribute('aria-pressed', String((b.dataset.pm === '3d') === on));
  if (state.view !== 'floor' || !state.floor) return;
  cancelNavigation();
  if (on) {
    if (wasPlan && !reduceMotion) alignPlanCamera(state.floor);
    enterPlan3d(state.floor);
    return;
  }
  // 3D → 2D: 3D를 켜 둔 채 평면도와 똑같은 위 시점으로 천천히 돌아온 뒤, 그 위로 평면도가 서서히 떠오름
  const f = state.floor, pc = planCamera(f, planScreenRect(f));
  const land = () => { renderBackdrop(f); document.body.classList.remove('plan3d'); planAnim = false; };
  if (reduceMotion) { land(); return; }
  planAnim = true; document.body.classList.add('plan3d');
  controls.enabled = false; controls.minDistance = .1; controls.maxDistance = Infinity;
  flyTo(pc.pos, pc.tgt, 1050, land, FOV_PLAN);
}
document.body.classList.toggle('plan3d', plan3d);
for (const b of document.querySelectorAll('#planMode button')) b.setAttribute('aria-pressed', String((b.dataset.pm === '3d') === plan3d));
$('#planMode').addEventListener('click', e => { const b = e.target.closest('[data-pm]'); if (b) setPlan3d(b.dataset.pm === '3d'); });
function setBodyView(v){ document.body.classList.remove('v-building', 'v-floor', 'v-room'); document.body.classList.add('v-' + v); state.view = v; }

function lockCamera(){
  controls.enabled = false; controls.autoRotate = false;
  controls.minDistance = .1; controls.maxDistance = Infinity;
}
function moveCameraHeight(delta){
  camera.position.y += delta; controls.target.y += delta;
}
function goBuilding(animate = true){
  const from = state.floor, view = state.view, wasPlan = view === 'floor' && !plan3d && !planAnim;
  const initial = !goBuilding.done, useMotion = animate && !reduceMotion;
  hideTip(); cancelNavigation();
  if (from) tellHost('floorSelected', { floor:'' });
  if (useMotion && from && view === 'room') {
    dissolveScene(room3d.scene);
    snapExplode(from);
    moveCameraHeight(floorY(from.index) + 1.2);
  } else if (useMotion && wasPlan) {
    alignPlanCamera(from); fadePlanOut(); document.body.classList.add('diving');
  }

  disposeRoom(); setInspector(false);
  setBodyView('building'); state.floor = null; state.room = null; explodeF = null; hoverFloor = null;
  lockCamera();
  const settle = () => {
    controls.enabled = true; controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = .45;
    controls.minDistance = 20; controls.maxDistance = 240 * SC;
  };
  if (initial && !reduceMotion) {
    const k = fitK();
    camera.position.set(-95 * k, 4, 70 * k); controls.target.copy(HOME.target).setY(2);
  }
  if ((useMotion || initial) && !reduceMotion) flyTo(homePos(), HOME.target, initial ? 2200 : 1450, settle, FOV0);
  else {
    camera.position.copy(homePos()); controls.target.copy(HOME.target); camera.fov = FOV0;
    camera.updateProjectionMatrix(); camera.lookAt(controls.target); settle();
  }
  goBuilding.done = true;
  renderCrumbs(); recolorBuilding(); renderFloorPicker(); renderLegend(); renderKpis(); renderTags();
  emit('twin:view', { view:'building' });
}

function prepareFloor(f, intro){
  state.floor = f;
  svg.style.transition = 'none';
  resetPlanZoom(); buildPlanSvg(f, intro);
  updatePlanSvg(); renderFloorStats();
  svg.getBoundingClientRect();
  svg.style.transition = '';
}
function showFloor(f){
  disposeRoom(); setInspector(false);
  setBodyView('floor'); state.floor = f; state.room = null;
  renderCrumbs(); renderLegend();
  emit('twin:view', { view:'floor', floor:f.id });
}
function goFloor(f){
  if (landingFloor === f || (state.view === 'floor' && state.floor === f)) return;
  const from = state.floor, view = state.view;
  const wasPlan = view === 'floor' && !plan3d && !planAnim;
  const fromRoom = view === 'room' && room3d;
  const matchedRoom = fromRoom && state.room.floorId === f.id && !plan3d;
  hideTip(); cancelNavigation(); lockCamera();
  setInspector(false); tellHost('floorSelected', { floor:f.id });
  document.body.classList.toggle('plan3d', plan3d);

  if (fromRoom && !matchedRoom && !reduceMotion) {
    dissolveScene(room3d.scene);
    snapExplode(from);
    moveCameraHeight(floorY(from.index) + 1.2);
  }
  if (plan3d || reduceMotion) {
    prepareFloor(f, false); showFloor(f);
    if (plan3d) enterPlan3d(f);
    else renderBackdrop(f);
    return;
  }

  landingFloor = f;
  const box = matchedRoom ? state.room.b : FULL();
  const pc = () => planCamera(f, planScreenRect(f, box), box, matchedRoom ? 0 : undefined);
  if (!matchedRoom) {
    explodeF = f; hoverFloor = f;
    setBodyView('building'); state.room = null; disposeRoom();
  }

  // While the old 2D overlay fades, the 3D camera can already leave its matching top view.
  let prepared = !wasPlan;
  if (prepared) {
    floorView.classList.add('pre'); prepareFloor(f, true);
  } else {
    fadePlanOut();
    alignPlanCamera(from);
  }
  document.body.classList.add('diving');
  const initial = pc(), dest = { pos:initial.pos.clone(), tgt:initial.tgt.clone() };
  const arc = wasPlan ? cameraHeading().multiplyScalar(14 * fitK()).setY(9 * SC) : null;
  let adjusted;
  flyTo(dest.pos, dest.tgt, 1500, () => {
    if (!prepared) prepareFloor(f, true);
    if (matchedRoom) dissolveScene(room3d.scene);
    floorView.classList.add('pre', 'in');
    showFloor(f); renderBackdrop(f); clearPlanTransition(); landingFloor = null;
  }, FOV_PLAN, k => {
    if (arc) camera.position.addScaledVector(arc, Math.sin(Math.PI * k) ** 2);
    if (!prepared && k >= .32) {
      prepared = true; clearPlanTransition(true);
      floorView.classList.add('pre');
      prepareFloor(f, true);
      adjusted = pc();
    }
    if (adjusted) {
      const kFit = clamp((k - .32) / .36, 0, 1), fit = kFit * kFit * (3 - 2 * kFit);
      dest.pos.lerpVectors(initial.pos, adjusted.pos, fit);
      dest.tgt.lerpVectors(initial.tgt, adjusted.tgt, fit);
    }
    if (prepared && k >= (matchedRoom ? .72 : .82)) floorView.classList.add('in');
  });
}
function goRoom(r, animate = true){
  if (state.view === 'room' && state.room === r) return;
  const from = state.floor, view = state.view, previousRoom = view === 'room' && room3d;
  const f = FLOOR[r.floorId], useMotion = animate && !reduceMotion;
  const wasPlan = view === 'floor' && !plan3d && !planAnim;
  const matchPlan = wasPlan && from === f;
  const heading = cameraHeading();
  hideTip(); cancelNavigation();
  if (useMotion && matchPlan) {
    alignPlanCamera(f, r.b, 0);
    fadePlanOut();
  } else if (useMotion) {
    dissolveScene(previousRoom ? room3d.scene : bScene);
    if (wasPlan) fadePlanOut();
    moveCameraHeight(previousRoom ? floorY(from.index) - floorY(f.index) : -floorGroups[f.index].position.y);
  }

  disposeRoom(); room3d = buildRoom(r);
  setBodyView('room'); state.floor = f; state.room = r;
  lockCamera();
  const c = room3d.center, dist = (room3d.span * .95 + 4.5) * fitK() / SC;
  const pos = c.clone().addScaledVector(heading, dist).setY(c.y + dist * .62);
  const settle = () => { controls.enabled = true; controls.minDistance = 3; controls.maxDistance = room3d.span * 3 + 14; };
  if (useMotion) flyTo(pos, c, 1120, settle, FOV0);
  else {
    camera.fov = FOV0; camera.updateProjectionMatrix();
    camera.position.copy(pos); controls.target.copy(c); camera.lookAt(c); settle();
  }
  renderCrumbs(); renderRoomTitle(); if (state.inspector) renderInspector();
  reportRoomSelected(r);
}
function reportRoomSelected(r){
  emit('twin:view', { view:'room', floor:r.floorId, room:r.id });
  emit('roomSelected', { source:'twin', roomId:r.id });
  if (HOST.on) hostSay(`트윈 → 대시보드 <b>${esc(r.name)} 선택</b>`);
}
function disposeRoom(){ if (room3d) { dispose(room3d.scene); room3d = null; } }

/* ═════════════════════════ 2D plan overlay ═════════════════════════ */
const svg = $('#plan');
let planRefs = [];
function buildPlanSvg(f, intro = false){
  const p = f.plan;
  // 같은 층·같은 테마면 이미 그린 평면도를 그대로 둠 → 실 색이 유지되고 바뀐 값만 updatePlanSvg가 바꿈
  svg.classList.toggle('intro', intro);      // 들어올 때 한 번 스며드는 효과 — 방에서 돌아올 땐 꺼서 색이 다시 깔리지 않게
  const key = f.id + (isDark() ? ':d' : ':l');
  if (svg.__key === key && planRefs.length) return;
  svg.__key = key;
  svg.setAttribute('viewBox', `0 0 ${p.w} ${p.h}`);
  const P = ([x, y]) => `${(p.ox + x*p.S).toFixed(1)},${(p.oy + y*p.S).toFixed(1)}`;
  document.body.classList.toggle('dk', isDark());
  // 평면도 그림을 층 윤곽(footprint)으로 잘라 냄 — 3D 바닥판과 같은 모양 (중정은 비움)
  const fl = f.footprint || [[[0, 0], [W, 0], [W, D], [0, D]]];
  const clipD = fl.map(l => 'M' + l.map(P).join('L') + 'Z').join('') + (f.hasVoid ? 'M' + [[VOID.x0, VOID.y0], [VOID.x1, VOID.y0], [VOID.x1, VOID.y1], [VOID.x0, VOID.y1]].map(P).join('L') + 'Z' : '');
  let html = `<defs><clipPath id="planClip"><path clip-rule="evenodd" d="${clipD}"/></clipPath></defs><image href="${isDark() ? p.srcDark : p.src}" x="0" y="0" width="${p.w}" height="${p.h}" clip-path="url(#planClip)"/>`;
  const dly = r => `animation-delay:${(120 + (r.b.cx / W) * 520 + (r.b.cy / D) * 160).toFixed(0)}ms`;
  const RS = f.rooms.filter(r => r.acs.length);
  html += '<g>' + RS.map(r => `<path class="tint" data-id="${r.id}" style="${dly(r)}" fill-rule="evenodd" d="${[r.poly, ...(r.poly.holes || [])].map(l => 'M' + l.map(P).join('L') + 'Z').join('')}"/>`).join('') + '</g>';
  // 실내기 유형(cls)이 있으면 유형별 기호, 없으면(이전 데이터) 원
  html += '<g>' + f.rooms.flatMap(r => r.acs.map(a => a.cls ? iduSymbolSvg(a, p.ox + a.x*p.S, p.oy + a.y*p.S)
    : `<circle class="idu" data-a="${a.id}" cx="${p.ox + a.x*p.S}" cy="${p.oy + a.y*p.S}" r="7" stroke="#fff" stroke-width="2.5"/>`)).join('') + '</g>';
  html += '<g>' + RS.map(r => {
    const b = r.b, cx = p.ox + b.cx * p.S, cy = p.oy + (r.type === 'room' ? b.cy + (b.h > 4 ? 1.3 : .55) : b.cy) * p.S;
    const showChip = r.area >= 12;
    const bx = p.ox + (b.x + b.w) * p.S - 18, by = p.oy + b.y * p.S + 18;
    return (showChip ? `<g class="chip" data-id="${r.id}" style="animation-delay:${(500 + (r.b.cx / W) * 520).toFixed(0)}ms" transform="translate(${cx},${cy})"><rect rx="8" ry="8"/><text text-anchor="middle" dominant-baseline="central"></text></g>` : '') + `
            <g class="badge" data-id="${r.id}" transform="translate(${bx},${by})" style="display:none"><circle r="13"/><text text-anchor="middle" dominant-baseline="central" y="1">!</text></g>`;
  }).join('') + '</g>';
  svg.innerHTML = html;
  planRefs = RS.map(r => ({ r, tint:svg.querySelector(`.tint[data-id="${r.id}"]`), chip:svg.querySelector(`.chip[data-id="${r.id}"]`), badge:svg.querySelector(`.badge[data-id="${r.id}"]`),
    idus:r.acs.map(a => [a, svg.querySelector(`.idu[data-a="${a.id}"]`)]) }));
}
// 앱 임베드(2026-11-20): 역할별 조치 항목을 목록 패널 대신 호실 표시(3D 신호, 평면 배지)와 말풍선으로 표시
// - 표시 단계: 이상 단계(r.alert.level)와 조치 단계 중 큰 값, 조치는 최소 주의(1)
function actionsByRoom(){
  const m = new Map();
  if (!HOST.on || state.persona === 'sim') return m;
  for (const i of insights(state.persona, ROOMS)) m.set(i.r.id, [...(m.get(i.r.id) || []), i]);
  return m;
}
const markLv = (r, act) => Math.max(r.alert.level, act.has(r.id) ? Math.max(1, ...act.get(r.id).map(i => i.lv)) : 0);
function updatePlanSvg(){
  const act = actionsByRoom();
  const m = state.metric, hlOn = performance.now() < HL.until;
  for (const { r, tint, chip, badge, idus } of planRefs) {
    const col = cssColor(m, metricValue(r, m)); tint.style.fill = col; tint.style.setProperty('--c', col);
    tint.classList.toggle('hl', hlOn && HL.ids.has(r.id));
    const narrow = r.b.w < 9.5;
    const parts = [['temp', `${r.temp.toFixed(1)}°`], ['hum', `${Math.round(r.hum)}%`], ['power', `${r.power.toFixed(1)}kW`]];
    if (r.cls || r.occSrc === 'wifi' || r.occSrc === 'sensor') parts.push(['occ', `${r.occ}명`]);
    if (m === 'comfort' && r.cmf) parts.unshift(['comfort', `PMV ${pmvTxt(r.cmf.pmv)}`]);
    const show = narrow ? parts.filter(([k]) => k === (m === 'alert' ? 'temp' : m)) : parts;
    if (chip) {
    const text = chip.querySelector('text');
    setHTML(text, show.map(([k, v], i) => `<tspan class="${k === m ? '' : 'dim'}">${i ? ' · ' : ''}${v}</tspan>`).join(''));
    const bb = text.getBBox(), rect = chip.querySelector('rect');
    rect.setAttribute('x', bb.x - 9); rect.setAttribute('y', bb.y - 5); rect.setAttribute('width', bb.width + 18); rect.setAttribute('height', bb.height + 10);
    }
    const lv = markLv(r, act);
    badge.style.display = lv ? '' : 'none';
    badge.querySelector('circle').style.fill = lv === 2 ? 'var(--danger)' : 'var(--caution)';
    for (const [a, el] of idus) el.style.fill = STATUS_CSS[a.status];
  }
}
svg.addEventListener('pointermove', e => { const id = e.target.dataset && e.target.dataset.id; if (!id) return hideTip(); showRoomTip(ROOM[id], e); });
svg.addEventListener('pointerleave', hideTip);
svg.addEventListener('click', e => { const id = e.target.dataset && e.target.dataset.id; if (id) goRoom(ROOM[id]); });

/* ═════════════════════════ floor tabs / stats ═════════════════════════ */
function floorAgg(rs){
  const rooms = rs.filter(r => r.type === 'room'), n = Math.max(rooms.length, 1);
  return { temp:rooms.reduce((s, r) => s + r.temp, 0) / n, hum:rooms.reduce((s, r) => s + r.hum, 0) / n,
    power:rs.reduce((s, r) => s + r.power, 0), occ:rs.reduce((s, r) => s + r.occ, 0),
    acs:rs.flatMap(r => r.acs), alerts:rs.filter(r => r.alert.level).length };
}
function renderFloorStats(){
  const f = state.floor; if (!f) return;
  setHTML($('#floorTabs'), FLOORS.map(x => `<button data-f="${x.id}" aria-selected="${x === f}">${x.id}</button>`).join(''));
  const a = floorAgg(f.rooms), on = a.acs.filter(x => x.status === 'on').length;
  const floorNote = f.note ? '<div class="note">' + IC.info + esc(f.note) + "</div>" : "";
  if (f.note && !a.acs.length) { setHTML($("#floorStats"), floorNote); return; }
  setHTML($('#floorStats'), floorNote + `<div>평균 온도<b>${a.temp.toFixed(1)}<i>°C</i></b></div><div>평균 습도<b>${Math.round(a.hum)}<i>%</i></b></div>

/* ═════════════ 운전 시뮬레이션: 기존 운전 vs 내가 고른 운전 (EnergyPlus) ═════════════
   계산: tools/sim-server.mjs 가 EnergyPlus를 돌림 (없으면 data 폴더의 scenario.json만 보여 줌)

const fmt1 = v => v == null || !isFinite(v) ? '–' : (+v).toLocaleString('ko-KR', { maximumFractionDigits:1 });
function simAvgT(res){ let t = 0, a = 0; for (const [id, x] of Object.entries(res.rooms || {})) if (x.avgTempC != null) { const ar = ROOM[id]?.area || 1; t += x.avgTempC * ar; a += ar; } return a ? t / a : null; }
function scenLine(r){
  const R = SIM.result, x = R?.scenario?.rooms?.[r.id], b = R?.baseline?.rooms?.[r.id]; if (!x) return '';
  return `<div class="sub" style="margin-top:4px">운전 시뮬레이션(${esc((R.scenario.scenario.window?.sp ?? R.scenario.scenario.coolSetpoint) + '°C')}): 재실 중 평균 <b>${fmt1(x.avgTempC)}°C</b> · 최고 <b>${fmt1(x.maxTempC)}°C</b> · PPD ${fmt1(x.ppd)}% <span style="opacity:.7">(기존 ${fmt1(b?.avgTempC)}°C · ${fmt1(b?.ppd)}%)</span></div>`; }
const simBase = () => SIM.result?.baseline?.scenario?.mode === simMode() ? SIM.result.baseline.scenario
  : { mode:simMode(), coolSetpoint:simMode() === 'heat' ? BD.operation?.heatSetpoint ?? 20 : BD.operation?.coolSetpoint ?? 24, hours:BD.operation?.weekday || ['08:00', '21:00'] };
// 설정온도 범위: 냉방 22~28, 난방 18~26 · 처음 값 = 절감 쪽으로 2°C (냉방 올림, 난방 내림)
const spRange = () => simMode() === 'heat' ? [18, 26] : [22, 28];
function simForm(){
  if (SIM.form && SIM.form.mode !== simMode()) SIM.form = null;   // 냉·난방이 바뀌면(날짜) 설정온도 기본값을 다시 잡음
  if (!SIM.form) { const s = SIM.result?.scenario?.scenario?.mode === simMode() ? SIM.result.scenario.scenario : null, b = simBase();
    // period: 'now' = 지금부터 durH시간 (기준 = 현재 설정 유지 예측), 'range' = 시작·끝 시각 지정 (기준 = 오늘 실제 운전 / 기존 운전)
    SIM.form = s && !s.inherit ? { mode:simMode(), coolSetpoint:s.coolSetpoint, start:s.hours[0], end:s.hours[1], offWhenEmpty:s.offWhenEmpty, precoolMin:s.precoolMin, useLive:true, period:'now', durH:2 }
      : { mode:simMode(), coolSetpoint:simMode() === 'heat' ? Math.max(18, Math.min(20, b.coolSetpoint - 2)) : Math.min(28, Math.max(26, b.coolSetpoint + 2)), start:BD.operation?.weekday?.[0] || '08:00', end:BD.operation?.weekday?.[1] || '21:00', offWhenEmpty:false, precoolMin:0, useLive:true, period:'now', durH:2 }; }

// 오늘 기록(twin.live/v1): 시간별 평균 재실·가동·설정온도·전력·외기 + 기상 예보 → 서버가 오늘 하루를 EnergyPlus로 돌림
const hasLive = () => LIVE.count > 0 && !!simDate && Object.keys(HIST.hours).length > 0;
function buildLive(){
  const hours = {}, r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;
  for (const [h, H] of Object.entries(HIST.hours)) { const rooms = {};

      if (R.no) x.occ = r1(R.occ / R.no); if (R.nk) { x.on = r2(R.on / R.nk); x.kw = r2(R.kw / R.nk); } if (R.ns) x.set = Math.round(R.set / R.ns * 2) / 2;
      rooms[id] = x; }

async function simCompare(scenario, useLive){

    body:JSON.stringify({ data:DATA_BASE, scenario:{ mode:simMode(), ...scenario }, ...(useLive ? { live:buildLive() } : {}) }) });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j?.compare) throw new Error(j?.error || (r.status === 404 || r.status === 501 ? '계산 서버가 없어요 — start-twin.bat(node 서버)로 열어 주세요' : `서버 오류 ${r.status}`));

/* ═════════════ 방 설정온도 바꿔 보기 (what-if) → 적용 ═════════════

function pick(e){
  const rc = canvas.getBoundingClientRect();
  ndc.set((e.clientX - rc.left) / rc.width * 2 - 1, -(e.clientY - rc.top) / rc.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false).find(({object}) => object.visible && object.parent.visible && object.material.visible);
  return hit ? hit.object.userData.floor : null;
}
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; controls.autoRotate = false; });
canvas.addEventListener('pointermove', e => {
  if (state.view !== 'building' || tween) return;
  const f = pick(e);
  if (f !== hoverFloor) { hoverFloor = f; renderFloorPicker(); }
  canvas.style.cursor = f ? 'pointer' : 'grab';
  f ? showFloorTip(f, e) : hideTip();
});
canvas.addEventListener('pointerleave', () => { if (state.view === 'building') { hoverFloor = null; hideTip(); renderFloorPicker(); } });
function pickRoom(e){
  const grp = floorGroups.find(g => g.userData.floor === state.floor); if (!grp) return null;
  const rc = canvas.getBoundingClientRect();
  ndc.set((e.clientX - rc.left) / rc.width * 2 - 1, -(e.clientY - rc.top) / rc.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const meshes = grp.userData.blocks.map(bk => bk.mesh), hit = ray.intersectObjects(meshes, false)[0];
  return hit ? grp.userData.blocks.find(bk => bk.mesh === hit.object).r : null;
}
canvas.addEventListener('pointerup', e => {
  if (downAt && state.view === 'floor' && plan3d && !tween) {
    const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); downAt = null;
    if (moved < 6) { const r = pickRoom(e); if (r) goRoom(r); }
    return;
  }
  if (!downAt || state.view !== 'building' || (tween && explodeF)) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]); downAt = null;
  if (moved < 6) { const f = pick(e); if (f) goFloor(f); }
});

/* ═════════════════════════ loop / resize / visibility ═════════════════════════ */
function resize(){ const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); if (state.view === 'floor' && state.floor && !plan3d && !planAnim && typeof renderBackdrop === 'function') renderBackdrop(state.floor); }
new ResizeObserver(resize).observe(stage); resize();
let visible = true;
document.addEventListener('visibilitychange', () => { visible = !document.hidden; });
new IntersectionObserver(es => { visible = es[0].isIntersecting && !document.hidden; }).observe(stage);
const clock = new THREE.Clock();
let viewShift = 0;
function shiftView(want, dt){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  viewShift = lerp(viewShift, want, reduceMotion ? 1 : 1 - Math.exp(-dt * 9));
  if (Math.abs(viewShift - want) < .5) viewShift = want;
  if (viewShift) camera.setViewOffset(sw, sh, viewShift, 0, sw, sh);
  else if (camera.view?.enabled) camera.clearViewOffset();
}
function frame(now){
  requestAnimationFrame(frame);
  const elapsed = clock.getDelta(), dt = Math.min(elapsed, .05);
  if (!visible || (state.view === 'floor' && !plan3d && !planAnim)) return;
  const t = clock.elapsedTime;
  if (tween) tween.update(now);
  controls.update();
  { // 카메라 앞 클리핑면을 거리에 맞춤: 큰 건물에서 near가 너무 작으면 깊이 정밀도가 모자라 겹친 면이 깜빡임
    const nr = clamp(camera.position.distanceTo(controls.target) * .01, .05, 8);
    if (Math.abs(nr - camera.near) > camera.near * .1) { camera.near = nr; camera.updateProjectionMatrix(); } }
  if (state.view === 'building') {
    // 단독 화면은 왼쪽 패널만큼 모델을 오른쪽으로 비킴. 앱에 넣으면(hosted) 버튼·정보가 앱 쪽에 있으므로 가운데
    const sw = stage.clientWidth, want = !explodeF && sw > 760 && !document.body.classList.contains('hosted') ? Math.min(340, sw * .3) / 2 : 0;
    shiftView(want, elapsed);
    updateBuilding(t, dt); renderPass.scene = bScene; bloom.strength = exteriorFirst && !explodeF && !state.pipes ? .035 : isDarkNow ? .48 : .22; composer.render(); }
  else if (state.view === 'floor' && (plan3d || planAnim)) {   // 층 3D: 건물 화면과 같은 장면을 그 층만 띄워서
    // 단독 화면은 오른쪽 정보 패널(372px)만큼 모델을 왼쪽으로 비킴(기울기 시작과 함께 천천히), 앱에 넣으면 가운데
    const want = plan3d && stage.clientWidth > 760 && !document.body.classList.contains('hosted') ? 186 : 0;
    shiftView(want, elapsed);
    state.view = 'building'; updateBuilding(t, dt); state.view = 'floor';
    renderPass.scene = bScene; bloom.strength = isDarkNow ? .48 : .22; composer.render(); }   // 평면도 뒤 배경과 같은 밝기 → 전환 때 번쩍임 없음
  else if (room3d) { shiftView(0, elapsed); room3d.update(dt, t); renderPass.scene = room3d.scene; bloom.strength = isDarkNow ? .14 : .06; composer.render(); }
}
requestAnimationFrame(frame);

function refresh(){
  recolorBuilding();
  if (state.view === 'building') { renderFloorPicker(); renderKpis(); renderTags(); }
  if (state.view === 'floor') { updatePlanSvg(); renderFloorStats(); }
  if (state.view !== 'room') renderActions();
  if ($('#flow').classList.contains('open')) $('#flow').querySelectorAll('.cols .v').forEach((v, i) => { v.textContent = flowValue(FLOW[i].id); });
  if (state.view === 'room') { renderInspector(); renderRoomTitle(); }
  $('#clock').textContent = LIVE.count ? fmtT(simMin) : '--:--';
  $('#speedLbl').textContent = LIVE.count ? '' : '데이터 대기';
  $('#wx').innerHTML = OUT ? `외기 ${OUT.temp.toFixed(1)}° · ${Math.round(OUT.hum)}%` : '';
  $('#live').classList.toggle('stale', performance.now() - LIVE.at > 6000);
  if ($('#dataPanel').classList.contains('open')) renderDataPanel();
  const alerts = ROOMS.filter(r => r.alert.level).map(r => ({ room:r.id, floor:r.floorId, name:r.name, level:r.alert.level, items:r.alert.items.map(i => i[1]) }));
  const sig = JSON.stringify(alerts.map(a => [a.room, a.level]));
  if (sig !== refresh.sig) { refresh.sig = sig; emit('twin:alert', { alerts }); }
}
setInterval(() => { if (booted) { refresh(); if (typeof hostReport === 'function') { hostReport(); simReport(); hostUiReport(); } } }, 1000);

/* ═════════════════════════ embed API ═════════════════════════ */
const API = {
  // 실시간 스냅샷 (twin.realtime/v1). 외부에서 들어온 실내기 값은 가상 장비가 덮어쓰지 않는다.
  update(snap){ LIVE.external = true; ingest(snap); },
  ingest(snap){ API.update(snap); },
  // 정적 데이터 교체: schedule · weather · tariff · maintenance 는 즉시, building 은 다시 그리기 위해 새로고침
  load(kind, json){
    kind = kind || kindOfData(json); if (!kind) return false;
    if (kind === 'realtime') return API.update(json);
    try { sessionStorage.setItem('twin:' + kind, JSON.stringify(json)); } catch {}
    if (kind === 'building') { location.reload(); return true; }
    DATA[kind] = json; DATA_FROM[kind] = '직접 넣은 파일';
    if (kind === 'schedule') loadSchedule(json); if (kind === 'maintenance') loadMaint(json); if (kind === 'tariff') loadTariff(json); if (kind === 'weather') loadWeather(json);
    renderActions.last = null; refresh(); return true;
  },
  navigate({ view, floor, room } = {}){
    if (view === 'room' && ROOM[room]) goRoom(ROOM[room]);
    else if (view === 'floor' && FLOOR[floor]) goFloor(FLOOR[floor]);
    else goBuilding();
  },
  setMetric, highlight, setPersona,
  model(){ return FLOORS.map(f => ({ id:f.id, rooms:f.rooms.map(r => ({ id:r.id, name:r.name, type:r.type, kind:r.kind, cap:r.cap, acs:r.acs.map(a => ({ id:a.id, odu:a.odu, model:a.model })) })) })); },
};
window.DigitalTwin = API;

/* ═════════════ 대시보드(4th-maestro Frontend '에게') 연동 ═════════════
   대시보드 → 트윈: {source:'maestro', type:'state', building, floor, mode, highlight, rooms} (버튼을 누를 때마다 옴)
     mode(온도·전력·습도·이상 감지) → 트윈 색 기준, floor(층 목록) → 트윈 층, highlight(AI 응답 대상 호실) → 깜빡임
   트윈 → 대시보드: {source:'twin', type:'roomSelected'|'floorSelected'|'modeSelected'} — 트윈에서 고르면 대시보드 버튼도 따라감 */
const HOST_MODE = { temp:'temp', humidity:'hum', powerKw:'power', anomaly:'alert', comfort:'comfort' }, MODE_HOST = { temp:'temp', hum:'humidity', power:'powerKw', alert:'anomaly', comfort:'comfort' };
const METRIC_KO = { temp:'온도', hum:'습도', power:'전력', alert:'이상 감지', comfort:'쾌적도' };
const HOST = { on:false, last:null, applying:false, timer:0, since:0 };
// 앱 데이터를 받은 뒤에만 보고: 그 전 값은 트윈 자체 계산이라 앱 화면 값이 바뀌어 보임. 5초 안에 못 받으면 그대로 보고
const hostReady = () => HOST.dataAt != null || performance.now() - HOST.since > 5000;
function hostSay(text){
  const el = $('#hostLink'); el.querySelector('.t').innerHTML = text; el.classList.add('flash');
  clearTimeout(HOST.timer); HOST.timer = setTimeout(() => { el.classList.remove('flash'); el.querySelector('.t').innerHTML = `대시보드 연동 · <b>${state.floor?.id || '건물'}</b> · ${METRIC_KO[state.metric]}`; }, 1800);
}
const pingEl = el => { if (!el) return; el.classList.remove('hostPing'); void el.offsetWidth; el.classList.add('hostPing'); };
const hostRoom = id => ROOM[id] || ROOMS.find(r => r.num && String(id).includes(r.num)) || null;
// 대시보드 Room[] (id = 트윈 실 id) → twin.realtime/v1. 실내기가 여러 대면 전력을 나누고 상태는 같게
function hostSnapshot(d){
  const idus = {}, rooms = {};
  for (const w of d.rooms || []) { const r = hostRoom(w.id); if (!r) continue;
    rooms[r.id] = { occupancy:w.occupants, temp:w.temp, hum:w.humidity };
    for (const a of r.acs) idus[a.id] = { power:w.onOff ? 'on' : 'off', setTemp:w.setpoint, roomTemp:w.temp, roomHum:w.humidity, kw:w.onOff ? w.powerKw / r.acs.length : 0, mode:w.mode, error:w.anomaly || null }; }
  return { schema:'twin.realtime/v1', source:d.mock ? '대시보드 (목업 데이터)' : '대시보드 (API)', time:d.time, ...(typeof d.outdoorTemp === 'number' ? { outdoor:{ hum:60, ...OUT, temp:d.outdoorTemp } } : {}), idus, rooms };
}
function syncHost(m){
  // 대시보드가 다른 건물을 고르면 그 건물로 다시 열기
  if (m.building && BUILDING_ID && m.building !== BUILDING_ID) { const p = new URLSearchParams(location.search); p.set('building', m.building); p.delete('data'); location.replace('?' + p); return; }
  const first = !HOST.on;
  if (first) { HOST.on = true; HOST.since = performance.now(); document.body.classList.add('hosted'); if (state.persona === 'sim') setPersona('owner', true);
    document.body.append($('#viewTools')); }   // 숨겨지는 상단 바 밖으로 (돋보기·전체화면 유지)
  const fresh = m.data?.rooms?.length && m.data.time !== HOST.dataAt;
  if (fresh) { HOST.dataAt = m.data.time; LIVE.external = true; ingest(hostSnapshot(m.data)); }
  // 데이터 반영 후 보고: 첫 시뮬레이션 보고부터 실측 여부(hasLive)가 맞게 전달됨
  if (first || fresh) { hostReport(true); simReport(true); hostUiReport(true); }
  const prev = HOST.last; HOST.last = m; const said = [];
  HOST.applying = true;
  try {
    const metric = HOST_MODE[m.mode];
    if (metric && metric !== state.metric) { setMetric(metric); said.push(METRIC_KO[metric]); pingEl(document.querySelector(`#metrics button[data-m="${metric}"]`)); }
    // 층: 대시보드에서 층을 바꿨을 때만 따라감 (상태가 5초마다 다시 와도 트윈에서 둘러보던 곳을 빼앗지 않게)
    if (m.floor === '' && state.floor && prev?.floor) goBuilding();
    if (m.floor && (!prev || prev.floor !== m.floor || prev.building !== m.building)) {
      const f = FLOOR[m.floor];
      if (f && state.floor !== f) { goFloor(f); said.push(`${f.id}로 이동`); }
      else if (!f) said.push(`${m.floor}는 이 건물에 없음`);
    }
    const ids = (m.highlight || []).map(hostRoom).filter(Boolean).map(r => r.id), key = ids.join(',');
    if (ids.length && key !== HOST.hl) { highlight(ids, 10); said.push(`${ids.length}개 호실 표시`); }
    HOST.hl = key;
  } finally { HOST.applying = false; }
  if (said.length) hostSay(`대시보드 → <b>${said.join(' · ')}</b>`);
  else if (!prev) hostSay(`대시보드 연동 · <b>${state.floor?.id || '건물'}</b> · ${METRIC_KO[state.metric]}`);
}
// 트윈에서 직접 바꾼 것 → 대시보드로 (대시보드가 보낸 걸 적용하는 중이면 되돌려 보내지 않음)
function tellHost(type, payload){ if (!HOST.on || HOST.applying) return; emit(type, { source:'twin', ...payload }); hostSay(`트윈 → 대시보드 <b>${Object.values(payload).join(' · ')}</b>`); }
// 트윈이 인식한 건물·층(도면에서 만든 층 수 그대로)과 층별 요약 → 대시보드 층 목록이 이걸로 바뀜 (변할 때만, 최대 3초에 한 번)
function hostReport(force){
  if (!HOST.on || !hostReady()) return;
  const floors = FLOORS.map(f => { const acs = f.rooms.flatMap(r => r.acs);
    return { floor:f.id, total:acs.length, on:acs.filter(a => a.status === 'on').length, anomaly:f.rooms.filter(r => r.alert.level).length, powerKw:+f.rooms.reduce((t, r) => t + r.power, 0).toFixed(1) }; });
  const sig = JSON.stringify(floors), now = performance.now();
  if (!force && (sig === HOST.sig || now - (HOST.at || 0) < 3000)) return;
  HOST.sig = sig; HOST.at = now;
  emit('building', { source:'twin', id:BUILDING_ID || BD.building.id, name:CFG.buildingName, floors });
}
{ const sm = setMetric; setMetric = m => { const before = state.metric; sm(m); if (state.metric !== before && MODE_HOST[m]) tellHost('modeSelected', { mode:MODE_HOST[m], label:METRIC_KO[m] }); }; API.setMetric = setMetric; }
window.addEventListener('message', e => {
  if (CFG.allowedOrigin && e.origin !== CFG.allowedOrigin) return;
  const m = e.data; if (!m || typeof m !== 'object') return;
  if (m.type === 'twin:update') API.update(m.data);
  else if (m.type === 'twin:navigate') API.navigate(m);
  else if (m.type === 'twin:metric') API.setMetric(m.metric);
  else if (m.type === 'twin:load') API.load(m.kind, m.data);
  else if (m.type === 'twin:highlight') API.highlight(m.rooms || [], m.seconds || 8);
  else if (m.type === 'twin:persona') API.setPersona(m.persona);
  else if (m.source === 'maestro' && m.type === 'state') syncHost(m);
  else if (m.source === 'maestro' && m.type === 'simRun' && !SIM.busy) { Object.assign(simForm(), m.form || {}); simRun(); }
  else if (m.source === 'maestro' && m.type === 'simAsk') simAsk(m);
  else if (m.source === 'maestro' && m.type === 'simRoom' && ROOM[m.room]) goRoom(ROOM[m.room]);
  else if (m.source === 'maestro' && m.type === 'ui' && typeof m.action === 'string') hostUi(m.action);
});
/* 앱 임베드 제어(2026-11-20): 앱 카드의 버튼이 숨긴 트윈 버튼을 대신 누름. 동작: persona:<역할>, flow, pipes, back, rv:<vol|slice|hum|air> */
const UI_ACT = { flow:'#flowBtn', pipes:'#pipesBtn', back:'#roomBack', 'rv:vol':'[data-rv="vol"]', 'rv:slice':'[data-rv="slice"]', 'rv:hum':'[data-rv="hum"]', 'rv:air':'[data-rv="air"]' };
function hostUi(a){
  const p = /^persona:(owner|engineer|facility|sim)$/.exec(a);
  // 역할 전환 때 시뮬레이션 상태도 다시 보냄: 앱의 운전 시뮬레이션 카드는 시뮬레이션 탭에서 새로 열려 이전 보고를 받지 못함
  if (p) { setPersona(p[1]); simReport(true); return hostUiReport(true); }
  const el = UI_ACT[a] && document.querySelector(UI_ACT[a]);
  if (el) { el.click(); hostUiReport(true); }
  // 앱 모달 닫기: 토글이 아닌 닫기 전용(여러 번 받아도 같은 결과)
  else if (a === 'flow:off') { setFlow(false); hostUiReport(true); }
}
// 앱으로 보고: 화면 상태(버튼 눌림 표시), 지표 칸, 조치 목록. 숨긴 #kpis·#actions가 그린 내용을 읽어 전달, 같으면 보내지 않음
const LV_OF = c => c.includes('danger') ? 2 : c.includes('caution') ? 1 : 0;
function hostUiReport(force){
  if (!HOST.on || !hostReady()) return;
  const B = document.body.classList, pressed = s => $(s)?.getAttribute('aria-pressed') === 'true';
  const ui = { view:B.contains('v-room') ? 'room' : B.contains('v-floor') ? 'floor' : 'building', persona:state.persona, flow:pressed('#flowBtn'), pipes:pressed('#pipesBtn'), idu:floorIduTypes(),
    rv:Object.fromEntries([...document.querySelectorAll('#roomTools [data-rv]')].map(b => [b.dataset.rv, b.getAttribute('aria-selected') === 'true'])) };
  const kpis = [...document.querySelectorAll('#kpis .kpi')].map(k => { const b = k.querySelector('b');
    return { key:k.id.replace('k-', ''), label:k.querySelector('small')?.textContent || '', value:b?.firstChild?.nodeType === 3 ? b.firstChild.textContent : (b?.textContent || ''), unit:b?.querySelector('i')?.textContent || '', bad:k.classList.contains('bad') }; });
  const A = $('#actions'), hero = A.querySelector('.hero'), hb = hero?.querySelector('b');
  const actions = state.persona === 'sim' ? null : { title:A.querySelector('.hd b')?.textContent || '', scope:A.querySelector('.hd .tag')?.textContent || '',
    hero:hero ? { label:hero.firstChild?.textContent || '', value:hb?.textContent || '', note:hero.textContent.replace(hero.firstChild?.textContent || '', '').replace(hb?.textContent || '', '').trim() } : null,
    items:[...A.querySelectorAll('.list .it')].map(b => { const t = b.querySelector('.t'), fl = t?.querySelector('em')?.textContent || '';
      return { room:b.dataset.room, floor:fl, title:(t?.textContent || '').slice(0, -fl.length || undefined).trim(), detail:b.querySelector('.d')?.textContent || '', lv:LV_OF(t?.querySelector('span')?.getAttribute('style') || '') }; }) };
  const flow = ui.flow ? flowModel() : null;
  const sig = JSON.stringify([ui, kpis, actions, flow]);
  if (!force && sig === hostUiReport.sig) return;
  hostUiReport.sig = sig; emit('twinUi', { source:'twin', ui, kpis, actions, flow });
}

/* ═════════════════════════ start ═════════════════════════ */
if (!LIVE.count) for (const r of ROOMS) r.alert = alertOf(r);
booted = true; themeReady = true;
if (!params.get('metric')) state.metric = PERSONA[state.persona].metric;
setPersona(state.persona, true);
renderLegend();
const startRoom = ROOM[params.get('room')], startFloor = FLOOR[params.get('floor')];
goBuilding.done = !!(startRoom || startFloor);
goBuilding(false);
if (startRoom || startFloor || reduceMotion) introStart = -99;
else { const ti = $('#introTitle'); ti.querySelector('b').textContent = CFG.buildingName; setTimeout(() => ti.classList.add('on'), 600); setTimeout(() => ti.classList.remove('on'), 4600); setTimeout(() => ti.remove(), 6000); }
if (startRoom) goRoom(startRoom, false);
else if (startFloor) { setBodyView('floor'); state.floor = startFloor; controls.enabled = false; buildPlanSvg(startFloor); updatePlanSvg(); renderFloorStats(); renderCrumbs(); renderLegend(); requestAnimationFrame(() => plan3d ? enterPlan3d(startFloor, false) : renderBackdrop(startFloor)); }
refresh();
emit('twin:ready', { floors: API.model() });
</script>
