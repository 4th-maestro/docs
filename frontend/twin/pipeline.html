<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자료 → 트윈 파이프라인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
<style>
  /* 디자인 토큰: 앱 src/index.css와 같은 값(DESIGN.md). iframe이라 앱 CSS를 불러올 수 없어 값을 맞춤
     - 테마: data-theme(주소 theme 또는 앱 메시지) 우선, 없으면 시스템 설정
     - 글자: 본문 16px, 보조 14px 이상, 버튼·입력 높이 44px, 화면의 주 동작 1개는 primary-fill 48px
     - 도면 위 표시 색: 이번 값 파랑(chart-cur), 선택은 primary(디자인 시스템 표 6.1 선택 객체) */
  :root{
    --page:#f5f5f3; --canvas:#ffffff; --surface-soft:#f7f7f7; --surface-strong:#efefed;
    --hairline:#dddddd; --hairline-soft:#ebebeb; --border-strong:#c1c1c1;
    --ink:#222222; --body:#3f3f3f; --muted:#6a6a6a; --on-ink:#ffffff;
    --primary:#ff385c; --primary-fill:#e00b41; --primary-active:#b8082f;
    --error:#c13515; --danger:#b91c1c; --ok:#15803d; --caution:#b45309;
    --chart-cur:#2a78d6;
    --shadow:rgba(0,0,0,.02) 0 0 0 1px, rgba(0,0,0,.04) 0 2px 6px 0, rgba(0,0,0,.1) 0 4px 8px 0;
    --r-sm:8px; --r-md:14px; --r-full:9999px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --page:#151618; --canvas:#1f2023; --surface-soft:#26282b; --surface-strong:#2e3034;
      --hairline:#3a3c40; --hairline-soft:#303236; --border-strong:#5b5e63;
      --ink:#e6e6e3; --body:#cfcfcb; --muted:#a2a29e; --on-ink:#151618;
      --error:#f2856d; --danger:#f27272; --ok:#4cc27a; --caution:#e0a060;
      --chart-cur:#3987e5;
      --shadow:rgba(0,0,0,.4) 0 0 0 1px, rgba(0,0,0,.3) 0 4px 8px 0;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --page:#151618; --canvas:#1f2023; --surface-soft:#26282b; --surface-strong:#2e3034;
    --hairline:#3a3c40; --hairline-soft:#303236; --border-strong:#5b5e63;
    --ink:#e6e6e3; --body:#cfcfcb; --muted:#a2a29e; --on-ink:#151618;
    --error:#f2856d; --danger:#f27272; --ok:#4cc27a; --caution:#e0a060;
    --chart-cur:#3987e5;
    --shadow:rgba(0,0,0,.4) 0 0 0 1px, rgba(0,0,0,.3) 0 4px 8px 0;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font:16px/1.5 'SUIT Variable',SUIT,-apple-system,system-ui,sans-serif}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  button:disabled{cursor:not-allowed}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  /* 머리글: 앱 상단바(.top)와 같은 면·구분선 */
  header{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 24px;border-bottom:1px solid var(--hairline);background:var(--canvas);flex-wrap:wrap}
  header h1{font-size:21px;margin:0;font-weight:700;white-space:nowrap}
  nav{display:flex;gap:8px;flex-wrap:wrap}
  /* 단계 버튼: 앱 .pill(높이 44, 선택은 ink 채움), 완료 단계는 번호 칸 ok 색 */
  nav button{height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 8px;border:1px solid var(--hairline);border-radius:var(--r-full);background:var(--canvas);color:var(--ink);font-size:15px;font-weight:500;white-space:nowrap}
  nav button:hover{background:var(--surface-soft)}
  nav button.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
  nav button .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface-strong);color:var(--ink);font-size:14px;font-weight:700}
  nav button.on .n{background:var(--on-ink);color:var(--ink)}
  nav button.done .n{background:var(--ok);color:var(--canvas)}
  .sp{flex:1}
  main{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100% - 65px);min-height:0}
  #stage{position:relative;overflow:hidden;background:var(--surface-soft)}
  #cv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
  #hint{position:absolute;left:16px;bottom:44px;padding:8px 12px;border:1px solid var(--hairline);border-radius:var(--r-sm);background:var(--canvas);box-shadow:var(--shadow);color:var(--body);font-size:15px;max-width:70%;pointer-events:none}
  aside{border-left:1px solid var(--hairline);background:var(--canvas);overflow:auto;padding:16px 20px 24px}
  aside h2{font-size:21px;font-weight:700;line-height:1.3;margin:0 0 8px}
  aside h3{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:16px;font-weight:600;margin:20px 0 8px;color:var(--ink)}
  aside h3 label{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:400;color:var(--body)}
  /* 설명 문단: 제목 아래 회색 한 줄 대신 본문 색 문단(디자인 시스템 7절) */
  .desc{color:var(--body);font-size:15px;line-height:1.5;margin:0 0 12px}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
  .row label{color:var(--muted);font-size:15px;min-width:72px}
  input,select{height:44px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--canvas);color:var(--ink);font-size:16px;min-width:0}
  input[type=number]{width:96px}
  input[type=range]{height:32px;padding:0;border:0;accent-color:var(--ink);flex:1;min-width:120px}
  input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink)}
  input[type=file]{height:auto;padding:8px;font-size:15px}
  input[type=file]::file-selector-button{height:32px;margin-right:12px;padding:0 14px;border:1px solid var(--hairline);border-radius:var(--r-sm);background:var(--surface-soft);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
  input:disabled,select:disabled{background:var(--surface-soft);color:var(--muted)}
  /* 버튼: 앱 .en-seg 버튼(높이 44, 라운드 8), 선택은 ink 채움, 비활성은 별도 회색 */
  button.b{min-height:44px;padding:4px 14px;border:1px solid var(--hairline);border-radius:var(--r-sm);background:var(--canvas);color:var(--ink);font-size:15px;font-weight:600;line-height:1.25}
  button.b:hover{background:var(--surface-soft)}
  button.b.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
  button.b.pri{min-height:48px;border:0;background:var(--primary-fill);color:#fff}
  button.b.pri:active{background:var(--primary-active)}
  button.b:disabled{border-color:var(--border-strong);background:var(--surface-strong);color:var(--muted)}
  /* 주 버튼이 있는 줄: 같은 줄 버튼은 높이 48·너비 1:1 */
  .row:has(> .pri){display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
  .row:has(> .pri) > .b{min-height:48px}
  .tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .list{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow:auto}
  .item{display:flex;gap:8px;align-items:center;min-height:44px;padding:4px 4px 4px 12px;border:1px solid var(--hairline);border-radius:var(--r-sm);background:var(--canvas);font-size:15px;overflow-wrap:anywhere}
  .item .x{margin-left:auto;display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 6px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-size:14px;font-weight:600}
  .item .x:hover{background:var(--surface-soft);color:var(--ink)}
  .item .x svg{pointer-events:none}
  .item.sel{border:2px solid var(--primary);padding:3px 3px 3px 11px}
  .warn{color:var(--caution);font-size:14px}
  .ok{color:var(--ok)}
  .ok,.warn{display:inline-flex;align-items:center;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-full);padding:0 8px;font-size:14px;font-weight:500;background:var(--surface-strong);color:var(--muted)}
  .chip .sw{width:12px;height:12px}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .thumbs div{position:relative;border:2px solid transparent;border-radius:var(--r-sm);overflow:hidden;cursor:pointer;aspect-ratio:1;background:var(--surface-soft)}
  .thumbs div.sel{border-color:var(--primary)}
  .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .thumbs span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.7);color:#fff;font-size:14px;padding:0 6px;border-radius:var(--r-sm)}
  .sw{display:inline-block;width:16px;height:16px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--hairline);vertical-align:middle}
  pre{background:var(--surface-soft);border:1px solid var(--hairline);border-radius:var(--r-sm);padding:8px 12px;font-size:14px;max-height:200px;overflow:auto;white-space:pre-wrap}
  code{font-size:14px}
  table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
  td,th{border-bottom:1px solid var(--hairline-soft);padding:6px 4px;text-align:left}
  th{font-size:14px;font-weight:600;color:var(--muted);border-bottom-color:var(--hairline)}
  [hidden]{display:none !important}
  /* 사진으로 건물 만들기: 앱 카드와 같은 면 */
  #quick{max-width:840px;margin:0 auto;padding:24px 16px 32px}
  #quick h2{margin:0 0 12px;font-size:21px;font-weight:700}
  #quick .row{margin:12px 0;gap:12px}
  #quick .batch-floor{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 0;border-bottom:1px solid var(--hairline-soft)}
  #quick .batch-floor label{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
  #quick .batch-floor input[type=file]{flex:1;min-width:180px}
  #quick fieldset{min-width:0;border:1px solid var(--hairline);border-radius:var(--r-md);margin:16px 0;padding:16px;background:var(--canvas)}
  #quick legend{padding:0 4px;font-size:16px;font-weight:600}
  #quick details{margin:16px 0}
  #quick summary{min-height:44px;display:flex;align-items:center;font-size:16px;font-weight:600;cursor:pointer}
  #quick .batch-pdf-status{flex-basis:100%;margin:0}
  #quick .batch-numbers{display:flex;gap:16px;flex-wrap:wrap}
  #quick .batch-numbers label{display:grid;gap:4px;color:var(--muted);font-size:15px}
  #quick input[type=file]{max-width:100%}
  #batchStatus{font-size:15px;color:var(--body)}
  @media (max-width:860px){ main{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto} aside{border-left:0;border-top:1px solid var(--hairline)} header{padding:8px 16px} }
  .batch-photo{border:1px dashed var(--border-strong);border-radius:var(--r-sm);padding:8px 12px;margin:8px 0}
  .batch-photo.dragging{border-color:var(--ink);background:var(--surface-soft)}
  .batch-photo ul{list-style:none;margin:0;padding:0}
  .batch-photo li{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
  .batch-photo li span{overflow-wrap:anywhere;min-width:0}
  .batch-photo li button{flex:none}
</style>
</head>
<body>
<header>
  <h1>자료 → 트윈 파이프라인</h1>
  <nav id="steps"></nav>
  <span class="sp"></span>
  <button class="b" id="loadRecipe">레시피 열기</button>
  <select id="sample"><option value="">예시 열기…</option><option value="source/eng6/recipe.json">제6공학관 (피난안내도·와이파이맵)</option><option value="source/busan-station/recipe.json">부산역 (안내도 사진)</option></select>
  <input type="file" id="recipeFile" accept=".json" hidden>
</header>
<section id="quick" hidden>
  <h2>사진으로 건물 만들기</h2>
  <form id="batchForm">
    <div class="row"><label for="batchName">건물 이름</label><input id="batchName" required maxlength="80"></div>
    <fieldset>
      <legend>층별 평면도</legend>
      <p class="desc">PNG, JPG 또는 PDF를 넣으세요. PDF는 층별로 페이지를 고를 수 있습니다. 같은 도면을 쓰는 층은 범위를 지정하세요. 지하 1층은 -1로 입력합니다.</p>
      <div id="batchFloors"></div>
      <button class="b" type="button" id="batchAdd">도면 추가</button>
      <div class="row"><label for="batchRoofPlan">지붕 평면도 (선택)</label><input id="batchRoofPlan" type="file" accept="image/*"></div>
    </fieldset>
    <fieldset>
      <legend>참고 사진 · 선택</legend>
      <p class="desc">여러 장을 선택하거나 아래 영역에 끌어다 놓으세요. 추가할 때마다 목록에 쌓입니다.</p>
      <div class="batch-photo" id="batchExteriorGroup">
        <div class="row"><label for="batchExterior">외관 사진</label><input type="file" id="batchExterior" multiple accept="image/*"></div>
        <p class="desc" role="status"></p><ul aria-label="첨부한 외관 사진"></ul>
      </div>
      <div class="batch-photo" id="batchOverheadGroup">
        <div class="row"><label for="batchOverhead">스카이뷰 사진 (선택)</label><input type="file" id="batchOverhead" multiple accept="image/*"></div>
        <p class="desc">층별 평면도에서 외곽을 찾고, 맞는 스카이뷰가 있으면 지붕 형태를 보정합니다.</p>
        <p class="desc" role="status"></p><ul></ul>
      </div>
      <div class="batch-photo" id="batchInteriorGroup">
        <div class="row"><label for="batchInterior">내부 사진</label><input type="file" id="batchInterior" multiple accept="image/*"></div>
        <p class="desc" role="status"></p><ul aria-label="첨부한 내부 사진"></ul>
      </div>
    </fieldset>
    <details>
      <summary>건물 치수 · 선택</summary>
      <p class="desc">실제 치수를 모르면 아래 기본값으로 모델을 만듭니다.</p>
      <div class="batch-numbers">
        <label>가로 (m)<input id="batchWidth" type="number" min="3" max="200" step="any" value="48" required></label>
        <label>세로 (m)<input id="batchDepth" type="number" min="3" max="200" step="any" value="35" required></label>
        <label>층고 (m)<input id="batchHeight" type="number" min="2" max="15" step="any" value="3.6" required></label>
      </div>
    </details>
    <div class="row"><button class="b pri" id="batchRun">3D 트윈 만들기</button><button class="b" type="button" id="advanced">직접 편집</button></div>
    <p id="batchStatus" role="status" aria-live="polite"></p>
  </form>
</section>
<main id="editor">
  <div id="stage"><canvas id="cv"></canvas><div id="hint"></div></div>
  <aside id="side"></aside>
</main>
<input type="file" id="imgFile" accept="image/*" multiple hidden>
<input type="file" id="planFile" accept="image/*,application/pdf,.pdf" hidden>
<script type="module">
import * as P from './pipeline/pipeline-core.js';
import * as EP from './pipeline/energyplus.js';
import { analyzePlanPhoto, detectPlanCorners, validCorners, floorNumber, floorIdOf, occupiedFloorIds, expandFloorGroups, floorResultFor } from './pipeline/plan-upload.js';
import { askDetect, detectRes, onPlans } from './pipeline/host-bridge.js';
import { isPdf, planImage, planPageCount } from './pipeline/pdf-plan.js';
import { CLEAN_FILL, cleanPlanPhoto } from './pipeline/plan-clean.js';
import { normalizePlanLines, resolvePlanGeometry } from './pipeline/plan-lines.js';
import { planPdfPixels } from './pipeline/plan-pdf.js';
import { sheetSilhouette, alignSheets } from './pipeline/plan-sheet.js';
import { applyAutomaticExterior, applyFacadeTaper, fitAnalysisImage, floorForRoomDetection, hasDrawingFrame, inferFacadeDome, inferFacadeTaper, inferFoldedRoof, inferOverheadRoof, inferPlanFootprintFromLines, registerPlanOutline } from './pipeline/auto-exterior.js';

/* ───────── 상태: 레시피(사람이 한 모든 결정) + 이미지 ───────── */
const newFloor = id => ({ id, image:null, corners:null, mode:'auto', params:{ dark:40, sat:70, close:1, minArea:3.5 }, ops:[] });
const blank = () => ({ schema:'twin.pipeline/v1', id:'new', base:'',
  building:{ id:'BLDG', name:'새 건물', size:{ w:48, d:35 }, floorHeight:3.6, ceiling:2.8 },
  floors:[newFloor('1F')],
  exterior:{ photos:[] }, interior:[], acPhotos:[] });
let R = blank(), planMessage = '', uploadVersion = 0;
const IMG = new Map();            // 파일명 → { el, data(ImageData), url }
const RECT = new Map();           // 층 → 보정된 도면 (캐시)
const RES = new Map();            // 층 → 분할 결과
let iduKind = '4WAY', iduFrom = '도면 표기';
// 건물 윤곽 도구: 어느 윤곽(base 바닥 / top 곡면 외피 윗면)을, 어떤 방식(poly 꼭짓점 / ellipse 타원 3점)으로 그릴지
let footTarget = 'base', footMode = 'poly';
const FOOT_KEY = { base:'footprint', top:'topFootprint' };
// 윤곽 저장 형식: 하나면 다각형 그대로(예전 데이터와 같음), 여러 개(떨어진 동)면 다각형 목록
const loopsOf = (f, k) => !f[k]?.length ? [] : Array.isArray(f[k][0]?.[0]) ? f[k] : [f[k]];
const setLoops = (f, k, ls) => { if (!ls.length) delete f[k]; else f[k] = ls.length === 1 ? ls[0] : ls; };
// 타원: 중심 c, 긴 축 끝 a, 짧은 축 쪽 점 b(긴 축 직선까지 거리 = 짧은 반지름) → 72점
function ellipseLoop(c, a, b, n = 72) {
  const ra = Math.hypot(a[0] - c[0], a[1] - c[1]), th = Math.atan2(a[1] - c[1], a[0] - c[0]);
  const rb = b ? Math.abs((b[0] - c[0]) * Math.sin(th) - (b[1] - c[1]) * Math.cos(th)) : ra;
  return Array.from({ length:n }, (_, i) => { const t = 2 * Math.PI * i / n, x = ra * Math.cos(t), y = rb * Math.sin(t);
    return [Math.round((c[0] + x * Math.cos(th) - y * Math.sin(th)) * 100) / 100, Math.round((c[1] + x * Math.sin(th) + y * Math.cos(th)) * 100) / 100]; });
}
let editMode = false, editF = 0, editTool = 'room', editSel = null, iduDrag = null, EV = { s:1, ox:0, oy:0 };
let showMask = false, step = 'plan', fi = 0, tool = 'corner', sel = null, pending = [], drag = null, photoSel = null, OUT = null;
const $ = s => document.querySelector(s), cv = $('#cv'), g = cv.getContext('2d');
const F = () => R.floors[fi];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
// 테마: 주소 theme(light|dark) 우선, 없으면 시스템 설정. 앱 메시지는 아래 '테마 동기화'에서 받음
{ const t = new URLSearchParams(location.search).get('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; }
// 캔버스 색: CSS 변수를 직접 못 쓰므로 그릴 때 토큰 값을 읽음
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const FONT = '"SUIT Variable", SUIT, system-ui, sans-serif';
// 아이콘: lucide 1.76.0 경로(앱 lucide-react와 같은 판)
const svgI = d => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const IC = { check:svgI('<path d="M20 6 9 17l-5-5"/>'), x:svgI('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>') };

async function addImage(name, src){
  const el = new Image(); el.src = src; await el.decode();
  const c = document.createElement('canvas'); c.width = el.naturalWidth; c.height = el.naturalHeight;
  const cg = c.getContext('2d', { willReadFrequently:true }); cg.drawImage(el, 0, 0);
  IMG.set(name, { el, url:src, data:cg.getImageData(0, 0, c.width, c.height) });

function compute(f){
  const W = R.building.size.w, D = R.building.size.d;
  let rect = null;
  if (f.image && f.corners?.length === 4 && IMG.has(f.image)) {   // 수동 모드도 바탕 그림용으로는 펴 둠
    const key = f.image + JSON.stringify(f.corners) + W + 'x' + D + (f.darkPlan ? '-dark' : '');
    if (RECT.get(f.id)?.key !== key) RECT.set(f.id, { key, rect:P.rectify(IMG.get(f.image).data, f.corners, W, D, f.darkPlan) });
    rect = RECT.get(f.id).rect;
  }
  const analysis = f.mode === 'fill' && f.cleanPhoto && rect ? cleanRect(f) : rect;
  const normalized = f.mode === 'auto' && f.normalizeLines && rect ? normalizedRect(f) : null;
  RES.set(f.id, { rect, ...resolvePlanGeometry(f, analysis, W, D, normalized) });
  return RES.get(f.id);
}
function normalizedRect(f) {
  const cache = RECT.get(f.id);
  const key = `${f.params.dark}:${f.params.sat}`;
  if (cache.lineKey !== key) {
    const { w, d } = R.building.size;
    cache.lines = normalizePlanLines(cache.rect, w, d, f.params);
    cache.lineKey = key;
  }
  return cache.lines;
}
async function downloadLinePlan(f) {
  try {
    compute(f);
    const { pdf } = await planPdfPixels(normalizedRect(f), P.RES);
    const url = URL.createObjectURL(pdf), link = document.createElement('a');
    link.href = url; link.download = f.id + '-정리한-평면도.pdf'; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (error) {
    planMessage = '정리한 도면 PDF를 만들지 못했습니다. ' + error.message;
    renderSide();
  }
}
function cleanRect(f) {
  const cache = RECT.get(f.id);
  cache.cleaned ??= cleanPlanPhoto(fitAnalysisImage(IMG.get(f.image).data, 1200)).image;
  const raw = IMG.get(f.image).data, clean = cache.cleaned;
  cache.cleanedRect ??= P.rectify(clean, f.corners.map(([x,y]) => [x * clean.width / raw.width, y * clean.height / raw.height]), R.building.size.w, R.building.size.d);
  return cache.cleanedRect;
}
function computeAll(){
  const { recipe, sources } = expandFloorGroups(R), results = {};
  if (R.autoExterior) applyAutomaticExterior(recipe.floors, R.autoRoof);
  applyFacadeTaper(recipe.floors, R.facadeTaper);
  const geometry = new Map(R.floors.map(f => [f.id, compute(f)]));
  for (const [i, f] of recipe.floors.entries()) {
    const bounded = floorForRoomDetection(f);
    if (bounded !== f) {
      recipe.floors[i] = bounded;
      results[f.id] = compute(bounded).out;
      continue;
    }
    const source = sources.get(f.id).id, entry = geometry.get(source);
    results[f.id] = floorResultFor(entry.out, source, f.id);
    if (source !== f.id) RES.set(f.id, { ...entry, out:results[f.id] });
  }
  OUT = P.assemble(recipe, results);
  return OUT;
}

const inv = (X, Y) => [(X - view.ox) / view.s, (Y - view.oy) / view.s];

function setFloorGroup(f, end) {
  const first = floorNumber(f.id);
  if (!first || !Number.isInteger(end) || end < first || (first < 0 && end === 0)) throw new Error('마지막 층은 시작 층 이상의 정수여야 합니다 (0층은 없음).');
  const taken = new Set(R.floors.filter(x => x !== f).flatMap(occupiedFloorIds));

async function uploadPlan(file, floor) {
  if (!file) return;
  const version = ++uploadVersion, recipe = R;
  let name, url, i = 2;
  try {
    let page = 1;
    if (isPdf(file)) {
      const pages = await planPageCount(file);
      if (version !== uploadVersion || recipe !== R || floor !== F() || step !== 'plan') return;
      if (pages > 1) {
        const choice = window.prompt(`이 층에 사용할 PDF 페이지를 입력하세요 (1~${pages}).`, '1');
        if (choice === null) return;
        page = Number(choice);
      }
    }
    const image = await planImage(file,page);
    if (version !== uploadVersion || recipe !== R || floor !== F() || step !== 'plan') return;
    name = image.name;
    while (IMG.has(name)) name = i++ + '-' + image.name;
    url = URL.createObjectURL(image);
    await addImage(name,url);
    if (version !== uploadVersion || recipe !== R || floor !== F() || step !== 'plan') { URL.revokeObjectURL(url); IMG.delete(name); return; }
    const photo = IMG.get(name).data;
    floor.darkPlan = P.isDarkPlan(photo);
    const detected = floor.darkPlan ? [[0,0],[photo.width-1,0],[photo.width-1,photo.height-1],[0,photo.height-1]] : detectPlanCorners(photo);
    floor.image = name;
    floor.normalizeLines = true;
    useCorners(floor, detected);
    tool = 'corner';
    planMessage = detected ? '모서리 4점을 찾았습니다. 표시를 확인하거나 다시 지정하세요.' : '뚜렷한 외곽을 찾지 못했습니다. 모서리 4점을 찍거나 이미지 전체를 사용하세요.';
    recompute();
  } catch (error) {
    if (url && !IMG.has(name)) URL.revokeObjectURL(url);
    if (version === uploadVersion && recipe === R && floor === F()) {
      planMessage = isPdf(file) ? error.message : '이미지를 열 수 없습니다. PNG나 JPG 파일을 확인해 주세요.';
      renderSide();
    }
  }
}

async function verifyCompare(){
  const v = $('#verify'); let ref;

  try { ref = await (await fetch(refUrl, { cache:'no-store' })).json(); } catch { v.textContent = refUrl + '을 읽을 수 없음 (손으로 그린 기준 도면)'; return; }

  }
  v.innerHTML = `<table><tr><th>층</th><th>찾은 실</th><th>IoU≥0.8</th><th>평균 IoU</th><th>실내기 (새/기존)</th></tr>${rows.join('')}</table>

async function estimatePhotoTone(files, exterior) {
  const groups = new Map();
  let unreadable = 0;
  for (const file of files) {
    const src = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = src;
      await img.decode();
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 32;
      const ctx = canvas.getContext('2d', { willReadFrequently:true });
      const { naturalWidth:w, naturalHeight:h } = img;
      ctx.drawImage(img, w*.25, h*(exterior ? .24 : .40), w*.5, h*.48, 0,0,32,32);
      const rgba = ctx.getImageData(0,0,32,32).data;
      for (let i = 0; i < rgba.length; i += 4) {
        const [r,g,b] = rgba.subarray(i,i+3), peak = Math.max(r,g,b), base = Math.min(r,g,b);
        if (rgba[i+3] < 180 || peak < 43 || base > 224) continue;

        bucket.sum[0] += r; bucket.sum[1] += g; bucket.sum[2] += b;
        groups.set(key,bucket);
      }
    } catch { unreadable++; }
    finally { URL.revokeObjectURL(src); }
  }
  const best = [...groups.values()].sort((a,b) => b.count-a.count)[0];
  const color = best ? '#' + best.sum.map(sum => Math.round(sum / best.count).toString(16).padStart(2,'0')).join('') : null;
  return { color, unreadable };
}

// 기호 인식 결과(호스트 detect=1): 층 id → {background, detections}, 결과 전송 때 층에 붙임(좌표 변환, 호실 배정은 호스트)
let DETECT = {}, DETECT_WARN = [];

  if (!Object.keys(DETECT).length) return json;
  return { ...json, floors:json.floors.map(f => ({ ...f, ...DETECT[f.id] })), meta:{ ...json.meta, ingest:{ kind:'image', createdAt:new Date().toISOString(), warnings:DETECT_WARN } } };
}
async function detectFloors(status) {
  DETECT = {}; DETECT_WARN = [];

  const W = R.building.size.w, D = R.building.size.d;
  for (const floor of R.floors) {
    const img = IMG.get(floor.image)?.data; if (!img || !floor.corners || !RECT.get(floor.id)?.rect) continue;
    status.textContent = floorLabel(floor) + ' 실내기 기호 인식 중…';
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    // 인식용 보정 이미지: 원본 이미지에서 최대 80px/m로 다시 보정(화면·벽 검출용 20px/m 보정 이미지는 그대로)
    const pxPerM = detectRes(floor.corners, W, D, P.MARGIN), rect = P.rectify(img, floor.corners, W, D, pxPerM);
    const ids = occupiedFloorIds(floor), res = await askDetect(ids, rect, pxPerM);
    if (res.error) DETECT_WARN.push(floorLabel(floor) + ' 실내기 기호 인식 생략: ' + res.error);
    // 보정 이미지 픽셀 (u, v) → 평면 m: x = u / pxPerM − MARGIN (rectify가 픽셀 i 중심을 (i + 0.5) / pxPerM − MARGIN에 둠)
    // 호스트가 보정 이미지를 PDF로 바꿔 서버가 다른 해상도로 렌더링했으면(res.px) 그 쪽 화소 기준으로 환산
    const px = Array.isArray(res.px) && res.px[0] > 0 && res.px[1] > 0 ? res.px : [rect.width, rect.height], ppm = pxPerM * px[0] / rect.width;
    const background = { ...(res.key ? { key:res.key } : {}), px, toPlan:[1 / ppm, 0, -P.MARGIN, 0, 1 / ppm, -P.MARGIN] };

}
function sendBuiltModel() {

function batchPhotos(id) {
  const input = $(id);
  const group = input.closest('.batch-photo');
  const list = group.querySelector('ul');
  const count = group.querySelector('[role=status]');
  const files = new Map();
  function render() {
    count.textContent = files.size ? files.size + '장 첨부됨' : '첨부한 사진 없음';
    list.replaceChildren(...[...files].map(([key, file]) => {
      const row = document.createElement('li'), label = document.createElement('span'), remove = document.createElement('button');
      label.textContent = file.name;
      remove.type = 'button';
      remove.className = 'b';
      remove.textContent = '빼기';
      remove.setAttribute('aria-label', file.name + ' 빼기');
      remove.onclick = () => { files.delete(key); render(); };
      row.append(label, remove);
      return row;
    }));
  }
  function add(picked) {
    let skipped = 0;
    for (const file of picked) {
      // 형식 정보가 비었거나 application/octet-stream이어도 확장자가 이미지면 받음 (webp·heic는 OS에 따라 형식이 안 붙음)
      if (!file.type.startsWith('image/') && !/\.(avif|bmp|gif|heic|heif|jpe?g|png|svg|tiff?|webp)$/i.test(file.name)) {
        skipped++;
        continue;
      }
      files.set(JSON.stringify([file.name, file.size, file.lastModified]), file);
    }
    render();
    if (skipped) count.textContent += ' · 이미지가 아닌 파일 ' + skipped + '개 제외';
  }
  input.addEventListener('change', () => { add(input.files); input.value = ''; });
  group.addEventListener('dragover', e => {
    if (!e.dataTransfer.types.includes('Files')) return;
    e.preventDefault();
    group.classList.toggle('dragging', !input.disabled);
  });
  group.addEventListener('dragleave', e => { if (!group.contains(e.relatedTarget)) group.classList.remove('dragging'); });
  group.addEventListener('drop', e => {
    e.preventDefault();
    group.classList.remove('dragging');
    if (!input.disabled) add(e.dataTransfer.files);
  });
  render();
  return { input, files };
}

const batchExterior = batchPhotos('#batchExterior');
const batchOverhead = batchPhotos('#batchOverhead');
const batchInterior = batchPhotos('#batchInterior');

const isOverheadName = name => /sky[ _-]*view|satellite|aerial|overhead|top[ _-]*view|스카이뷰|항공|위성|상공/i.test(name);
async function readExteriorPhoto(file) {
  const src = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = src;
    await image.decode();
    const scale = Math.min(1, 720 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const context = canvas.getContext('2d', { willReadFrequently:true });
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return context.getImageData(0, 0, canvas.width, canvas.height);
  } catch (error) {
    console.warn('외관 사진 분석을 건너뜁니다.', file.name, error);
    return null;
  } finally {
    URL.revokeObjectURL(src);
  }
}
async function estimateRoof(files, footprint, minimumScore) {
  let best = null;
  for (const file of files) {
    const image = await readExteriorPhoto(file);
    const match = image && inferOverheadRoof(image, footprint);
    if (match && match.score >= minimumScore && (!best || match.score > best.score)) best = match;
  }
  return best;
}

// 층별 도면 시트 → 같은 전체 상자(모든 층 덩어리를 겹친 범위)로 모서리를 잡아 층 위치·축척을 맞춤
// 반환: { gw, gh (기준층 px), fits: Map(floor → { corners (그 층 이미지 px), loops (0~1 정규 좌표) }) }, 반 넘는 층에서 못 찾으면 null
function sheetLayout(floors) {
  const items = floors.map(floor => { const img = IMG.get(floor.image)?.data; return img && !floor.darkPlan ? { floor, sil:sheetSilhouette(img) } : null; })
    .filter(it => it?.sil);
  if (!items.length || items.length < floors.length / 2) return null;
  const sils = items.map(it => it.sil), ref = sils.reduce((b, s, i) => s.area > sils[b].area ? i : b, 0);
  const T = items.length > 1 ? alignSheets(sils, ref) : [{ s:1, dx:0, dy:0, iou:1 }];
  const ok = items.map((it, i) => ({ ...it, t:T[i] })).filter(it => it.t.iou >= .35);   // 너무 안 맞는 층은 기존 방식으로
  if (!ok.length) return null;
  const to = (t, [x, y]) => [t.s * x + t.dx, t.s * y + t.dy];
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const it of ok) for (const l of it.sil.loops) for (const p of l) { const [X, Y] = to(it.t, p); x0 = Math.min(x0, X); y0 = Math.min(y0, Y); x1 = Math.max(x1, X); y1 = Math.max(y1, Y); }
  const gw = x1 - x0, gh = y1 - y0; if (gw < 20 || gh < 20) return null;
  const fits = new Map(ok.map(({ floor, sil, t }) => {
    const back = ([X, Y]) => [(X - t.dx) / t.s, (Y - t.dy) / t.s];
    return [floor, { corners:[[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(back),
      loops:sil.loops.map(l => l.map(p => { const [X, Y] = to(t, p); return [(X - x0) / gw, (Y - y0) / gh]; })) }];
  }));
  snapSharedEdges([...fits.values()].map(f => f.loops), .012);
  return { gw, gh, fits };
}
// 층끼리(그리고 한 층 안에서) 거의 같은 위치의 수평·수직 벽선을 한 좌표로 모음 → 위아래 층 외벽이 같은 선에 서고 잔 어긋남이 사라짐
// loopsPerFloor: 층마다 [고리[[u,v]...]] (0~1 정규 좌표), tol: 이 거리 안의 선은 같은 벽 (길이 가중 평균)
function snapSharedEdges(loopsPerFloor, tol) {
  const lines = { x:[], y:[] };
  for (const loops of loopsPerFloor) for (const l of loops) l.forEach((a, i) => { const b = l[(i + 1) % l.length], dx = Math.abs(b[0] - a[0]), dy = Math.abs(b[1] - a[1]);
    if (dx < 1e-9 && dy > 0) lines.x.push({ v:a[0], w:dy }); else if (dy < 1e-9 && dx > 0) lines.y.push({ v:a[1], w:dx }); });
  const groups = list => { list.sort((a, b) => a.v - b.v); const out = [];
    for (const it of list) { const g = out.at(-1); if (g && it.v - g.last <= tol) { g.items.push(it); g.last = it.v; } else out.push({ items:[it], last:it.v }); }
    return out.map(g => ({ lo:g.items[0].v, hi:g.last, v:g.items.reduce((s, it) => s + it.v * it.w, 0) / g.items.reduce((s, it) => s + it.w, 0) })); };
  const gx = groups(lines.x), gy = groups(lines.y), to = (gs, v) => gs.find(g => v >= g.lo - 1e-9 && v <= g.hi + 1e-9)?.v ?? v;
  for (const loops of loopsPerFloor) for (const l of loops) {
    const n = l.length, old = l.map(p => [...p]);
    for (let i = 0; i < n; i++) for (const j of [(i - 1 + n) % n, (i + 1) % n]) {   // 이 점에 붙은 수직 변 → x, 수평 변 → y
      if (Math.abs(old[j][0] - old[i][0]) < 1e-9 && Math.abs(old[j][1] - old[i][1]) > 0) l[i][0] = to(gx, old[i][0]);
      if (Math.abs(old[j][1] - old[i][1]) < 1e-9 && Math.abs(old[j][0] - old[i][0]) > 0) l[i][1] = to(gy, old[i][1]);
    }
    for (let i = l.length - 1; i >= 0 && l.length > 3; i--) { const q = l[(i + 1) % l.length]; if (Math.hypot(q[0] - l[i][0], q[1] - l[i][1]) < 1e-6) l.splice(i, 1); }
  }
}

async function runBatch(event) {

    assumed:['업로드 사진에서 자동 추정한 모델. 치수 미입력 시 기본값 48×35 m·층고 3.6 m.',
      '공간 이름·용도와 공조 위치·용량은 실측 자료로 확인해야 합니다. 지붕과 외피의 형태는 도면과 참고 사진을 맞춰 추정합니다.'] };
  next.autoExterior = true;
  next.zoning = { enabled:false };
  next.floors = rows.map(({first,last,open}) => ({ ...newFloor(floorIdOf(first)), ...(last !== first ? {repeatUntil:last} : {}), autoSpaces:!open, normalizeLines:true, ...(open ? {mode:'manual',open:true,green:true} : {}), ...(first < 0 ? {below:true} : {}) }));
  try {
    if (rows.some(row => !row.file)) throw new Error('각 층 또는 층 범위에 평면도를 한 장씩 넣어 주세요.');
    if (rows.some(({first,last}) => !first || !last || (first < 0 && last > 0))) throw new Error('0층은 없으며 지하층과 지상층은 별도 도면 행으로 지정해 주세요.');
    if (expandFloorGroups(next).recipe.floors.length > 100) throw new Error('한 건물에 최대 100개 층을 구성할 수 있습니다.');
  } catch (e) { status.textContent = e.message; return; }
  const controls = [...batch.querySelectorAll('button:not(:disabled), input:not(:disabled)')];
  for (const control of controls) control.disabled = true;
  const frame = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const urls = [];
  const missing = [];
  try {
    for (const [i,row] of rows.entries()) {
      const floor = next.floors[i];
      if (isPdf(row.file)) {
        status.textContent = floorLabel(floor) + ` PDF ${row.page}페이지를 이미지로 변환 중…`;
        await frame();
      }
      const image = await planImage(row.file,row.page);
      status.textContent = floorLabel(floor) + ' 평면도 분석 중…';
      await frame();
      const filename = floor.id + '-' + image.name, url = URL.createObjectURL(image);
      urls.push({ filename,url });
      await addImage(filename,url);
      floor.image = filename;
      const data = IMG.get(filename).data;
      floor.darkPlan = P.isDarkPlan(data);
      const detected = floor.darkPlan ? null : detectPlanCorners(data);
      floor.corners = detected || [[0,0],[data.width-1,0],[data.width-1,data.height-1],[0,data.height-1]];
      if (!detected && !floor.darkPlan) missing.push(floor.id);
      if (!validCorners(floor.corners)) throw new Error(floor.id + ' 이미지가 너무 작습니다.');
    }
    // 도면 시트(제목·범례·화면 캡처 여백 포함)에서 건물 덩어리를 찾아 층끼리 겹쳐 맞춤 → 모서리·외곽선·가로세로 비율

        next.building.assumed.push('치수 미입력: 도면 건물 덩어리의 가로세로 비율로 ' + next.building.size.w + '×' + next.building.size.d + ' m 가정.');

        const k = missing.indexOf(floor.id); if (k >= 0) missing.splice(k, 1);
      }

    status.textContent = '참고 사진에서 색상 추정 중…';

    const inside = await estimatePhotoTone(interior,false);
    if (outside.color) next.exterior.facade = { glassColor:outside.color, glassOpacity:.18 };

    const { w, d } = R.building.size;
    for (const floor of R.floors) {
      status.textContent = floorLabel(floor) + ' 건물 윤곽 인식 중…';
      await frame();

      const rect = P.rectify(photo, floor.corners, w, d, floor.darkPlan);
      RECT.set(floor.id, { key:floor.image + JSON.stringify(floor.corners) + w + 'x' + d + (floor.darkPlan ? '-dark' : ''), rect });
      if (floor.sheetLoops) {   // 도면 시트에서 찾은 덩어리(전체 상자 기준 0~1)를 m로

        floor.footprint = loops.length === 1 ? loops[0] : loops;
        delete floor.sheetLoops;

    }
    const orderedFloors = [...R.floors].sort((a,b)=>floorNumber(a.id)-floorNumber(b.id));
    for (const floor of orderedFloors) {
      if (floor.darkPlan && (!floor.footprint || hasDrawingFrame(floor.footprint,w,d))) {
        const reference = orderedFloors.filter(other => other !== floor && other.below === floor.below && other.footprint && !hasDrawingFrame(other.footprint,w,d))
          .sort((a,b)=>Math.abs(floorNumber(a.id)-floorNumber(floor.id))-Math.abs(floorNumber(b.id)-floorNumber(floor.id)))[0];
        const align = reference && registerPlanOutline(RECT.get(floor.id).rect,reference.footprint,w,d,floor.params);
        if (align) {
          const frame = [[0,0],[w,0],[w,d],[0,d]], toPhoto = P.homography(frame,floor.corners);
          floor.corners = frame.map(([x,y])=>toPhoto(...align(x,y)));
          floor.footprint = structuredClone(reference.footprint);
        }
      }
      status.textContent = floorLabel(floor) + ' 실내 공간 인식 중…';
      await frame();
      const photo = IMG.get(floor.image).data;
      if (floor.darkPlan) floor.params = { ...floor.params, dark:46 };
      let entry = compute(floor);
      if (!entry.out.rooms.some(room => room.type === 'room')) {
        floor.params = { ...floor.params, dark:floor.darkPlan ? 22 : 30, close:3 };
        entry = compute(floor);
      }
      // 실제보다 작게 가정한 치수(기본 48 m)면 방이 최소 면적 아래로 떨어짐 → 방이 적으면 작은 방까지 받아 봄
      const roomCount = e => e.out.rooms.filter(room => room.type === 'room').length;
      if (floor.sheetFit && roomCount(entry) < 12) for (const extra of [{ minArea:1.2 }, { minArea:1.2, close:2 }, { minArea:.8, close:2, dark:55 }]) {
        const previous = floor.params;
        floor.params = { ...previous, ...extra };
        const e = compute(floor);
        if (roomCount(e) > roomCount(entry) * 1.3 + 2) entry = e; else floor.params = previous;
      }
      delete floor.sheetFit;
      if (!entry.out.rooms.some(room => room.type === 'room') || !floor.footprint) {
        const paint = analyzePlanPhoto(photo);
        const areas = paint?.blocks.map(block => block.area) ?? [];
        if (paint?.coverage >= .035 && Math.max(...areas) >= .75 * areas.reduce((total, area) => total + area, 0)) {
          const previous = { mode:floor.mode, params:floor.params };
          Object.assign(floor, { mode:'fill', cleanPhoto:true, params:{ ...floor.params, fill:CLEAN_FILL } });
          const painted = compute(floor);
          if (painted.out.rooms.filter(room => room.type === 'room').length > entry.out.rooms.filter(room => room.type === 'room').length) {

          } else {
            Object.assign(floor, previous);

          }
        }
      }
      const found = entry.out.rooms.some(room => room.type === 'room');
      if (!found) floor.note = '닫힌 공간을 인식하지 못해 층 윤곽만 표시합니다.';
      else if (missing.includes(floor.id)) floor.note = '모서리 검출이 불확실해 이미지 전체를 사용했습니다. 공간과 설비는 추정값입니다.';
    }

    const { recipe:expanded, sources } = expandFloorGroups(R);
    const last = expanded.floors.at(-1), top = last && sources.get(last.id);
    if (top && !top.below && !top.open && (roofPlan || overhead.length || facadePhotos.length)) {
      status.textContent = '외관 사진에서 지붕 윤곽을 찾아 도면에 맞추는 중…';
      await frame();
      const loops = loopsOf(top, 'footprint');
      const reference = top.footprint ?? [[0,0],[w,0],[w,d],[0,d]];
      const { floorHeight } = next.building;
      if (roofPlan) {
        const drawing = await readExteriorPhoto(roofPlan);
        const corners = drawing && [[0,0],[drawing.width-1,0],[drawing.width-1,drawing.height-1],[0,drawing.height-1]];
        const dark = drawing && P.isDarkPlan(drawing);
        const rect = drawing && validCorners(corners) && P.rectify(drawing,corners,w,d,dark);
        const planParams = dark ? { ...top.params,dark:16 } : top.params;
        const outline = rect && inferPlanFootprintFromLines(rect, normalizePlanLines(rect,w,d,planParams), w,d,planParams,dark);
        if (outline && Array.isArray(outline[0][0]) === Array.isArray(reference[0][0]) &&
            (!Array.isArray(outline[0][0]) || outline.length === reference.length)) R.autoRoof = { floor:last.id, footprint:outline };
        else next.building.assumed.push('지붕 평면도에서 최상층에 대응하는 윤곽을 확인하지 못했습니다.');
      }
      // A generic rectangular silhouette cannot distinguish a front photo from a roof.
      const match = overhead.length ? await estimateRoof(overhead, reference, top.footprint ? .65 : .74)
        : loops.length > 1 || loops[0]?.length >= 7 ? await estimateRoof(facadePhotos, reference, .83) : null;
      if (match) {
        R.autoRoof ??= { floor:last.id, footprint:match.footprint };
        R.exterior.facade = { ...R.exterior.facade, roofColor:match.color };
      } else if (overhead.length) next.building.assumed.push('스카이뷰 윤곽과 최상층 도면이 충분히 일치하지 않아 지붕의 평면 윤곽은 도면을 사용했습니다.');
      for (const file of facadePhotos) {
        const image = await readExteriorPhoto(file);
        if (!image) continue;
        const dome = inferFacadeDome(image, R.autoRoof?.footprint ?? reference, floorHeight);
        if (dome && !R.exterior.facade?.dome) R.exterior.facade = { ...R.exterior.facade, dome };
        const roofProfile = !dome && inferFoldedRoof(image);
        if (roofProfile && !R.exterior.facade?.roofProfile) R.exterior.facade = { ...R.exterior.facade, roofProfile };
        const taper = !dome && !roofProfile && !R.facadeTaper && inferFacadeTaper(image);
        if (taper) {
          R.facadeTaper = taper.scale;
          if (taper.color) R.exterior.facade = { ...R.exterior.facade, glassColor:taper.color };
        }
      }
    }
    if (missing.length) next.building.assumed.push('모서리가 뚜렷하지 않아 이미지 전체를 사용한 평면도: ' + missing.join(', '));
    if (outside.unreadable + inside.unreadable) next.building.assumed.push('참고 사진 중 열 수 없는 파일 ' + (outside.unreadable + inside.unreadable) + '장 제외.');
    computeAll();
    if (!OUT.json.floors.some(floor => floor.footprint?.length || floor.topFootprint?.length || floor.rooms.some(room => room.type === 'room'))) {
      tool = 'corner';
      planMessage = '닫힌 공간을 자동 인식하지 못했습니다. 모서리나 벽을 보정한 뒤 결과에서 렌더링하세요.';
      showQuick(false);
      return;
    }
    sendBuiltModel();
  } catch (e) {
    if (R !== next) for (const {filename,url} of urls) { IMG.delete(filename); URL.revokeObjectURL(url); }
    status.textContent = '모델을 만들지 못했습니다. ' + e.message;
  } finally {
    for (const control of controls) control.disabled = false;
  }
}

$('#batchName').value = batchQuery.get('name') || '새 건물';
$('#batchAdd').onclick = addBatchFloor;
$('#advanced').onclick = () => { R.building.name = $('#batchName').value.trim() || R.building.name; showQuick(false); };
batch.addEventListener('submit', runBatch);
addBatchFloor();
if (batchQuery.get('quick') === '1') showQuick(true);
// 호스트가 넣은 평면도 이미지(이미지 파일, PDF 렌더링 페이지): 파일마다 층 행 1개(1F부터)
onPlans(files => {
  if (!files.length) return;
  $('#batchFloors').replaceChildren();
  for (const file of files) { const dt = new DataTransfer(); dt.items.add(file); addBatchFloor().querySelector('.batch-plan').files = dt.files; }
  $('#batchStatus').textContent = '평면도 ' + files.length + '장을 넣었습니다. 층 번호를 확인하고 3D 트윈 만들기를 누르십시오.';
});

window.PIPE = { get recipe(){ return R; }, get out(){ return OUT; }, openRecipe, computeAll, sha, pinRoomIdus, unitsOf };

renderSteps(); renderSide(); draw();
// 테마 동기화: 앱(부모 창)이 {source:'maestro', type:'theme', theme} 메시지로 전달, 부모 창 메시지만 수락. 바뀌면 캔버스 다시 그림
addEventListener('message', e => { const m = e.data;
  if (e.source !== window.parent || m?.source !== 'maestro' || m.type !== 'theme' || (m.theme !== 'light' && m.theme !== 'dark')) return;
  document.documentElement.dataset.theme = m.theme; draw(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) draw(); });
{ const q = new URLSearchParams(location.search), smp = q.get('sample');
  if (q.has('sample')) { const sel = $('#sample'); sel.value = smp && [...sel.options].some(o => o.value.includes(smp)) ? [...sel.options].find(o => o.value.includes(smp)).value : sel.options[1].value; sel.dispatchEvent(new Event('change')); } }
</script>
