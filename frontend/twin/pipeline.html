<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자료 → 트윈 파이프라인</title>
<style>
  :root{ --bg:#0f1420; --panel:#161d2c; --line:#26304a; --tx:#dbe3f2; --mut:#8a96ad; --acc:#6aa8ff; --ok:#36c08a; --warn:#f2a01f; --bad:#e5484d; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 Pretendard,system-ui,"Malgun Gothic",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:700}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:5px 11px;cursor:pointer;font:inherit}
  nav button.on{background:var(--acc);border-color:var(--acc);color:#071226;font-weight:700}
  nav button .n{display:inline-block;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.12);text-align:center;line-height:16px;font-size:11px;margin-right:5px}
  nav button.done .n{background:var(--ok);color:#071226}
  .sp{flex:1}
  main{display:grid;grid-template-columns:1fr 340px;height:calc(100% - 52px);min-height:0}
  #stage{position:relative;overflow:hidden;background:#0b0f18}
  #cv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
  #hint{position:absolute;left:12px;bottom:12px;background:rgba(10,14,22,.86);border:1px solid var(--line);padding:7px 10px;border-radius:8px;max-width:70%;pointer-events:none}
  aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px}
  aside h2{font-size:14px;margin:0 0 4px}
  aside h3{font-size:12px;margin:16px 0 6px;color:var(--mut);font-weight:600;text-transform:none}
  .desc{color:var(--mut);margin:0 0 10px}
  .row{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
  .row label{color:var(--mut);min-width:62px}
  input,select{background:#0e1422;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:5px 7px;font:inherit;min-width:0}
  input[type=number]{width:74px}
  button.b{background:#202a40;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
  button.b:hover{border-color:var(--acc)}
  button.b.on{background:var(--acc);color:#071226;border-color:var(--acc);font-weight:700}
  button.pri{background:var(--acc);color:#071226;border:0;font-weight:700}
  .tools{display:flex;flex-wrap:wrap;gap:4px}
  .list{display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
  .item{display:flex;gap:6px;align-items:center;background:#111827;border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:12px}
  .item .x{margin-left:auto;cursor:pointer;color:var(--mut)}
  .item.sel{border-color:var(--acc)}
  .warn{color:var(--warn);font-size:12px}
  .ok{color:var(--ok)}
  .chip{display:inline-block;border-radius:999px;padding:1px 7px;font-size:11px;background:#223050;color:#bcd0ff}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .thumbs div{position:relative;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:#0b0f18}
  .thumbs div.sel{border-color:var(--acc)}
  .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .thumbs span{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.65);font-size:10px;padding:0 4px;border-radius:4px}
  .sw{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.3);vertical-align:middle}
  pre{background:#0b0f18;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;max-height:200px;overflow:auto;white-space:pre-wrap}
  table{border-collapse:collapse;width:100%;font-size:12px}
  td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
  @media (max-width:860px){ main{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto} aside{border-left:0;border-top:1px solid var(--line)} }
</style>
</head>
<body>
<header>
  <h1>자료 → 트윈 파이프라인</h1>
  <nav id="steps"></nav>
  <span class="sp"></span>
  <button class="b" id="loadRecipe">레시피 열기</button>
  <select id="sample"><option value="">예시 열기…</option><option value="source/eng6/recipe.json">제6공학관 (피난안내도·와이파이맵)</option><option value="source/busan-station/recipe.json">부산역 (안내도 사진)</option></select>
  <input type="file" id="recipeFile" accept=".json" hidden>
</header>
<main>
  <div id="stage"><canvas id="cv"></canvas><div id="hint"></div></div>
  <aside id="side"></aside>
</main>
<input type="file" id="imgFile" accept="image/*" multiple hidden>
<script type="module">
import * as P from './pipeline/pipeline-core.js';
import * as EP from './pipeline/energyplus.js';

/* ───────── 상태: 레시피(사람이 한 모든 결정) + 이미지 ───────── */
const blank = () => ({ schema:'twin.pipeline/v1', id:'new', base:'',
  building:{ id:'BLDG', name:'새 건물', campus:'', size:{ w:48, d:35 }, floorHeight:3.6, ceiling:2.8 },
  floors:[{ id:'1F', image:null, corners:null, mode:'auto', params:{ dark:40, sat:70, close:1, minArea:3.5 }, ops:[] }],
  exterior:{ photos:[] }, interior:[], acPhotos:[] });
let R = blank();
const IMG = new Map();            // 파일명 → { el, data(ImageData), url }
const RECT = new Map();           // 층 → 보정된 도면 (캐시)
const RES = new Map();            // 층 → 분할 결과
let iduKind = '4WAY', iduFrom = '도면 표기';
let editMode = false, editF = 0, editTool = 'room', editSel = null, iduDrag = null, EV = { s:1, ox:0, oy:0 };
let showMask = false, step = 'plan', fi = 0, tool = 'corner', sel = null, pending = [], drag = null, photoSel = null, OUT = null;
const $ = s => document.querySelector(s), cv = $('#cv'), g = cv.getContext('2d');
const F = () => R.floors[fi];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);

async function addImage(name, src){
  const el = new Image(); el.src = src; await el.decode();
  const c = document.createElement('canvas'); c.width = el.naturalWidth; c.height = el.naturalHeight;
  const cg = c.getContext('2d', { willReadFrequently:true }); cg.drawImage(el, 0, 0);
  IMG.set(name, { el, url:src, data:cg.getImageData(0, 0, c.width, c.height) });
}
async function ensureImage(name){
  if (!name || IMG.has(name)) return;
  try { await addImage(name, (R.base || '') + name); } catch { console.warn('이미지 없음', name); }
}
function pickFiles(cb){ const f = $('#imgFile'); f.value = ''; f.onchange = async () => { const names = []; for (const file of f.files) { await addImage(file.name, URL.createObjectURL(file)); names.push(file.name); } cb(names); }; f.click(); }

/* ───────── 계산: 층 하나 ───────── */
function compute(f){
  const W = R.building.size.w, D = R.building.size.d;
  let rect = null;
  if (f.mode !== 'manual' && f.image && f.corners?.length === 4 && IMG.has(f.image)) {
    const key = f.image + JSON.stringify(f.corners) + W + 'x' + D;
    if (RECT.get(f.id)?.key !== key) RECT.set(f.id, { key, rect:P.rectify(IMG.get(f.image).data, f.corners, W, D) });
    rect = RECT.get(f.id).rect;
  }
  const res = P.resolveFloor(f, rect, W, D), out = P.floorRooms(f, res, W, D);
  RES.set(f.id, { rect, res, out });
  return RES.get(f.id);
}
function computeAll(){
  const results = {};
  for (const f of R.floors) results[f.id] = compute(f).out;
  OUT = P.assemble(R, results);
  return OUT;
}

/* ───────── 화면 좌표 ───────── */
let view = { s:1, ox:0, oy:0, w:1, h:1 };
function fit(w, h){ const W = cv.clientWidth, H = cv.clientHeight, s = Math.min(W / w, H / h) * .94; view = { s, ox:(W - w * s) / 2, oy:(H - h * s) / 2, w, h }; }
const scr = (x, y) => [view.ox + x * view.s, view.oy + y * view.s];
const inv = (X, Y) => [(X - view.ox) / view.s, (Y - view.oy) / view.s];
const mToPx = (x, y) => [(x + P.MARGIN) * P.RES, (y + P.MARGIN) * P.RES];
const pxToM = (i, j) => [i / P.RES - P.MARGIN, j / P.RES - P.MARGIN];
const snap = v => Math.round(v * 20) / 20;

/* ───────── 단계 정의 ───────── */
const STEPS = [
  ['info', '건물 정보'], ['plan', '평면도'], ['ext', '외부 사진'], ['int', '내부 사진'], ['ac', '에어컨 사진'], ['out', '결과'],
];
function renderSteps(){
  const done = { info:!!R.building.name, plan:R.floors.every(f => f.ops.length), ext:!!R.exterior.window, int:R.interior.length > 0, ac:R.acPhotos.some(p => p.marks.length) || !!R.acModel?.result || R.floors.some(f => f.ops.some(o => o.op === 'idu')), out:!!OUT };
  $('#steps').innerHTML = STEPS.map(([k, t], i) => `<button data-step="${k}" class="${k === step ? 'on' : ''} ${done[k] ? 'done' : ''}"><span class="n">${i + 1}</span>${t}</button>`).join('');
}
$('#steps').onclick = e => { const b = e.target.closest('[data-step]'); if (b) go(b.dataset.step); };
function go(s){ step = s; sel = null; pending = []; photoSel = null; if (s === 'out') computeAll(); renderSteps(); renderSide(); draw(); }

/* ───────── 오른쪽 패널 ───────── */
const TYPES = [['room', '실(냉방)'], ['corridor', '복도·홀'], ['wc', '화장실'], ['core', '계단실'], ['store', '설비·창고'], ['atrium', '중정(뚫림)'], ['elevator', '엘리베이터']];
const USES = Object.entries(P.USE_NAME);
const roomOptions = (val) => { const rooms = R.floors.flatMap(f => (RES.get(f.id)?.out.rooms || []).filter(r => r.type === 'room'));
  return `<option value="">— 방 선택 —</option>` + rooms.map(r => `<option value="${r.id}" ${r.id === val ? 'selected' : ''}>${r.id} ${esc(r.name.split(' ').slice(1).join(' '))}</option>`).join(''); };
function thumbs(list, selName){ return `<div class="thumbs">${list.map(p => `<div data-photo="${esc(p.file)}" class="${p.file === selName ? 'sel' : ''}"><img src="${esc(IMG.get(p.file)?.url || '')}"><span>${esc(p.tag || p.file)}</span></div>`).join('')}</div>`; }

function renderSide(){
  const s = $('#side'), f = F();
  let h = '';
  if (step === 'info') {
    const B = R.building;
    h = `<h2>1. 건물 정보</h2><p class="desc">건축물대장(공공)·설계도면에서 그대로 옮기는 값. 평면도의 크기 기준이 됩니다.</p>
      <div class="row"><label>이름</label><input data-b="name" value="${esc(B.name)}"></div>
      <div class="row"><label>캠퍼스</label><input data-b="campus" value="${esc(B.campus)}"></div>
      <div class="row"><label>가로(동서)</label><input type="number" step=".1" data-b="size.w" value="${B.size.w}"> m</div>
      <div class="row"><label>세로(남북)</label><input type="number" step=".1" data-b="size.d" value="${B.size.d}"> m</div>
      <div class="row"><label>층고</label><input type="number" step=".1" data-b="floorHeight" value="${B.floorHeight}"> m</div>
      <div class="row"><label>천장고</label><input type="number" step=".1" data-b="ceiling" value="${B.ceiling}"> m</div>
      <h3>층</h3><div class="list">${R.floors.map((x, i) => `<div class="item">${x.id}<span class="chip">${x.image ? esc(x.image) : '이미지 없음'}</span><span class="x" data-delfloor="${i}">삭제</span></div>`).join('')}</div>
      <div class="row"><button class="b" id="addFloor">+ 층 추가</button></div>`;
  }
  if (step === 'plan') {
    const res = RES.get(f.id), warn = res ? res.out.warn : [];
    const labelForm = sel?.op === 'label' || sel?.op === 'rect' ? labelEditor(sel) : '';
    h = `<h2>2. 평면도 → 공간</h2><p class="desc">피난안내도·와이파이맵·CAD 캡처 등 어떤 평면도든. 사진이면 기울어져도 됩니다.</p>
      <div class="row">${R.floors.map((x, i) => `<button class="b ${i === fi ? 'on' : ''}" data-floor="${i}">${x.id}</button>`).join('')}</div>
      <div class="row"><label>이미지</label><button class="b" id="pickPlan">${f.image ? esc(f.image) : '평면도 선택'}</button></div>
      <div class="row"><label>방식</label><select id="mode"><option value="auto" ${f.mode === 'auto' ? 'selected' : ''}>자동 (선 도면)</option><option value="fill" ${f.mode === 'fill' ? 'selected' : ''}>색 채움 (안내도·사인물)</option><option value="manual" ${f.mode === 'manual' ? 'selected' : ''}>수동 (사각형 트레이스)</option></select></div>
      <h3>도구</h3><div class="tools">
        ${[['corner', '① 모서리 4점'], ['label', '② 라벨'], ['wall', '벽 긋기'], ['gap', '벽 지우기'], ['merge', '합치기'], ['rect', '사각형'], ['footprint', '건물 윤곽'], ['idu', '실내기 표기'], ['erase', '조작 삭제']].concat(f.mode === 'fill' ? [['pick', '칠한 색 찍기']] : []).map(([k, t]) => `<button class="b ${tool === k ? 'on' : ''}" data-tool="${k}">${t}</button>`).join('')}
      </div>
      ${f.mode === 'auto' ? `<h3>벽 검출 <label style="font-weight:400;margin-left:8px"><input type="checkbox" id="showMask" ${showMask ? 'checked' : ''}> 검출된 벽 보기</label></h3>
        <div class="row"><label>어두움</label><input type="range" min="15" max="90" value="${f.params.dark}" data-p="dark"><span>${f.params.dark}</span></div>
        <div class="row"><label>채도 한계</label><input type="range" min="20" max="140" value="${f.params.sat}" data-p="sat"><span>${f.params.sat}</span></div>
        <div class="row"><label>틈 메움</label><input type="range" min="0" max="3" value="${f.params.close}" data-p="close"><span>${f.params.close}</span></div>` : ''}
      ${f.mode === 'fill' ? `<h3>색 채움 검출 <label style="font-weight:400;margin-left:8px"><input type="checkbox" id="showMask" ${showMask ? 'checked' : ''}> 칠한 영역 보기</label></h3>
        <div class="row"><label>칠한 색</label><span class="sw" style="background:${f.params.fill || '#8389b0'}"></span> ${f.params.fill || '#8389b0'} <span class="desc">'칠한 색 찍기'로 상점 칸 클릭</span></div>
        <div class="row"><label>판정 강도</label><input type="range" min="20" max="90" value="${Math.round((f.params.strength ?? .5) * 100)}" data-p="strength" data-scale=".01"><span>${(f.params.strength ?? .5).toFixed(2)}</span></div>` : ''}
      ${tool === 'idu' ? `<h3>실내기 표기 (도면·설비대장)</h3><div class="row">${['4WAY', '1WAY', 'WALL'].map(k => `<button class="b ${iduKind === k ? 'on' : ''}" data-idukind="${k}">${k}</button>`).join('')}</div>
        <div class="row"><label>근거</label><input id="iduFrom" value="${esc(iduFrom)}"></div><div class="desc">이 층 표기 ${f.ops.filter(o => o.op === 'idu').length}대 · 표기가 있는 방은 모델·사진보다 우선</div>` : ''}
      ${tool === 'footprint' ? `<div class="desc">윤곽 꼭짓점을 차례로 클릭, 첫 점을 다시 클릭하면 닫힘. 윤곽 밖은 건물 밖으로 봅니다 (곡선 입면·ㄱ자 건물). ${f.footprint ? `현재 ${f.footprint.length}점 <button class="b" id="clearFoot">윤곽 지우기</button>` : ''}</div>` : ''}
      ${labelForm}
      <h3>이 층의 조작 (${f.ops.length})</h3><div class="list">${f.ops.map((o, i) => `<div class="item ${sel === o ? 'sel' : ''}" data-op="${i}">${opText(o)}<span class="x" data-delop="${i}">×</span></div>`).join('') || '<span class="desc">아직 없음</span>'}</div>
      ${warn.length ? `<h3>확인 필요</h3>${warn.map(w => `<div class="warn">· ${esc(w)}</div>`).join('')}` : res ? '<h3>확인</h3><div class="ok">경고 없음</div>' : ''}
      ${res ? `<h3>결과</h3><div>${res.out.rooms.filter(r => r.type === 'room').length}개 실 · 전체 ${res.out.rooms.length}개 공간${res.out.meta.atrium ? ' · 중정' : ''}${res.out.meta.elevator ? ' · EV' : ''}</div>` : ''}`;
  }
  if (step === 'ext') {
    const p = R.exterior.photos.find(x => x.file === photoSel), w = R.exterior.window;
    h = `<h2>3. 외부 사진 → 층고·창 높이</h2><p class="desc">입면이 보이는 사진에서 슬래브 선(층 경계) 2개 이상과, 그 사이 창의 아랫선·윗선을 클릭합니다. 비율 × 층고 = 창 높이.</p>
      <div class="row"><button class="b" id="addExt">+ 외부 사진</button></div>${thumbs(R.exterior.photos, photoSel)}
      ${p ? `<h3>표시할 선</h3><div class="tools">${[['slab', '슬래브 선'], ['sill', '창 아랫선'], ['head', '창 윗선']].map(([k, t]) => `<button class="b ${tool === k ? 'on' : ''}" data-tool="${k}">${t}</button>`).join('')}</div>
        <div class="list">${p.marks.map((m, i) => `<div class="item">${({ slab:'슬래브', sill:'창 아래', head:'창 위' })[m.kind]} · y=${Math.round(m.y)}<span class="x" data-delmark="${i}">×</span></div>`).join('')}</div>` : ''}
      <h3>결과</h3>${w ? `<div>창 아래 <b>${w.sill} m</b> · 창 위 <b>${w.head} m</b> <span class="chip">사진 ${w.n}장</span></div>` : '<div class="desc">아직 없음 (기본값: 0.8 ~ 2.3 m)</div>'}`;
  }
  if (step === 'int') {
    const p = R.interior.find(x => x.file === photoSel);
    h = `<h2>4. 내부 사진 → 마감 색</h2><p class="desc">바닥·벽 영역을 드래그하면 그 안의 중앙값 색을 씁니다. 방 하나에 붙이거나, 같은 용도 전체의 대표 사진으로 지정합니다. 가구는 그리지 않습니다.</p>
      <div class="row"><button class="b" id="addInt">+ 내부 사진</button></div>${thumbs(R.interior.map(x => ({ ...x, tag:x.room || P.USE_NAME[x.use] || x.file })), photoSel)}
      ${p ? `<h3>적용 범위</h3>
        <div class="row"><label>방</label><select id="intRoom">${roomOptions(p.room)}</select></div>
        <div class="row"><label>또는 용도</label><select id="intUse"><option value="">—</option>${USES.map(([k, t]) => `<option value="${k}" ${p.use === k ? 'selected' : ''}>${t} 전체</option>`).join('')}</select></div>
        <h3>영역</h3><div class="tools">${[['floorBox', '바닥 영역'], ['wallBox', '벽 영역']].map(([k, t]) => `<button class="b ${tool === k ? 'on' : ''}" data-tool="${k}">${t}</button>`).join('')}</div>
        <div class="row">바닥 <span class="sw" style="background:${p.floor || 'transparent'}"></span> ${p.floor || '—'} &nbsp; 벽 <span class="sw" style="background:${p.wall || 'transparent'}"></span> ${p.wall || '—'}</div>
        <div class="row"><button class="b" id="delPhoto">사진 빼기</button></div>` : ''}`;
  }
  if (step === 'ac') {
    const p = R.acPhotos.find(x => x.file === photoSel);
    const counts = {}; for (const x of R.acPhotos) if (x.room) counts[x.room] = (counts[x.room] || 0) + x.marks.length;

function calcWindow(){
  const sills = [], heads = [];
  for (const p of R.exterior.photos) {
    const slabs = p.marks.filter(m => m.kind === 'slab').map(m => m.y).sort((a, b) => a - b);
    for (const m of p.marks.filter(m => m.kind !== 'slab')) {

  const th = t.closest('[data-photo]'); if (th) { photoSel = th.dataset.photo; tool = step === 'ext' ? 'slab' : step === 'int' ? 'floorBox' : '4WAY'; renderSide(); draw(); }
  if (t.id === 'addFloor') { const n = R.floors.length + 1; R.floors.push({ id:`${n}F`, image:null, corners:null, mode:'auto', params:{ dark:40, sat:70, close:1, minArea:3.5 }, ops:[] }); renderSide(); }
  if (t.id === 'pickPlan') pickFiles(names => { f.image = names[0]; f.corners = null; tool = 'corner'; pending = []; RECT.delete(f.id); RES.delete(f.id); renderSide(); draw(); });
  if (t.id === 'addExt') pickFiles(n => { n.forEach(file => R.exterior.photos.push({ file, marks:[] })); photoSel = n[0]; tool = 'slab'; renderSide(); draw(); });
  if (t.id === 'addInt') pickFiles(n => { n.forEach(file => R.interior.push({ file, use:'lecture' })); photoSel = n[0]; tool = 'floorBox'; renderSide(); draw(); });
  if (t.id === 'addAc') pickFiles(n => { n.forEach(file => R.acPhotos.push({ file, room:'', marks:[] })); photoSel = n[0]; tool = '4WAY'; renderSide(); draw(); });
  if (t.id === 'delPhoto') { for (const L of [R.interior, R.acPhotos]) { const i = L.findIndex(x => x.file === photoSel); if (i >= 0) L.splice(i, 1); } photoSel = null; renderSteps(); renderSide(); draw(); }
  // 대시보드의 '건물 추가'에서 열렸으면 만든 도면을 대시보드로 보냄 → 대시보드가 저장하고 그때부터 데이터 생성
  if (t.id === 'openTwin' && window.parent !== window) { window.parent.postMessage({ source:'twin', type:'buildingRendered', building:OUT.json }, '*'); return; }
  if (t.id === 'openTwin') { try { sessionStorage.setItem('twin:building', JSON.stringify(OUT.json)); } catch {} window.open('digital-twin.html', '_blank'); }
  if (t.id === 'dlBuilding') download('building.json', OUT.json);
  if (t.id === 'dlRecipe') download(`recipe-${R.id}.json`, cleanRecipe());
  if (t.id === 'dlIdf') { const { idf, zones } = EP.toIdf(OUT.json); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([idf], { type:'text/plain' })); a.download = 'in.idf'; a.click(); setTimeout(() => download('zones.json', zones), 200); }
  if (t.id === 'repeat') verifyRepeat();
  if (t.id === 'compare') verifyCompare();
});
$('#side').addEventListener('input', e => {
  const t = e.target, f = F();
  if (t.dataset.b) { const k = t.dataset.b.split('.'); let o = R.building; while (k.length > 1) o = o[k.shift()]; o[k[0]] = t.type === 'number' ? +t.value : t.value; RECT.clear(); renderSteps(); draw(); }
  if (t.dataset.p) { const v = +t.value * (+t.dataset.scale || 1); f.params[t.dataset.p] = v; t.nextElementSibling.textContent = t.dataset.scale ? v.toFixed(2) : t.value; clearTimeout(t._t); t._t = setTimeout(() => recompute(false), 150); }
  if (t.dataset.l && sel) { sel[t.dataset.l] = t.type === 'number' ? +t.value : t.value; clearTimeout(t._t); t._t = setTimeout(() => recompute(t.tagName === 'SELECT'), 250); }
  if (t.id === 'showMask') { showMask = t.checked; draw(); }
  if (t.id === 'iduFrom') iduFrom = t.value;
  if (t.dataset.ov && editSel) { const o = (((R.overrides ||= {}).rooms ||= {})[editSel] ||= {}); o[t.dataset.ov] = t.type === 'number' ? +t.value : t.value;
    clearTimeout(t._t); t._t = setTimeout(() => { computeAll(); if (t.tagName === 'SELECT') renderSide(); draw(); }, 300); }
  if (t.id === 'mdlEndpoint') { (R.acModel ||= {}).endpoint = t.value || undefined; }
  if (t.id === 'mdlConf') { (R.acModel ||= {}).minConfidence = +t.value / 100; t.nextElementSibling.textContent = (+t.value / 100).toFixed(2); OUT = null; draw(); }
  if (t.id === 'mode') { f.mode = t.value; recompute(); }
  if (t.id === 'intRoom' || t.id === 'intUse') { const p = R.interior.find(x => x.file === photoSel); p.room = $('#intRoom').value || undefined; p.use = p.room ? undefined : $('#intUse').value || undefined; renderSide(); }
  if (t.id === 'acRoom') { R.acPhotos.find(x => x.file === photoSel).room = t.value; renderSide(); }
});
function recompute(full = true){ compute(F()); OUT = null; renderSteps(); if (full) renderSide(); else renderSide(); draw(); }
async function prepFloor(){ const f = F(); await ensureImage(f.image); compute(f); }

/* 내보내기 · 검증 */
function download(name, obj){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 1)], { type:'application/json' })); a.download = name; a.click(); }
const cleanRecipe = () => JSON.parse(JSON.stringify(R, (k, v) => k.startsWith('_') ? undefined : v));
async function sha(obj){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify(obj))); return [...new Uint8Array(b)].slice(0, 8).map(x => x.toString(16).padStart(2, '0')).join(''); }
async function verifyRepeat(){
  const v = $('#verify'); v.innerHTML = '계산 중…';
  const h1 = await sha(OUT.json);
  const keep = R; R = JSON.parse(JSON.stringify(cleanRecipe())); RECT.clear(); RES.clear();
  const again = computeAll(); const h2 = await sha(again.json); R = keep;
  v.innerHTML = `<p>${h1 === h2 ? '<span class="ok">✔ 동일</span>' : '<span class="warn">✘ 다름</span>'} — 레시피를 새로 읽어 이미지부터 다시 계산</p><pre>1회차 ${h1}\n2회차 ${h2}</pre>`;
}
async function verifyCompare(){
  const v = $('#verify'); let ref;
  const refUrl = (R.base || '') + 'building.handtraced.json';
  try { ref = await (await fetch(refUrl, { cache:'no-store' })).json(); } catch { v.textContent = refUrl + '을 읽을 수 없음 (손으로 그린 기준 도면)'; return; }
  const area = p => { let s = 0; for (let i = 0; i < p.length; i++) { const [x0, y0] = p[i], [x1, y1] = p[(i + 1) % p.length]; s += x0 * y1 - x1 * y0; } return Math.abs(s) / 2; };
  const bb = p => ({ x0:Math.min(...p.map(q => q[0])), x1:Math.max(...p.map(q => q[0])), y0:Math.min(...p.map(q => q[1])), y1:Math.max(...p.map(q => q[1])) });
  const iou = (a, b) => { const A = bb(a), B = bb(b), w = Math.max(0, Math.min(A.x1, B.x1) - Math.max(A.x0, B.x0)), h = Math.max(0, Math.min(A.y1, B.y1) - Math.max(A.y0, B.y0)), I = w * h; return I / (area(a) + area(b) - I); };
  const rows = [];
  for (const f of OUT.json.floors) {
    const rf = ref.floors.find(x => x.id === f.id); if (!rf) continue;
    const mine = f.rooms.filter(r => r.type === 'room'), theirs = rf.rooms.filter(r => r.type === 'room');
    const ious = theirs.map(t => { const m = mine.find(r => r.number === t.number); return m ? iou(m.polygon, t.polygon) : 0; });
    const found = ious.filter(x => x > 0).length, good = ious.filter(x => x >= .8).length, mean = ious.reduce((s, x) => s + x, 0) / Math.max(1, ious.length);
    const ac = n => n.reduce((s, r) => s + ((n === mine ? OUT.json.idus : ref.idus).filter(a => a.room === r.id).length), 0);
    rows.push(`<tr><td>${f.id}</td><td>${found}/${theirs.length}</td><td>${good}</td><td>${(mean * 100).toFixed(0)}%</td><td>${ac(mine)} / ${ac(theirs)}</td></tr>`);
  }
  v.innerHTML = `<table><tr><th>층</th><th>찾은 실</th><th>IoU≥0.8</th><th>평균 IoU</th><th>실내기 (새/기존)</th></tr>${rows.join('')}</table>
    <p class="desc">IoU: 같은 호실끼리 겹치는 면적 비율. 1이면 완전히 같음.</p>`;
}

/* 위치 예측 모델 연결 */
function rasterUrl(img){ const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(img.data), img.width, img.height), 0, 0); return c.toDataURL('image/png'); }
function modelPackage(withImages){
  if (!OUT) computeAll();
  const inp = P.modelInput(R, OUT.planFloors), W = R.building.size.w, D = R.building.size.d, imgs = {};
  for (const f of OUT.planFloors) { const fl = inp.floors.find(x => x.id === f.id), rect = RES.get(f.id)?.rect;
    if (!rect) fl.plan = null; else if (withImages) imgs[fl.plan] = rasterUrl(rect);
    if (withImages) imgs[fl.walls] = rasterUrl(P.renderWalls(f, W, D)); }
  return { inp, imgs };
}
async function exportModelInput(){
  const { inp, imgs } = modelPackage(true);
  download('model-input.json', inp);
  for (const [name, url] of Object.entries(imgs)) { const a = document.createElement('a'); a.href = url; a.download = name; a.click(); await new Promise(r => setTimeout(r, 150)); }
  $('#mdlMsg').textContent = `model-input.json + PNG ${Object.keys(imgs).length}장 내려받음`;
}
function takePrediction(res, file){
  P.readPredictions(res);                       // 형식 확인 (틀리면 예외)
  R.acModel = { ...(R.acModel || {}), name:res.model?.name || res.model || '모델', file, result:res };
  OUT = null; renderSteps(); renderSide(); draw();
}
function loadPrediction(){ const f = $('#recipeFile'); f.value = ''; f.onchange = async () => { try { takePrediction(JSON.parse(await f.files[0].text()), f.files[0].name); } catch (e) { $('#mdlMsg').textContent = '읽기 실패: ' + e.message; } }; f.click(); }
// 연결 방법 두 가지: ① window.TWIN_AC_MODEL = async input => result (같은 페이지에서 돌리는 모델)  ② 모델 주소로 POST (JSON in → JSON out)
async function runModel(){
  const msg = $('#mdlMsg'), { inp, imgs } = modelPackage(true), body = { ...inp, images:imgs };
  try {
    let res;
    if (typeof window.TWIN_AC_MODEL === 'function') res = await window.TWIN_AC_MODEL(body);
    else if (R.acModel?.endpoint) { msg.textContent = '모델 실행 중…'; const r = await fetch(R.acModel.endpoint, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify(body) }); if (!r.ok) throw new Error('HTTP ' + r.status); res = await r.json(); }
    else { msg.textContent = '모델 주소를 넣거나 window.TWIN_AC_MODEL을 등록하세요'; return; }
    takePrediction(res, undefined); $('#mdlMsg').textContent = '예측을 받았습니다';
  } catch (e) { msg.textContent = '실행 실패: ' + e.message; }
}

/* 레시피 열기 */
async function openRecipe(rec){
  R = rec; RECT.clear(); RES.clear(); OUT = null; fi = 0;
  const files = new Set([...R.floors.map(f => f.image), ...R.exterior.photos.map(p => p.file), ...R.interior.map(p => p.file), ...R.acPhotos.map(p => p.file)].filter(Boolean));
  await Promise.all([...files].map(ensureImage));
  if (R.exterior.photos.length) calcWindow();
  if (R.acModel?.file && !R.acModel.result) try { R.acModel.result = await (await fetch((R.base || '') + R.acModel.file, { cache:'no-store' })).json(); } catch { console.warn('모델 결과 없음', R.acModel.file); }
  for (const p of R.interior) for (const k of ['floorBox', 'wallBox']) if (p[k] && IMG.has(p.file)) p[k === 'floorBox' ? 'floor' : 'wall'] = P.medianColor(IMG.get(p.file).data, p[k]);
  computeAll(); tool = F().corners ? 'label' : 'corner'; go('out');
}
$('#loadRecipe').onclick = () => { const f = $('#recipeFile'); f.value = ''; f.onchange = async () => { const rec = JSON.parse(await f.files[0].text()); rec.base ||= ''; await openRecipe(rec); }; f.click(); };
$('#sample').onchange = async e => { const url = e.target.value; if (!url) return; const rec = await (await fetch(url, { cache:'no-store' })).json(); await openRecipe(rec); e.target.value = ''; };
addEventListener('resize', draw);
window.PIPE = { get recipe(){ return R; }, get out(){ return OUT; }, openRecipe, computeAll, sha, pinRoomIdus, unitsOf };

renderSteps(); renderSide(); draw();
{ const q = new URLSearchParams(location.search), smp = q.get('sample');
  if (q.has('sample')) { const sel = $('#sample'); sel.value = smp && [...sel.options].some(o => o.value.includes(smp)) ? [...sel.options].find(o => o.value.includes(smp)).value : sel.options[1].value; sel.dispatchEvent(new Event('change')); } }
</script>
