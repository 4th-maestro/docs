<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twin Embed Example</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2.0.5/fonts/variable/woff2/SUIT-Variable.css">
<style>
  /* 임베드 예시(호스트 쪽): 앱 src/index.css 토큰과 같은 값, 시스템 설정 테마 */
  :root{ --page:#f5f5f3; --canvas:#ffffff; --surface-soft:#f7f7f7; --hairline:#dddddd; --ink:#222222; --body:#3f3f3f; --muted:#6a6a6a; --r-sm:8px; --r-md:14px; color-scheme:light; }
  @media (prefers-color-scheme: dark){ :root{ --page:#151618; --canvas:#1f2023; --surface-soft:#26282b; --hairline:#3a3c40; --ink:#e6e6e3; --body:#cfcfcb; --muted:#a2a29e; color-scheme:dark; } }
  *{box-sizing:border-box}
  body{margin:0;padding:24px;font:16px/1.5 'SUIT Variable',SUIT,-apple-system,system-ui,sans-serif;background:var(--page);color:var(--ink)}
  h1{font-size:21px;font-weight:700;margin:0 0 16px}
  .wrap{display:grid;grid-template-columns:1fr 320px;gap:24px}
  iframe{width:100%;height:620px;border:1px solid var(--hairline);border-radius:var(--r-md);background:var(--surface-soft)}
  .ctl{display:flex;flex-direction:column;gap:8px}
  button{min-height:44px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--hairline);background:var(--canvas);color:var(--ink);font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:left}
  button:hover{background:var(--surface-soft)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  pre{background:var(--canvas);color:var(--body);border:1px solid var(--hairline);padding:12px;border-radius:var(--r-sm);font-size:14px;height:240px;overflow:auto;margin:0}
  @media (max-width:800px){ body{padding:16px} .wrap{grid-template-columns:1fr} }
</style>
</head>
<body>
<h1>디지털 트윈 임베딩 예시</h1>
<div class="wrap">
  <iframe id="twin" src="digital-twin.html" title="건물 디지털 트윈"></iframe>
  <div class="ctl">
    <button id="b1">중앙제어기 데이터 보내기: 2F 6203 실내기 에러 CH05 · 흡입 31°C</button>
    <button id="b2">3F 평면도로 이동</button>
    <button id="b3">2F 6203 강의실 3D로 이동</button>
    <button id="b4">지표: 습도</button>
    <button id="b5">건물 전체로</button>
    <button id="b6">보는 사람: 시설 관리자</button>
    <button id="b7">보는 사람: 에너지 총괄</button>
    <pre id="log"></pre>
  </div>
</div>
<script>
  const twin = document.getElementById('twin'), log = document.getElementById('log');
  const send = m => twin.contentWindow.postMessage(m, '*');
  document.getElementById('b1').onclick = () => send({ type:'twin:update', data:{ schema:'twin.realtime/v1', idus:{ 'IDU-2F-6203-1':{ power:'off', error:'CH05', roomTemp:31, roomHum:80, kw:0 } } } });
  document.getElementById('b2').onclick = () => send({ type:'twin:navigate', view:'floor', floor:'3F' });
  document.getElementById('b3').onclick = () => send({ type:'twin:navigate', view:'room', room:'2F-6203' });
  document.getElementById('b4').onclick = () => send({ type:'twin:metric', metric:'hum' });
  document.getElementById('b5').onclick = () => send({ type:'twin:navigate', view:'building' });
  document.getElementById('b6').onclick = () => send({ type:'twin:persona', persona:'facility' });
  document.getElementById('b7').onclick = () => send({ type:'twin:persona', persona:'owner' });
  addEventListener('message', e => {
    if (e.source !== twin.contentWindow) return;
    const d = e.data, line = d.type === 'twin:ready' ? `${d.type} (${d.floors.length} floors)` : JSON.stringify(d).slice(0, 220);
    log.textContent = line + '\n' + log.textContent;
  });
</script>
</body>
</html>
