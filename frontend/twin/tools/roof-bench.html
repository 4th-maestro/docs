<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지붕 윤곽 검증</title>
<style>
  :root{--bg:#fff;--ink:#1d2433;--muted:#667085;--line:#e3e7ee}
  @media (prefers-color-scheme:dark){:root{--bg:#10141c;--ink:#e6eaf2;--muted:#98a2b3;--line:#2a3140}}
  body{margin:0;padding:16px;font:13px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
  h1{font-size:18px;margin:0 0 4px}.desc{color:var(--muted);margin:0 0 12px}
  table{border-collapse:collapse;margin:12px 0;font-variant-numeric:tabular-nums}td,th{border:1px solid var(--line);padding:4px 8px;text-align:right}th{text-align:center}
  .cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.case{border:1px solid var(--line);border-radius:8px;padding:6px}
  .case canvas{width:100%;display:block;margin-top:4px}.good{color:#1a7f37}.bad{color:#cf222e}
</style></head><body>
<h1>스카이뷰 지붕 윤곽 검증 (가짜 위성 사진)</h1>
<p class="desc">정답을 아는 건물(ㄱ·ㄷ·T·원형·곡선·사다리꼴·회전·중정·저층부+탑)을 땅·도로·주차장·이웃 건물·그림자·나무·옥상 설비·태양광판과 함께 그리고,
  지붕마다 한 번 클릭한 것으로 <code>extractRoof</code>가 딴 윤곽을 정답과 비교합니다. 노란 선 = 딴 윤곽, 빨간 점 = 클릭.
  주소 뒤 <code>?n=20&seed=1</code> · 옵션 시험 <code>&opt={"snap":false}</code></p>
<div id="sum">계산 중…</div><div class="cases" id="cases"></div>
<script type="module">
import { extractRoof } from '../pipeline/site-roof.js';
const q = new URLSearchParams(location.search), N = +(q.get('n') || 20), SEED = +(q.get('seed') || 1), OPT = JSON.parse(q.get('opt') || '{}');
const SZ = 1000, MPP = .3;     // 사진 1000 px, 0.3 m/px
function rng(seed){ let s = seed >>> 0 || 1; return () => ((s = Math.imul(s ^ s >>> 15, 1 | s), s ^= s + Math.imul(s ^ s >>> 7, 61 | s), (s ^ s >>> 14) >>> 0) / 4294967296); }
const SHAPES = ['rect', 'L', 'U', 'T', 'circle', 'curved', 'trapezoid', 'rotated', 'courtyard', 'tower'];
const ROOF = [[196, 196, 192], [112, 150, 120], [92, 94, 98], [206, 192, 166], [150, 162, 178], [178, 176, 170]];

/* 건물 모양: 로컬 좌표 고리들(첫 고리 = 바깥, 나머지 = 구멍) */
function shapeRings(type, rnd){
  const a = 70 + rnd() * 90, b = 55 + rnd() * 70, t = .35 + rnd() * .25;
  const R = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  switch (type) {
    case 'L': return [[[-a, -b], [a, -b], [a, -b + 2 * b * t], [-a + 2 * a * t, -b + 2 * b * t], [-a + 2 * a * t, b], [-a, b]]];
    case 'U': { const ia = a * (1 - t), ib = b * t; return [[[-a, -b], [a, -b], [a, b], [ia, b], [ia, -b + 2 * ib], [-ia, -b + 2 * ib], [-ia, b], [-a, b]]]; }
    case 'T': { const sa = a * t; return [[[-a, -b], [a, -b], [a, -b + 2 * b * t], [sa, -b + 2 * b * t], [sa, b], [-sa, b], [-sa, -b + 2 * b * t], [-a, -b + 2 * b * t]]]; }
    case 'circle': { const r = 60 + rnd() * 70; return [[...Array(72)].map((_, i) => [r * Math.cos(i * Math.PI / 36), r * Math.sin(i * Math.PI / 36)])]; }
    case 'curved': { const bulge = b * (.3 + rnd() * .5), pts = [[-a, -b], [a, -b], [a, b]]; for (let i = 1; i < 30; i++) { const x = a - 2 * a * i / 30; pts.push([x, b + bulge * Math.sin(Math.PI * i / 30)]); } pts.push([-a, b]); return [pts]; }
    case 'trapezoid': { const s = a * (.3 + rnd() * .3); return [[[-a + s, -b], [a - s * rnd(), -b], [a, b], [-a, b]]]; }
    case 'courtyard': { const ca = a * (.35 + rnd() * .2), cb = b * (.35 + rnd() * .2); return [R(-a, -b, a, b), R(-ca, -cb, ca, cb)]; }
    default: return [R(-a, -b, a, b)];
  }
}
function place(rings, cx, cy, ang){ const c = Math.cos(ang), s = Math.sin(ang); return rings.map(r => r.map(([x, y]) => [cx + x * c - y * s, cy + x * s + y * c])); }
function path(rings){ const p = new Path2D(); for (const r of rings) { r.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); p.closePath(); } return p; }
const rgb = (c, k = 0) => `rgb(${c.map(v => Math.max(0, Math.min(255, v + k))).join(',')})`;

function scene(rnd){
  const cv = new OffscreenCanvas(SZ, SZ), g = cv.getContext('2d');
  const sun = rnd() * Math.PI * 2, H = 25 + rnd() * 45, sv = [Math.cos(sun), Math.sin(sun)];
  // 땅
  const base = [[128, 126, 120], [150, 146, 138], [110, 112, 104]][Math.floor(rnd() * 3)];
  g.fillStyle = rgb(base); g.fillRect(0, 0, SZ, SZ);
  for (let k = 0; k < 2500; k++) { g.fillStyle = rgb(base, (rnd() - .5) * 30); g.fillRect(rnd() * SZ, rnd() * SZ, 2 + rnd() * 8, 2 + rnd() * 8); }
  for (let k = 0; k < 6; k++) { g.fillStyle = `rgb(${70 + rnd() * 30},${110 + rnd() * 30},${55 + rnd() * 25})`; g.beginPath(); g.ellipse(rnd() * SZ, rnd() * SZ, 40 + rnd() * 120, 30 + rnd() * 90, rnd() * 3, 0, 7); g.fill(); }
  // 도로(점선) + 주차장
  for (let k = 0; k < 2; k++) { const vert = rnd() < .5, pos = rnd() < .5 ? 40 + rnd() * 100 : SZ - 140 + rnd() * 100, wd = 40 + rnd() * 30;
    g.fillStyle = 'rgb(70,72,76)'; vert ? g.fillRect(pos, 0, wd, SZ) : g.fillRect(0, pos, SZ, wd);
    g.fillStyle = 'rgb(230,230,220)'; for (let t = 0; t < SZ; t += 40) vert ? g.fillRect(pos + wd / 2 - 1, t, 3, 20) : g.fillRect(t, pos + wd / 2 - 1, 20, 3); }
  { const px = rnd() * (SZ - 300), py = rnd() * (SZ - 160); g.fillStyle = 'rgb(88,90,94)'; g.fillRect(px, py, 300, 160); g.fillStyle = 'rgb(225,225,215)';
    for (let x = px; x < px + 300; x += 16) { g.fillRect(x, py, 2, 50); g.fillRect(x, py + 110, 2, 50); }
    for (let k = 0; k < 14; k++) { g.fillStyle = `hsl(${rnd() * 360} 40% ${30 + rnd() * 50}%)`; g.fillRect(px + 3 + Math.floor(rnd() * 18) * 16, py + (rnd() < .5 ? 8 : 116), 11, 26); } }
  // 대상 건물
  const type = SHAPES[Math.floor(rnd() * SHAPES.length)], cx = SZ / 2 + (rnd() - .5) * 140, cy = SZ / 2 + (rnd() - .5) * 140;
  const ang = type === 'rotated' || rnd() < .35 ? rnd() * Math.PI / 2 : 0, levels = [];
  if (type === 'tower') {
    const pa = 130 + rnd() * 60, pb = 100 + rnd() * 50, ta = pa * (.3 + rnd() * .2), tb = pb * (.3 + rnd() * .25), ox = (rnd() - .5) * (pa - ta), oy = (rnd() - .5) * (pb - tb);
    levels.push({ rings:place([[[-pa, -pb], [pa, -pb], [pa, pb], [-pa, pb]]], cx, cy, ang), h:H * .4 });
    levels.push({ rings:place([[[ox - ta, oy - tb], [ox + ta, oy - tb], [ox + ta, oy + tb], [ox - ta, oy + tb]]], cx, cy, ang), h:H * 2.2 });
  } else levels.push({ rings:place(shapeRings(type, rnd), cx, cy, ang), h:H });
  const bb = levels[0].rings[0].reduce((b, [x, y]) => [Math.min(b[0], x), Math.min(b[1], y), Math.max(b[2], x), Math.max(b[3], y)], [1e9, 1e9, -1e9, -1e9]);
  // 이웃 건물 (대상과 겹치지 않게, 가끔 바짝 붙임)
  const nb = [];
  for (let k = 0, tries = 0; k < 5 && tries < 60; tries++) { const w = 60 + rnd() * 140, h = 50 + rnd() * 120, x = rnd() * (SZ - w), y = rnd() * (SZ - h), gap = rnd() < .3 ? 4 : 25;
    if (x < bb[2] + gap && x + w > bb[0] - gap && y < bb[3] + gap && y + h > bb[1] - gap) continue; nb.push({ rings:[[[x, y], [x + w, y], [x + w, y + h], [x, y + h]]], h:15 + rnd() * 40, col:ROOF[Math.floor(rnd() * ROOF.length)] }); k++; }
  const shadow = (rings, h) => { const sh = new OffscreenCanvas(SZ, SZ), s = sh.getContext('2d'); s.fillStyle = '#000';
    for (let t = 0; t <= 1.0001; t += .05) { s.save(); s.translate(sv[0] * h * t, sv[1] * h * t); s.fill(path(rings), 'evenodd'); s.restore(); } g.globalAlpha = .42; g.drawImage(sh, 0, 0); g.globalAlpha = 1; };
  for (const b of nb) shadow(b.rings, b.h);
  for (const b of nb) { g.fillStyle = rgb(b.col); g.fill(path(b.rings)); g.strokeStyle = rgb(b.col, -30); g.lineWidth = 2; g.stroke(path(b.rings)); }
  // 대상 건물 그림자 → 지붕 (단마다: 아래 단 지붕 위에 윗단 그림자가 떨어짐)
  const truth = levels.map(() => new Uint8Array(SZ * SZ)), equip = new Uint8Array(SZ * SZ);
  const tc = new OffscreenCanvas(SZ, SZ), tg = tc.getContext('2d', { willReadFrequently:true });
  const roofCols = [];
  levels.forEach((L, li) => {
    shadow(L.rings, L.h);
    const col = li === 0 ? ROOF[Math.floor(rnd() * ROOF.length)] : ROOF[(ROOF.indexOf(roofCols[0]) + 1 + Math.floor(rnd() * (ROOF.length - 1))) % ROOF.length];
    roofCols.push(col);
    const p = path(L.rings);
    g.fillStyle = rgb(col); g.fill(p, 'evenodd');
    // 지붕 질감
    g.save(); g.clip(p, 'evenodd'); for (let k = 0; k < 900; k++) { g.fillStyle = rgb(col, (rnd() - .5) * 16); g.fillRect(rnd() * SZ * .0 + bb[0] - 40 + rnd() * (bb[2] - bb[0] + 80), bb[1] - 40 + rnd() * (bb[3] - bb[1] + 80), 3 + rnd() * 6, 3 + rnd() * 6); }
    // 옥상 설비 · 태양광판
    const inside = (x, y) => g.isPointInPath(p, x, y, 'evenodd');
    const eq = new Path2D();
    for (let k = 0, m = 2 + Math.floor(rnd() * 6), tr = 0; k < m && tr < 80; tr++) { const w = 6 + rnd() * 18, h = 6 + rnd() * 14, x = bb[0] + rnd() * (bb[2] - bb[0]), y = bb[1] + rnd() * (bb[3] - bb[1]);
      if (!(inside(x, y) && inside(x + w, y) && inside(x, y + h) && inside(x + w, y + h))) continue; k++;
      g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x + sv[0] * 4, y + sv[1] * 4, w, h); g.fillStyle = rgb([220, 222, 224], (rnd() - .5) * 40); g.fillRect(x, y, w, h); eq.rect(x - 2, y - 2, w + 4 + Math.abs(sv[0]) * 4, h + 4 + Math.abs(sv[1]) * 4); }
    if (rnd() < .45) { const x = bb[0] + rnd() * (bb[2] - bb[0]) * .6, y = bb[1] + rnd() * (bb[3] - bb[1]) * .6, cols = 3 + Math.floor(rnd() * 5), rows = 2 + Math.floor(rnd() * 3);
      if (inside(x, y) && inside(x + cols * 14, y) && inside(x, y + rows * 9) && inside(x + cols * 14, y + rows * 9)) { g.fillStyle = 'rgb(38,52,92)';
        for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) g.fillRect(x + i * 14, y + j * 9, 12, 7); eq.rect(x - 2, y - 2, cols * 14 + 4, rows * 9 + 4); } }
    g.restore();
    // 난간(파라펫)
    g.strokeStyle = rgb(col, rnd() < .5 ? 28 : -28); g.lineWidth = 3; g.stroke(p);
    // 정답: 이 단의 보이는 지붕 (윗단이 덮은 곳은 윗단 몫)
    tg.clearRect(0, 0, SZ, SZ); tg.fillStyle = '#fff'; tg.fill(p, 'evenodd'); for (const U of levels.slice(li + 1)) { tg.globalCompositeOperation = 'destination-out'; tg.fill(path(U.rings), 'evenodd'); tg.globalCompositeOperation = 'source-over'; }
    let d = tg.getImageData(0, 0, SZ, SZ).data; for (let i = 0; i < SZ * SZ; i++) truth[li][i] = d[i * 4] > 127 ? 1 : 0;
    tg.clearRect(0, 0, SZ, SZ); tg.fill(eq); d = tg.getImageData(0, 0, SZ, SZ).data; for (let i = 0; i < SZ * SZ; i++) if (d[i * 4 + 3] > 0) equip[i] = 1;
  });
  // 나무 (가장자리에 걸침)
  if (rnd() < .5) for (let k = 0; k < 3 + rnd() * 5; k++) { const r0 = levels[0].rings[0], e = Math.floor(rnd() * r0.length), [ax, ay] = r0[e], [bx, by] = r0[(e + 1) % r0.length], t = rnd(), x = ax + (bx - ax) * t, y = ay + (by - ay) * t;
    g.fillStyle = 'rgba(0,0,0,.3)'; g.beginPath(); g.arc(x + sv[0] * 8, y + sv[1] * 8, 8 + rnd() * 6, 0, 7); g.fill();
    g.fillStyle = `rgb(${50 + rnd() * 25},${85 + rnd() * 30},${45 + rnd() * 20})`; g.beginPath(); g.arc(x + (rnd() - .5) * 20, y + (rnd() - .5) * 20, 8 + rnd() * 8, 0, 7); g.fill(); }
  // 흐림 + 잡음
  const out = new OffscreenCanvas(SZ, SZ), og = out.getContext('2d'); og.filter = 'blur(0.8px)'; og.drawImage(cv, 0, 0);
  const img = og.getImageData(0, 0, SZ, SZ); for (let p = 0; p < img.data.length; p += 4) { const e = (rnd() - .5) * 14; img.data[p] += e; img.data[p + 1] += e; img.data[p + 2] += e; }
  // 클릭: 단마다, 설비가 아니고 가장자리에서 8px 이상 안쪽
  const seeds = truth.map(T => { for (let tr = 0; tr < 5000; tr++) { const x = Math.floor(bb[0] + rnd() * (bb[2] - bb[0])), y = Math.floor(bb[1] + rnd() * (bb[3] - bb[1])), p = y * SZ + x;
    if (x < 9 || y < 9 || x >= SZ - 9 || y >= SZ - 9 || !T[p] || equip[p]) continue;
    if ([[-8, 0], [8, 0], [0, -8], [0, 8], [6, 6], [-6, 6], [6, -6], [-6, -6]].every(([dx, dy]) => T[p + dy * SZ + dx] && !equip[p + dy * SZ + dx])) return [x, y]; } return null; });
  const union = new Uint8Array(SZ * SZ); for (const T of truth) for (let i = 0; i < union.length; i++) if (T[i]) union[i] = 1;
  return { img, type, levels, truth, union, seeds, hasHole:type === 'courtyard', truthVerts:type === 'circle' || type === 'curved' ? null : levels.reduce((s, L) => s + L.rings.reduce((a, r) => a + r.length, 0), 0) };
}

/* 채점 */
function raster(res){ const c = new OffscreenCanvas(SZ, SZ), g = c.getContext('2d', { willReadFrequently:true }); g.fillStyle = '#fff';
  for (const L of res.levels) g.fill(path([L.polygon, ...L.holes]), 'evenodd');
  const d = g.getImageData(0, 0, SZ, SZ).data, m = new Uint8Array(SZ * SZ); for (let i = 0; i < m.length; i++) m[i] = d[i * 4] > 127 ? 1 : 0; return m; }
function edt(m){   // 경계까지 거리 (체임퍼 3-4)
  const INF = 1e9, d = new Float32Array(SZ * SZ).fill(INF);
  for (let y = 1; y < SZ - 1; y++) for (let x = 1; x < SZ - 1; x++) { const p = y * SZ + x; if (m[p] && (!m[p - 1] || !m[p + 1] || !m[p - SZ] || !m[p + SZ])) d[p] = 0; }
  for (let y = 1; y < SZ - 1; y++) for (let x = 1; x < SZ - 1; x++) { const p = y * SZ + x; d[p] = Math.min(d[p], d[p - 1] + 3, d[p - SZ] + 3, d[p - SZ - 1] + 4, d[p - SZ + 1] + 4); }
  for (let y = SZ - 2; y > 0; y--) for (let x = SZ - 2; x > 0; x--) { const p = y * SZ + x; d[p] = Math.min(d[p], d[p + 1] + 3, d[p + SZ] + 3, d[p + SZ + 1] + 4, d[p + SZ - 1] + 4); }
  return d; }
function boundaryErr(a, b){ const da = edt(a), db = edt(b); let s = 0, k = 0;
  for (let y = 1; y < SZ - 1; y++) for (let x = 1; x < SZ - 1; x++) { const p = y * SZ + x;
    if (a[p] && (!a[p - 1] || !a[p + 1] || !a[p - SZ] || !a[p + SZ])) { s += Math.min(db[p] / 3, 60); k++; }
    if (b[p] && (!b[p - 1] || !b[p + 1] || !b[p - SZ] || !b[p + SZ])) { s += Math.min(da[p] / 3, 60); k++; } }
  return k ? s / k : 60; }
function iou(a, b){ let i = 0, u = 0; for (let p = 0; p < a.length; p++) { if (a[p] && b[p]) i++; if (a[p] || b[p]) u++; } return i / Math.max(1, u); }

const rows = [], cases = document.getElementById('cases'), pct = v => Math.round(v * 100) + '%';
for (let i = 0; i < N; i++) {
  const rnd = rng(SEED * 1000 + i), S = scene(rnd), seeds = S.seeds.filter(Boolean);
  const t0 = performance.now(); let R, err = null;
  try { R = extractRoof(S.img, seeds, OPT); } catch (e) { err = e; R = { levels:[] }; console.error(e); }
  const ms = performance.now() - t0, pred = raster(R), u = iou(pred, S.union), be = boundaryErr(pred, S.union) * MPP;
  const lvIou = S.truth.map((T, li) => { const L = R.levels.find(L => L.seed === S.seeds[li]); if (!L) return 0; const one = raster({ levels:[L] }); return iou(one, T); });
  const verts = R.levels.reduce((s, L) => s + L.polygon.length + L.holes.reduce((a, h) => a + h.length, 0), 0), holes = R.levels.reduce((s, L) => s + L.holes.length, 0);
  (window.CASES ||= []).push({ img:S.img, seeds, union:S.union, truth:S.truth });
  rows.push({ i, type:S.type, iou:u, be, lv:lvIou, verts, truthVerts:S.truthVerts, hasHole:S.hasHole, holes, ms, err:!!err });
  const d = document.createElement('div'); d.className = 'case';
  d.innerHTML = `<b>#${i + 1} ${S.type}</b> · IoU <b class="${u >= .9 ? 'good' : u < .75 ? 'bad' : ''}">${pct(u)}</b> · 경계 ${be.toFixed(2)} m · 꼭짓점 ${verts}${S.truthVerts ? '/' + S.truthVerts : ''}${S.hasHole ? ` · 중정 ${holes ? '찾음' : '<span class="bad">놓침</span>'}` : ''} · ${Math.round(ms)}ms${err ? ' <span class="bad">오류</span>' : ''}`;
  const cv = document.createElement('canvas'); cv.width = SZ; cv.height = SZ; const x = cv.getContext('2d'); x.putImageData(S.img, 0, 0);
  x.lineWidth = 3; x.strokeStyle = '#ffd400'; for (const L of R.levels) x.stroke(path([L.polygon, ...L.holes]));
  x.fillStyle = '#ff2d2d'; for (const s of seeds) { x.beginPath(); x.arc(s[0], s[1], 7, 0, 7); x.fill(); }
  d.append(cv); cases.append(d);
  await new Promise(r => setTimeout(r));
}
const avg = f => rows.reduce((a, r) => a + f(r), 0) / rows.length, poly = rows.filter(r => r.truthVerts), ring = rows.filter(r => r.hasHole);
const byType = {}; for (const r of rows) (byType[r.type] ||= []).push(r.iou);
document.getElementById('sum').innerHTML = `<table><tr><th>건물 윤곽 IoU</th><th>90% 이상</th><th>경계 평균 오차</th><th>꼭짓점 (딴/정답, 다각형)</th><th>중정 찾음</th><th>평균 시간</th></tr>
  <tr><td>${pct(avg(r => r.iou))}</td><td>${rows.filter(r => r.iou >= .9).length}/${rows.length}</td><td>${avg(r => r.be).toFixed(2)} m</td>
  <td>${poly.length ? (poly.reduce((a, r) => a + r.verts, 0) / poly.length).toFixed(1) + ' / ' + (poly.reduce((a, r) => a + r.truthVerts, 0) / poly.length).toFixed(1) : '–'}</td>
  <td>${ring.length ? ring.filter(r => r.holes).length + '/' + ring.length : '–'}</td><td>${Math.round(avg(r => r.ms))} ms</td></tr></table>
  <p class="desc">모양별 IoU: ${Object.entries(byType).map(([k, v]) => `${k} ${pct(v.reduce((a, b) => a + b, 0) / v.length)}`).join(' · ')}<br>사례 ${rows.length}개 · seed ${SEED} · 옵션 ${JSON.stringify(OPT)}</p>`;
window.BENCH = rows.map(r => ({ i:r.i, type:r.type, iou:+r.iou.toFixed(3), be:+r.be.toFixed(2), lv:r.lv.map(v => +v.toFixed(2)), verts:r.verts, tv:r.truthVerts, holes:r.holes, hasHole:r.hasHole, err:r.err }));
window.SUMMARY = { iou:+avg(r => r.iou).toFixed(3), be:+avg(r => r.be).toFixed(2), ge90:rows.filter(r => r.iou >= .9).length, n:rows.length, hole:ring.filter(r => r.holes).length + '/' + ring.length, byType:Object.fromEntries(Object.entries(byType).map(([k, v]) => [k, +(v.reduce((a, b) => a + b, 0) / v.length).toFixed(2)])) };
</script></body></html>
