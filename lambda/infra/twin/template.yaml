AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Maestro ② 디지털 트윈 데이터 기반(건물·호실·설비, 상태·이력, 기상·재실) - maestro 스택과 분리

# 배포: infra/twin/README.md (SAM CLI, 스택 maestro-twin)
# - 기존 maestro 스택(template.yaml)과 독립: 팀원 배포와 서로 덮어쓰지 않음
# - 모든 테이블 온디맨드(PAY_PER_REQUEST), 이력성 테이블은 ttl 속성(epoch 초)으로 자동 삭제
# - 테이블은 AWS::DynamoDB::Table 유지: SAM SimpleTable은 정렬 키·Streams·TTL 미지원
# - 다음 단계: weather·simulator Lambda(AWS::Serverless::Function)와 EventBridge 주기 실행 추가

Parameters:
  Prefix:
    Type: String
    Default: maestro
    Description: 테이블 이름 앞머리(예 maestro-Buildings)

Resources:
  # 건물 목록: src/buildings.json 필드 그대로(floors, hours, weekend, waste, remap 등)
  BuildingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Buildings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: buildingId, AttributeType: S}
      KeySchema:
        - {AttributeName: buildingId, KeyType: HASH}

  # 건물별 호실: buildings.rooms(bid) 결과(가상 건물 호실 id는 "건물.층.GUID")
  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Rooms
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: buildingId, AttributeType: S}
        - {AttributeName: roomId, AttributeType: S}
      KeySchema:
        - {AttributeName: buildingId, KeyType: HASH}
        - {AttributeName: roomId, KeyType: RANGE}

  # 냉난방 실내기: 현재는 호실당 1대(idu), ratedKw는 sim.rated()와 같은 식, LG 모델 매핑은 이후 채움
  EquipmentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Equipment
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: buildingId, AttributeType: S}
        - {AttributeName: equipmentId, AttributeType: S}
      KeySchema:
        - {AttributeName: buildingId, KeyType: HASH}
        - {AttributeName: equipmentId, KeyType: RANGE}

  # 호실 현재 상태(시뮬레이터가 덮어씀): sim.state() 필드 + updatedAt
  # Streams(NEW_AND_OLD_IMAGES): 이후 ws-push Lambda가 변경분만 골라 WebSocket으로 전송
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-State
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: buildingId, AttributeType: S}
        - {AttributeName: roomId, AttributeType: S}
      KeySchema:
        - {AttributeName: buildingId, KeyType: HASH}
        - {AttributeName: roomId, KeyType: RANGE}
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # 호실 상태 이력: pk=<건물>#<호실>, ts=ISO 시각(KST), ttl 30일(시뮬레이터가 기록)
  TimeseriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Timeseries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: ts, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: ts, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # 기상 관측: location=관측 지점(예 기상청 격자 "nx,ny"), ts=ISO 시각(KST), ttl
  WeatherTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Weather
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: location, AttributeType: S}
        - {AttributeName: ts, AttributeType: S}
      KeySchema:
        - {AttributeName: location, KeyType: HASH}
        - {AttributeName: ts, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # 호실 재실 인원 이력: pk=<건물>#<호실>, ts=ISO 시각(KST), ttl
  OccupancyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Occupancy
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: ts, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: ts, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

Outputs:
  BuildingsTableName:
    Value: !Ref BuildingsTable
    Export: {Name: !Sub '${AWS::StackName}-BuildingsTable'}
  RoomsTableName:
    Value: !Ref RoomsTable
    Export: {Name: !Sub '${AWS::StackName}-RoomsTable'}
  EquipmentTableName:
    Value: !Ref EquipmentTable
    Export: {Name: !Sub '${AWS::StackName}-EquipmentTable'}
  StateTableName:
    Value: !Ref StateTable
    Export: {Name: !Sub '${AWS::StackName}-StateTable'}
  StateStreamArn:
    Description: ws-push Lambda 트리거용
    Value: !GetAtt StateTable.StreamArn
    Export: {Name: !Sub '${AWS::StackName}-StateStreamArn'}
  TimeseriesTableName:
    Value: !Ref TimeseriesTable
    Export: {Name: !Sub '${AWS::StackName}-TimeseriesTable'}
  WeatherTableName:
    Value: !Ref WeatherTable
    Export: {Name: !Sub '${AWS::StackName}-WeatherTable'}
  OccupancyTableName:
    Value: !Ref OccupancyTable
    Export: {Name: !Sub '${AWS::StackName}-OccupancyTable'}
