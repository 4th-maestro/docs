AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Maestro ② 디지털 트윈 데이터 기반(건물·호실·설비, 상태·이력, 기상·재실) - maestro 스택과 분리

# 배포: infra/twin/README.md (SAM CLI, 스택 maestro-twin)
# - 기존 maestro 스택(template.yaml)과 독립: 팀원 배포와 서로 덮어쓰지 않음
# - 모든 테이블 온디맨드(PAY_PER_REQUEST), 이력성 테이블은 ttl 속성(epoch 초)으로 자동 삭제
# - 테이블은 AWS::DynamoDB::Table 유지: SAM SimpleTable은 정렬 키·Streams·TTL 미지원
# - simulator: 1분마다 전 호실 상태 계산(src/sim.py) → State 덮어쓰기, HistoryEveryMinutes분마다 Timeseries·Occupancy 추가

Parameters:
  Prefix:
    Type: String
    Default: maestro
    Description: 테이블 이름 앞머리(예 maestro-Buildings)
  SimulatorEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 1분 스케줄 실행 여부. 쓰기 비용(State 1분 + 이력 5분, 하루 약 92만 건)이 있어 기본 꺼짐, 데모·검증 기간에만 true
  HistoryEveryMinutes:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 60
    Description: Timeseries·Occupancy 기록 주기(분 정각 기준)
  SchedulesTableName:
    Type: String
    Default: ''
    Description: maestro 스택의 스케줄 테이블 이름(저장된 스케줄 반영). 비우면 스케줄 없이 계산
  OwnersTableName:
    Type: String
    Default: ''
    Description: maestro 스택의 BuildingOwnersTable 이름(고객사가 수정한 운영 시간 반영). 비우면 원본 값

Conditions:
  SimulatorOn: !Equals [!Ref SimulatorEnabled, 'true']
  HasSchedules: !Not [!Equals [!Ref SchedulesTableName, '']]
  HasOwners: !Not [!Equals [!Ref OwnersTableName, '']]

Resources:
  # 건물 목록: src/buildings.json 필드 그대로(floors, hours, weekend, waste, remap 등)
  BuildingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Buildings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: buildingId, AttributeType: S}
      KeySchema:
        - {AttributeName: buildingId, KeyType: HASH}

  # 건물별 호실: buildings.rooms(bid) 결과(가상 건물 호실 id는 "건물.층.GUID")
  RoomsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Rooms
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: buildingId, AttributeType: S}
        - {AttributeName: roomId, AttributeType: S}
      KeySchema:
        - {AttributeName: buildingId, KeyType: HASH}
        - {AttributeName: roomId, KeyType: RANGE}

  # 냉난방 실내기: 현재는 호실당 1대(idu), ratedKw는 sim.rated()와 같은 식, LG 모델 매핑은 이후 채움
  EquipmentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Equipment
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: buildingId, AttributeType: S}
        - {AttributeName: equipmentId, AttributeType: S}
      KeySchema:
        - {AttributeName: buildingId, KeyType: HASH}
        - {AttributeName: equipmentId, KeyType: RANGE}

  # 호실 현재 상태(시뮬레이터가 덮어씀): sim.state() 필드 + updatedAt
  # Streams(NEW_AND_OLD_IMAGES): 이후 ws-push Lambda가 변경분만 골라 WebSocket으로 전송
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-State
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: buildingId, AttributeType: S}
        - {AttributeName: roomId, AttributeType: S}
      KeySchema:
        - {AttributeName: buildingId, KeyType: HASH}
        - {AttributeName: roomId, KeyType: RANGE}
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # 호실 상태 이력: pk=<건물>#<호실>, ts=ISO 시각(KST), ttl 30일(시뮬레이터가 기록)
  TimeseriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Timeseries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: ts, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: ts, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # 기상 관측: location=관측 지점(예 기상청 격자 "nx,ny"), ts=ISO 시각(KST), ttl
  WeatherTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Weather
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: location, AttributeType: S}
        - {AttributeName: ts, AttributeType: S}
      KeySchema:
        - {AttributeName: location, KeyType: HASH}
        - {AttributeName: ts, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # 호실 재실 인원 이력: pk=<건물>#<호실>, ts=ISO 시각(KST), ttl
  OccupancyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Prefix}-Occupancy
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: ts, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: ts, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # 팀 공용 모듈(src/: sim, buildings, common, tenant 등)을 import만 하기 위한 Layer. src/requirements.txt도 함께 설치
  TwinSrcLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${AWS::StackName}-src
      Description: Lambda/src 모듈(simulator가 import)
      ContentUri: ../../src/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64

  # 1분 주기 상태 계산(functions/simulator.py): 로컬 계산 533호실 약 50ms, 쓰기 포함 실행 시간은 배포 후 측정
  SimulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: simulator.handler
      CodeUri: functions/
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 1024
      # 다음 1분 실행과 겹치지 않게 1분 미만
      Timeout: 50
      Layers: [!Ref TwinSrcLayer]
      # 실패 시 다음 분 실행이 같은 일을 하므로 비동기 재시도 없음
      EventInvokeConfig: {MaximumRetryAttempts: 0}
      Environment:
        Variables:
          BUILDINGS_TABLE: !Ref BuildingsTable
          ROOMS_TABLE: !Ref RoomsTable
          STATE_TABLE: !Ref StateTable
          TIMESERIES_TABLE: !Ref TimeseriesTable
          OCCUPANCY_TABLE: !Ref OccupancyTable
          HISTORY_EVERY_MIN: !Ref HistoryEveryMinutes
          SCHEDULES_TABLE: !If [HasSchedules, !Ref SchedulesTableName, !Ref AWS::NoValue]
          OWNERS_TABLE: !If [HasOwners, !Ref OwnersTableName, !Ref AWS::NoValue]
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref BuildingsTable}
        - DynamoDBReadPolicy: {TableName: !Ref RoomsTable}
        - DynamoDBWritePolicy: {TableName: !Ref StateTable}
        - DynamoDBWritePolicy: {TableName: !Ref TimeseriesTable}
        - DynamoDBWritePolicy: {TableName: !Ref OccupancyTable}
        - !If [HasSchedules, {DynamoDBReadPolicy: {TableName: !Ref SchedulesTableName}}, !Ref AWS::NoValue]
        - !If [HasOwners, {DynamoDBReadPolicy: {TableName: !Ref OwnersTableName}}, !Ref AWS::NoValue]
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            State: !If [SimulatorOn, ENABLED, DISABLED]
            RetryPolicy: {MaximumRetryAttempts: 0}

  SimulatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SimulatorFunction}
      RetentionInDays: 14

Outputs:
  SimulatorFunctionName:
    Value: !Ref SimulatorFunction
  BuildingsTableName:
    Value: !Ref BuildingsTable
    Export: {Name: !Sub '${AWS::StackName}-BuildingsTable'}
  RoomsTableName:
    Value: !Ref RoomsTable
    Export: {Name: !Sub '${AWS::StackName}-RoomsTable'}
  EquipmentTableName:
    Value: !Ref EquipmentTable
    Export: {Name: !Sub '${AWS::StackName}-EquipmentTable'}
  StateTableName:
    Value: !Ref StateTable
    Export: {Name: !Sub '${AWS::StackName}-StateTable'}
  StateStreamArn:
    Description: ws-push Lambda 트리거용
    Value: !GetAtt StateTable.StreamArn
    Export: {Name: !Sub '${AWS::StackName}-StateStreamArn'}
  TimeseriesTableName:
    Value: !Ref TimeseriesTable
    Export: {Name: !Sub '${AWS::StackName}-TimeseriesTable'}
  WeatherTableName:
    Value: !Ref WeatherTable
    Export: {Name: !Sub '${AWS::StackName}-WeatherTable'}
  OccupancyTableName:
    Value: !Ref OccupancyTable
    Export: {Name: !Sub '${AWS::StackName}-OccupancyTable'}
