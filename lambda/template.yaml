AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Maestro 건물 운영 디지털트윈 API와 웹 호스팅

Parameters:
  ModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-5-5
    # 비용 상한: Sonnet 5.5 이하만 허용(2026-11-20 결정)
    AllowedValues: [global.anthropic.claude-sonnet-5-5, global.anthropic.claude-haiku-5-5]
  BedrockRegion:
    Type: String
    Default: ap-northeast-2
  AllowedOrigin:
    Type: String
    Default: '*'
  TwinPrefix:
    Type: String
    # 건물·호실 테이블: maestro-twin 스택(infra/twin/template.yaml)의 <Prefix>-Buildings, <Prefix>-Rooms
    Default: maestro

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    # CPU는 메모리에 비례(1,769MB에서 vCPU 1개). 512MB(약 0.3 vCPU)는 첫 호출 2.6~2.9초(2026-11-20 실측)
    MemorySize: 1024
    Timeout: 10
    Environment:
      Variables:
        SCHEDULES_TABLE: !Ref SchedulesTable
        CHAT_TABLE: !Ref ChatTable
        BUILDINGS_TABLE: !Sub '${TwinPrefix}-Buildings'
        ROOMS_TABLE: !Sub '${TwinPrefix}-Rooms'
        # 기업·구성원·건물 소속·변경 이력(tenant.py). MEMBERS_TABLE이 있으면 소속 검사 활성
        COMPANIES_TABLE: !Ref CompaniesTable
        MEMBERS_TABLE: !Ref MembersTable
        OWNERS_TABLE: !Ref BuildingOwnersTable
        AUDIT_TABLE: !Ref AuditTable

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE]
        AllowHeaders: [content-type, authorization]
      # 모든 경로 로그인 필수: Cognito 액세스 토큰(Authorization: Bearer), CORS 사전 요청은 제외
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  SchedulesTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey: {Name: id, Type: String}

  # 대화 기록(90일)과 대화 메모리(24시간), ttl 속성으로 자동 삭제(chat.py)
  ChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # 가입 허용 목록(이전 가입 방식): 사용하는 코드 없음, 기존 항목 보존용으로 유지
  # - 삭제 예정: 기업 코드 가입 운영 확인 후 제거
  AllowTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey: {Name: entry, Type: String}

  # 기업(판매사가 등록): 기업 코드 가입 확인용 보조 인덱스 code-index
  CompaniesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: companyId, AttributeType: S}, {AttributeName: code, AttributeType: S}]
      KeySchema: [{AttributeName: companyId, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - {IndexName: code-index, KeySchema: [{AttributeName: code, KeyType: HASH}], Projection: {ProjectionType: ALL}}

  # 구성원(키 Cognito sub): 기업, 역할(manager·operator), 이메일, 가입일
  # - 가입 대기: 키 pending#<소문자 이메일>, 2일 뒤 ttl로 자동 삭제
  MembersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: sub, AttributeType: S}, {AttributeName: companyId, AttributeType: S}]
      KeySchema: [{AttributeName: sub, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - {IndexName: company-index, KeySchema: [{AttributeName: companyId, KeyType: HASH}], Projection: {ProjectionType: ALL}}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # 건물 소속 기업: 트윈 Buildings 테이블은 적재 스크립트가 항목 전체를 덮어써서 별도 테이블
  BuildingOwnersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: buildingId, AttributeType: S}, {AttributeName: companyId, AttributeType: S}]
      KeySchema: [{AttributeName: buildingId, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - {IndexName: company-index, KeySchema: [{AttributeName: companyId, KeyType: HASH}], Projection: {ProjectionType: ALL}}

  # 변경 이력: 기업별, 정렬 키 at = <ISO 시각>#<uuid>, 항목 actor{sub, email, role}, action, target, detail
  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: companyId, AttributeType: S}, {AttributeName: at, AttributeType: S}]
      KeySchema: [{AttributeName: companyId, KeyType: HASH}, {AttributeName: at, KeyType: RANGE}]

  # 운영자 계정: 기업 코드로 자체 가입(가입 전 검사), 이메일 인증 코드 확인 후 구성원 등록(가입 확인 트리거), 비밀번호 재설정은 인증된 이메일
  # - 메일 발송: Cognito 기본 메일(하루 50통, 발신 no-reply@verificationemail.com)
  # - 이름 Maestro 유지: 사용자 풀 이름 변경은 재생성(기존 계정 삭제)
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: maestro-operators
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        InviteMessageTemplate:
          EmailSubject: 에게(에너지게이트) 계정 안내
          EmailMessage: '에게(에너지게이트) 계정이 발급되었습니다. 아이디 {username}, 임시 비밀번호 {####}로 로그인한 뒤 새 비밀번호를 설정하십시오.'
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: 에게(에너지게이트) 인증 코드
        EmailMessage: '에게(에너지게이트) 인증 코드는 {####}입니다. 화면에 입력하십시오.'
      AccountRecoverySetting: {RecoveryMechanisms: [{Name: verified_email, Priority: 1}]}
      LambdaConfig: {PreSignUp: !GetAtt PreSignUpFunction.Arn, PostConfirmation: !GetAtt PostConfirmationFunction.Arn}
      Policies:
        PasswordPolicy: {MinimumLength: 10, RequireLowercase: true, RequireNumbers: true, RequireUppercase: false, RequireSymbols: false, TemporaryPasswordValidityDays: 7}

  # 웹 클라이언트: 비밀 키 없음, 비밀번호·갱신 토큰 인증, 계정 존재 여부 노출 방지
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admin
      Description: 판매사 총관리자(모든 기업·건물 관리)

  # 가입 전 검사(signup.py): 기업 코드 확인, 가입 대기 항목 저장
  # - 사용자 풀 → 함수 참조라 함수 쪽 환경 변수에 사용자 풀을 넣지 않음(순환 참조)
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: signup.handler
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref CompaniesTable}
        - DynamoDBWritePolicy: {TableName: !Ref MembersTable}

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # 가입 확인 트리거(confirm.py): 이메일 인증 후 가입 대기 항목을 구성원으로 전환, 변경 이력 기록
  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: confirm.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref MembersTable}
        - DynamoDBWritePolicy: {TableName: !Ref AuditTable}

  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  WsAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: auth.handler
      Environment:
        Variables: {USER_POOL_ID: !Ref UserPool, USER_POOL_CLIENT_ID: !Ref UserPoolClient}

  WsAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref WsApi
      AuthorizerType: REQUEST
      Name: maestro-ws-auth
      IdentitySource: [route.request.querystring.token]
      AuthorizerUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsAuthorizerFunction.Arn}/invocations

  WsAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/authorizers/${WsAuthorizer}

  # 조회·관리 API 통합 함수(api.py): 화면 1개당 콜드 스타트 1회
  # - 메모리 1769MB(vCPU 1개): 전력 분석 월 비교 첫 호출(로컬 2.0초)과 전체 현황 계산
  # - 권한: 스케줄·대화·기업·구성원·건물 소속·변경 이력 테이블, 사용자 목록 조회(관리자 API·이메일 조회, 권한 판정은 tenant.py)
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.handler
      MemorySize: 1769
      Timeout: 29
      Environment:
        Variables: {USER_POOL_ID: !Ref UserPool, PLANS_BUCKET: !Ref PlansBucket}
      Policies:
        - DynamoDBReadPolicy: {TableName: !Sub '${TwinPrefix}-Buildings'}
        - DynamoDBReadPolicy: {TableName: !Sub '${TwinPrefix}-Rooms'}
        - S3ReadPolicy: {BucketName: !Ref PlansBucket}
        - DynamoDBCrudPolicy: {TableName: !Ref SchedulesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ChatTable}
        - DynamoDBCrudPolicy: {TableName: !Ref CompaniesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref MembersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref BuildingOwnersTable}
        - DynamoDBCrudPolicy: {TableName: !Ref AuditTable}
        - Statement:
            - Effect: Allow
              Action: [cognito-idp:ListUsers, cognito-idp:ListUsersInGroup]
              Resource: !GetAtt UserPool.Arn
      Events:
        Status: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /rooms/status, Method: GET}}
        History: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /rooms/history, Method: GET}}
        Buildings: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /buildings, Method: GET}}
        Plan: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/buildings/{id}/plan', Method: GET}}
        Recommend: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /recommendations, Method: GET}}
        Anomalies: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /anomalies, Method: GET}}
        ListSchedules: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /schedules, Method: GET}}
        SaveSchedule: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /schedules, Method: POST}}
        CancelSchedule: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/schedules/{id}', Method: DELETE}}
        GetChat: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /chat, Method: GET}}
        ClearChat: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /chat, Method: DELETE}}
        Compare: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /energy/compare, Method: GET}}
        Trend: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /energy/trend, Method: GET}}
        Heatmap: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /energy/heatmap, Method: GET}}
        Breakdown: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /energy/breakdown, Method: GET}}
        Users: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /admin/users, Method: GET}}
        ListCompanies: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /admin/companies, Method: GET}}
        CreateCompany: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /admin/companies, Method: POST}}
        GetCompany: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/admin/companies/{id}', Method: GET}}
        UpdateCompany: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/admin/companies/{id}', Method: PATCH}}
        DeleteCompany: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/admin/companies/{id}', Method: DELETE}}
        CompanyCode: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/admin/companies/{id}/code', Method: POST}}
        AdminBuildings: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /admin/buildings, Method: GET}}
        AssignBuilding: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/admin/buildings/{id}/company', Method: PUT}}
        Me: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /me, Method: GET}}
        AdminUpdateMember: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/admin/companies/{id}/members/{sub}', Method: PATCH}}
        AdminRemoveMember: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/admin/companies/{id}/members/{sub}', Method: DELETE}}
        AdminCompanyAudit: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/admin/companies/{id}/audit', Method: GET}}
        # 고객사 설정(customer.py): 기업 코드 가입, 기업 정보, 구성원, 변경 이력, 건물 정보 수정
        JoinCompany: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /me/join, Method: POST}}
        MyCompany: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /company, Method: GET}}
        UpdateMyCompany: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /company, Method: PATCH}}
        UpdateMember: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/company/members/{sub}', Method: PATCH}}
        RemoveMember: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/company/members/{sub}', Method: DELETE}}
        MyCompanyAudit: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /company/audit, Method: GET}}
        UpdateBuilding: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/buildings/{id}', Method: PATCH}}

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: query.handler
      Timeout: 30
      Environment:
        Variables: {MODEL_ID: !Ref ModelId, BEDROCK_REGION: !Ref BedrockRegion, KB_ID: !Ref KnowledgeBase}
      Policies:
        - DynamoDBReadPolicy: {TableName: !Sub '${TwinPrefix}-Buildings'}
        - DynamoDBReadPolicy: {TableName: !Sub '${TwinPrefix}-Rooms'}
        - DynamoDBReadPolicy: {TableName: !Ref SchedulesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ChatTable}
        - DynamoDBReadPolicy: {TableName: !Ref MembersTable}
        # 건물 소속·건물 수정 정보(overrides), 중지 기업 확인(tenant.py, buildings.py)
        - DynamoDBReadPolicy: {TableName: !Ref BuildingOwnersTable}
        - DynamoDBReadPolicy: {TableName: !Ref CompaniesTable}
        - Statement:
            - Effect: Allow
              # 응답 스트리밍(messages.stream)은 InvokeModelWithResponseStream 권한 필요
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              # global 추론 프로필은 프로필 ARN과 리전 없는 기반 모델 ARN 권한이 모두 필요
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}
                - !Sub
                  - arn:aws:bedrock:*::foundation-model/${Base}
                  - Base: !Select [1, !Split ['global.', !Ref ModelId]]
            - Effect: Allow
              Action: bedrock:Retrieve
              Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
      Events:
        Post: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /query, Method: POST}}

  # AI 질의 단계 실시간 전송: 클라이언트가 {action: 'ask'}를 보내면 WsFunction이 단계 이벤트를 연결로 전송
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsFunction.Arn}/invocations

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $connect
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref WsAuthorizer
      Target: !Sub integrations/${WsIntegration}

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $disconnect
      Target: !Sub integrations/${WsIntegration}

  WsAskRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: ask
      Target: !Sub integrations/${WsIntegration}

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    # 라우트가 없는 상태의 첫 자동 배포 실패 방지
    DependsOn: [WsConnectRoute, WsDisconnectRoute, WsAskRoute]
    Properties: {ApiId: !Ref WsApi, StageName: prod, AutoDeploy: true}

  WsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*

  WsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ws.handler
      # 통합 응답 대기는 29초에서 끊기지만 함수는 계속 실행되어 이벤트 전송, 화면 제한 45초보다 길게 설정
      Timeout: 60
      Environment:
        Variables: {MODEL_ID: !Ref ModelId, BEDROCK_REGION: !Ref BedrockRegion, KB_ID: !Ref KnowledgeBase}
      Policies:
        - DynamoDBReadPolicy: {TableName: !Sub '${TwinPrefix}-Buildings'}
        - DynamoDBReadPolicy: {TableName: !Sub '${TwinPrefix}-Rooms'}
        - DynamoDBReadPolicy: {TableName: !Ref SchedulesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ChatTable}
        - DynamoDBReadPolicy: {TableName: !Ref MembersTable}
        # 건물 소속·건물 수정 정보(overrides), 중지 기업 확인(tenant.py, buildings.py)
        - DynamoDBReadPolicy: {TableName: !Ref BuildingOwnersTable}
        - DynamoDBReadPolicy: {TableName: !Ref CompaniesTable}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}
                - !Sub
                  - arn:aws:bedrock:*::foundation-model/${Base}
                  - Base: !Select [1, !Split ['global.', !Ref ModelId]]
            - Effect: Allow
              Action: bedrock:Retrieve
              Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/prod/POST/@connections/*

  # 규정·쾌적성 문서 RAG(FR-18). 원본은 KbDocsBucket(lambda/kb, tools/kb_sync.sh로 동기화와 수집)
  # 벡터 저장소는 S3 Vectors: OpenSearch Serverless 최소 월 약 214달러 대신 사용량 과금(2026-11-20 Seoul 단가 조회)
  KbDocsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}

  KbVectorBucket:
    Type: AWS::S3Vectors::VectorBucket

  KbIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt KbVectorBucket.VectorBucketArn
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        # Bedrock이 청크 원문과 메타데이터를 넣는 키는 필터 대상에서 제외(필터 메타데이터 크기 한도)
        NonFilterableMetadataKeys: [AMAZON_BEDROCK_TEXT, AMAZON_BEDROCK_METADATA]

  KbRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: bedrock.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}}
      Policies:
        - PolicyName: kb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
              - Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource: [!GetAtt KbDocsBucket.Arn, !Sub '${KbDocsBucket.Arn}/*']
              - Effect: Allow
                Action: [s3vectors:PutVectors, s3vectors:GetVectors, s3vectors:DeleteVectors, s3vectors:QueryVectors, s3vectors:GetIndex, s3vectors:ListVectors]
                Resource: !GetAtt KbIndex.IndexArn

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub ${AWS::StackName}-docs
      RoleArn: !GetAtt KbRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
          EmbeddingModelConfiguration: {BedrockEmbeddingModelConfiguration: {Dimensions: 1024}}
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration: {IndexArn: !GetAtt KbIndex.IndexArn}

  KbDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: docs
      DataSourceConfiguration:
        Type: S3
        S3Configuration: {BucketArn: !GetAtt KbDocsBucket.Arn}
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration: {MaxTokens: 300, OverlapPercentage: 20}

  # 건물 도면(내장 3D 형식): plans/<건물>/current.json, v<번호>.json. 판매사·고객사 구조 1단계(2026-11-20)
  PlansBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOac
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html}

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  WebUrl:
    Value: !Sub https://${WebDistribution.DomainName}
  WebBucketName:
    Value: !Ref WebBucket
  PlansBucketName:
    Description: tools/upload_plans.py 도면 적재 대상
    Value: !Ref PlansBucket
  WsUrl:
    Description: Frontend VITE_WS_URL 값
    Value: !Sub wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  KbId:
    Value: !Ref KnowledgeBase
  KbDataSourceId:
    Value: !GetAtt KbDataSource.DataSourceId
  KbDocsBucketName:
    Description: tools/kb_sync.sh 문서 동기화 대상
    Value: !Ref KbDocsBucket
