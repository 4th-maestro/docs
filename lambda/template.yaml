AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Maestro 건물 운영 디지털트윈 API와 웹 호스팅

Parameters:
  ModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-5-5
    # 비용 상한: Sonnet 5.5 이하만 허용(2026-11-20 결정)
    AllowedValues: [global.anthropic.claude-sonnet-5-5, global.anthropic.claude-haiku-5-5]
  BedrockRegion:
    Type: String
    Default: ap-northeast-2
  AllowedOrigin:
    Type: String
    Default: '*'

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 512
    Timeout: 10
    Environment:
      Variables:
        SCHEDULES_TABLE: !Ref SchedulesTable
        CHAT_TABLE: !Ref ChatTable
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, DELETE]
        AllowHeaders: [content-type, authorization]
      # 모든 경로 로그인 필수: Cognito 액세스 토큰(Authorization: Bearer), CORS 사전 요청은 제외
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  SchedulesTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey: {Name: id, Type: String}

  # 대화 기록(90일)과 대화 메모리(24시간), ttl 속성으로 자동 삭제(chat.py)
  ChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: sk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: sk, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  # 운영자 계정: 관리자 발급(자체 가입 없음), 이메일 로그인, 첫 로그인 비밀번호 변경
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: maestro-operators
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      AccountRecoverySetting: {RecoveryMechanisms: [{Name: admin_only, Priority: 1}]}
      Policies:
        PasswordPolicy: {MinimumLength: 10, RequireLowercase: true, RequireNumbers: true, RequireUppercase: false, RequireSymbols: false, TemporaryPasswordValidityDays: 7}

  # 웹 클라이언트: 비밀 키 없음, 비밀번호·갱신 토큰 인증, 계정 존재 여부 노출 방지
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: chat.handler
      Policies: [DynamoDBCrudPolicy: {TableName: !Ref ChatTable}]
      Events:
        Get: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /chat, Method: GET}}
        Delete: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /chat, Method: DELETE}}

  # WebSocket 연결 인증: 쿼리 token(액세스 토큰) 검증(auth.py), 결과 sub를 ask 라우트로 전달
  WsAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: auth.handler

  WsAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref WsApi
      AuthorizerType: REQUEST
      Name: maestro-ws-auth
      IdentitySource: [route.request.querystring.token]
      AuthorizerUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsAuthorizerFunction.Arn}/invocations

  WsAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/authorizers/${WsAuthorizer}

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: status.handler
      Policies: [DynamoDBReadPolicy: {TableName: !Ref SchedulesTable}]
      Events:
        Get: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /rooms/status, Method: GET}}

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: query.handler
      Timeout: 30
      Environment:
        Variables: {MODEL_ID: !Ref ModelId, BEDROCK_REGION: !Ref BedrockRegion}
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref SchedulesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ChatTable}
        - Statement:
            - Effect: Allow
              # 응답 스트리밍(messages.stream)은 InvokeModelWithResponseStream 권한 필요
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              # global 추론 프로필은 프로필 ARN과 리전 없는 기반 모델 ARN 권한이 모두 필요
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}
                - !Sub
                  - arn:aws:bedrock:*::foundation-model/${Base}
                  - Base: !Select [1, !Split ['global.', !Ref ModelId]]
      Events:
        Post: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /query, Method: POST}}

  # AI 질의 단계 실시간 전송: 클라이언트가 {action: 'ask'}를 보내면 WsFunction이 단계 이벤트를 연결로 전송
  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsFunction.Arn}/invocations

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $connect
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref WsAuthorizer
      Target: !Sub integrations/${WsIntegration}

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $disconnect
      Target: !Sub integrations/${WsIntegration}

  WsAskRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: ask
      Target: !Sub integrations/${WsIntegration}

  WsStage:
    Type: AWS::ApiGatewayV2::Stage
    # 라우트가 없는 상태의 첫 자동 배포 실패 방지
    DependsOn: [WsConnectRoute, WsDisconnectRoute, WsAskRoute]
    Properties: {ApiId: !Ref WsApi, StageName: prod, AutoDeploy: true}

  WsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/*

  WsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ws.handler
      # 통합 응답 대기는 29초에서 끊기지만 함수는 계속 실행되어 이벤트 전송, 화면 제한 45초보다 길게 설정
      Timeout: 60
      Environment:
        Variables: {MODEL_ID: !Ref ModelId, BEDROCK_REGION: !Ref BedrockRegion}
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref SchedulesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ChatTable}
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource:
                - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}
                - !Sub
                  - arn:aws:bedrock:*::foundation-model/${Base}
                  - Base: !Select [1, !Split ['global.', !Ref ModelId]]
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WsApi}/prod/POST/@connections/*

  SchedulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: schedules.handler
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref SchedulesTable}
        - DynamoDBCrudPolicy: {TableName: !Ref ChatTable}
      Events:
        List: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /schedules, Method: GET}}
        Create: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /schedules, Method: POST}}
        Delete: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/schedules/{id}', Method: DELETE}}

  RecommendFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: recommend.handler
      Policies: [DynamoDBReadPolicy: {TableName: !Ref SchedulesTable}]
      Events:
        Get: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /recommendations, Method: GET}}

  AnomaliesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: anomalies.handler
      Policies: [DynamoDBReadPolicy: {TableName: !Ref SchedulesTable}]
      Events:
        Get: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /anomalies, Method: GET}}

  HistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: history.handler
      Policies: [DynamoDBReadPolicy: {TableName: !Ref SchedulesTable}]
      Events:
        Get: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /rooms/history, Method: GET}}

  # 전체 현황: 건물 4곳 호실 533개의 현재 상태, 오늘 사용량, 추천 합계 계산
  PortfolioFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: portfolio.handler
      Policies: [DynamoDBReadPolicy: {TableName: !Ref SchedulesTable}]
      Events:
        Get: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /buildings, Method: GET}}

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebOac
            S3OriginConfig: {OriginAccessIdentity: ''}
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html}

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  WebUrl:
    Value: !Sub https://${WebDistribution.DomainName}
  WebBucketName:
    Value: !Ref WebBucket
  WsUrl:
    Description: Frontend VITE_WS_URL 값
    Value: !Sub wss://${WsApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
